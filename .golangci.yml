version: "2"

run:
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gochecknoinits
    - gochecknoglobals
    - gocritic
    - gosec
    - iface
    - interfacebloat
    - misspell
    - modernize
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testifylint
    - unconvert
    - wrapcheck
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    interfacebloat:
      # ActivityState grew a twelfth method for which provider recorded a ride
      # and what it wrote; still one responsibility, one target's recorded
      # activities.
      max: 12
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
