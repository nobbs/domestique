# Copy this file outside the repository, then replace every placeholder and
# provide each referenced secret file. The file itself contains no secret value.

[http]
listen_address = ":8080"

[access]
tailnet_user_login = "you@example.ts.net"

# Optional public path, served through Cloudflare Access and a Cloudflare Tunnel
# whose origin is this service's Tailscale Service name. Omit the whole section
# to keep the service reachable only from the Tailnet; a partly filled section
# is rejected at startup rather than silently ignored.
#
# None of these is a secret. The team domain and the audience tag are public
# identifiers, and verification uses Cloudflare's published signing keys. The
# audience tag is what confines an assertion to this one application: without
# it, a token minted for any other application of the same team would verify.
#
# [access.cloudflare]
# team_domain = "yourteam.cloudflareaccess.com"
# application_aud = "the AUD tag of the Access application"
# allowed_email = "you@example.com"

[state]
database_path = "/var/lib/domestique/state.db"
encryption_key_file = "/run/secrets/state_encryption_key"

[veloplanner]
base_url = "https://veloplanner.com"
email_file = "/run/secrets/veloplanner_email"
password_file = "/run/secrets/veloplanner_password"

[wahoo]
api_base_url = "https://api.sandbox.wahooligan.com"
oauth_base_url = "https://api.sandbox.wahooligan.com"
client_id = "replace-with-client-id"
client_secret_file = "/run/secrets/wahoo_client_secret"
# Must be the URL a browser returns to after authorising Wahoo, and must match
# the callback registered with Wahoo. Use the public hostname when the
# Cloudflare path is deployed, because the redirect lands in an ordinary browser
# that may not be on the Tailnet; use the Tailnet URL otherwise.
redirect_url = "https://domestique.example.com/oauth/wahoo/callback"

[[wahoo.targets]]
id = "rider-a"

[[wahoo.targets]]
id = "rider-b"

[sync]
initial_delay = "1m"
interval = "1h"
max_deletions_per_target = 5
empty_source_deletion = "deny"

[notifications.pushover]
application_token_file = "/run/secrets/pushover_application_token"
user_key_file = "/run/secrets/pushover_user_key"

[webui]
# The MapLibre style the route map view loads in your browser. The default is a
# keyless provider, so nothing identifies you to it and no credential reaches the
# page. Your browser still requests tiles for the area of a route you open, which
# is the one thing this service sends outside the Tailnet.
#
# A provider requiring an API key would carry it in this URL's query, where it is
# visible to anyone who can load the UI. Self-hosted tiles avoid both concerns.
tile_style_url = "https://tiles.openfreemap.org/styles/bright"

[surface]
# The Overpass endpoint the service asks which OpenStreetMap ways lie along a
# stage, so it can tell asphalt from paving, gravel, or a forest track. The
# default public instance needs no account and no key.
#
# This one is the service talking, not your browser: it sends a simplified form
# of each stage's shape, so the endpoint learns where your routes go. Nothing
# else is sent, and each stage is asked about once — the answer is cached until
# you re-plan that stage. Point this at your own Overpass instance to keep the
# shapes on your infrastructure, or set it to "" to switch the lookup off and
# leave stages unclassified.
overpass_url = "https://overpass-api.de/api/interpreter"
