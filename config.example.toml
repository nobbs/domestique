# Copy this file outside the repository, then replace every placeholder and
# provide each referenced secret file. The file itself contains no secret value.

[http]
listen_address = ":8080"

# The readiness probe's own listener. Optional; this is the default. It is a
# second port rather than a second path so that only the served one is given to
# `tailscale serve`, which keeps readiness reachable from host-local health
# checking and off the authenticated public surface. Its port must differ from
# listen_address above.
readiness_address = ":8081"

# Cloudflare Access is the only way in. Every request must carry an assertion
# this service can verify, including requests that reach Tailscale Serve from
# inside the Tailnet. The section is required in full: a service that cannot
# verify an assertion cannot authenticate anyone, so an incomplete section is
# refused at startup rather than left answering every request with a 401.
#
# None of these is a secret. The team domain and the audience tag are public
# identifiers, and verification uses Cloudflare's published signing keys. The
# audience tag is what confines an assertion to this one application: without
# it, a token minted for any other application of the same team would verify.
[access.cloudflare]
team_domain = "yourteam.cloudflareaccess.com"
application_aud = "the AUD tag of the Access application"
allowed_email = "you@example.com"

[state]
database_path = "/var/lib/domestique/state.db"
encryption_key_file = "/run/secrets/state_encryption_key"

# At least one source must be configured below: [veloplanner], [komoot], or
# both. Each is independent — configuring one does not require the other, and
# neither is a special case of the other in this file's schema.

[veloplanner]
base_url = "https://veloplanner.com"
email_file = "/run/secrets/veloplanner_email"
password_file = "/run/secrets/veloplanner_password"

# Komoot reads the operator's own account through the unofficial
# api.komoot.de interface, exchanging email and password for a session token
# at runtime — the partner OAuth2 interface needs credentials issued only
# under a partner contract, so it is not what this reads.
[komoot]
base_url = "https://api.komoot.de"
email_file = "/run/secrets/komoot_email"
password_file = "/run/secrets/komoot_password"

[wahoo]
api_base_url = "https://api.sandbox.wahooligan.com"
oauth_base_url = "https://api.sandbox.wahooligan.com"
client_id = "replace-with-client-id"
client_secret_file = "/run/secrets/wahoo_client_secret"
# Must be the URL a browser returns to after authorising Wahoo, and must match
# the callback registered with Wahoo. Use the public hostname when the
# Cloudflare path is deployed, because the redirect lands in an ordinary browser
# that may not be on the Tailnet; use the Tailnet URL otherwise.
#
# Its origin is also the one a state-changing request must come from, because it
# is the hostname a browser reaches this service at. A request to a sync trigger,
# the schedule switch, or a stage reprocess that names any other origin — or
# none — is refused, so that an authenticated session cannot be driven from
# another site.
redirect_url = "https://domestique.example.com/oauth/wahoo/callback"

[[wahoo.targets]]
id = "rider-a"

[[wahoo.targets]]
id = "rider-b"

[sync]
# How long after start the first run is attempted. It is a file setting because
# it is consumed once, at the start it delays: a value edited later would change
# nothing until the restart an editable setting exists to avoid.
initial_delay = "1m"

# The credentials a notification is sent with. Whether notifications are sent at
# all, how much a routine success reports, and the origin they are sent to are
# settings you edit on the service's own settings page — they live in the state
# database and take effect on the next run rather than the next restart.
[notifications.pushover]
application_token_file = "/run/secrets/pushover_application_token"
user_key_file = "/run/secrets/pushover_user_key"

# The map cartographies the page offers, the OpenStreetMap regions the surface
# index is built from, how often it is rebuilt, how long the source inventory may
# go unrefreshed before it is reported stale, and whether a trusted empty source
# may delete a target's last routes are all settings you edit on the service's
# own settings page. They live in the state database, so a change takes effect on
# the next run or the next request rather than on the next restart, and this file
# refuses them by name if an older copy of it still carries them.

[ridemodel]
# The coefficient file the offline fitting tooling emits: total riding mass,
# sustained power, drag area, and rolling resistance per surface class, fitted
# to a corpus of your own recorded rides rather than guessed. The service
# reads it once at startup and computes a predicted moving time per stage.
#
# Unlike every other file path in this example, this one is not a secret: it
# carries fitted physical constants, not a credential or route data.
#
# The default is no file, which switches prediction off entirely: no stage
# anywhere carries a predicted time. A missing, malformed, or physically
# implausible file is a startup failure rather than a silent fallback.
# coefficients_file = "/etc/domestique/ridemodel.toml"
