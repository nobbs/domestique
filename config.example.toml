# Copy this file outside the repository, then replace every placeholder and
# provide the referenced secret file. The file itself contains no secret value.
#
# This is the whole of it: where to listen, who may call, and where the state
# lives. Every provider, credential and schedule the service works with is a
# setting you edit on its own settings page, stored in the state database. A
# copy of this file that still carries one of those sections is refused at
# startup, naming the section, rather than silently ignored.

[http]
listen_address = ":8080"

# The readiness probe's own listener. Optional; this is the default. It is a
# second port rather than a second path so that only the served one is given to
# `tailscale serve`, which keeps readiness reachable from host-local health
# checking and off the authenticated public surface. Its port must differ from
# listen_address above.
readiness_address = ":8081"

# The address a browser reaches this service at. Use the public hostname when
# the Cloudflare path is deployed, because the OAuth redirect lands in an
# ordinary browser that may not be on the Tailnet; use the Tailnet URL
# otherwise. It must be an absolute HTTPS origin with no path.
#
# It is the one origin a state-changing request may come from, and the Wahoo
# callback is derived from it. A request to a sync trigger, the schedule switch,
# or a stage reprocess that names any other origin — or none — is refused, so
# that an authenticated session cannot be driven from another site.
browser_origin_url = "https://domestique.example.com"

# Cloudflare Access is the only way in. Every request must carry an assertion
# this service can verify, including requests that reach Tailscale Serve from
# inside the Tailnet. The section is required in full: a service that cannot
# verify an assertion cannot authenticate anyone, so an incomplete section is
# refused at startup rather than left answering every request with a 401.
#
# None of these is a secret. The team domain and the audience tag are public
# identifiers, and verification uses Cloudflare's published signing keys. The
# audience tag is what confines an assertion to this one application: without
# it, a token minted for any other application of the same team would verify.
[access.cloudflare]
team_domain = "yourteam.cloudflareaccess.com"
application_aud = "the AUD tag of the Access application"
allowed_email = "you@example.com"

# The database every runtime setting and every credential is stored in, and the
# key the credentials are encrypted with. Losing the key means re-entering the
# credentials on the settings page; it does not lose the routes.
[state]
database_path = "/var/lib/domestique/state.db"
encryption_key_file = "/run/secrets/state_encryption_key"
