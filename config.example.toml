# Copy this file outside the repository, then replace every placeholder and
# provide each referenced secret file. The file itself contains no secret value.

[http]
listen_address = ":8080"

# The readiness probe's own listener. Optional; this is the default. It is a
# second port rather than a second path so that only the served one is given to
# `tailscale serve`, which keeps readiness reachable from host-local health
# checking and off the authenticated public surface. Its port must differ from
# listen_address above.
readiness_address = ":8081"

# Cloudflare Access is the only way in. Every request must carry an assertion
# this service can verify, including requests that reach Tailscale Serve from
# inside the Tailnet. The section is required in full: a service that cannot
# verify an assertion cannot authenticate anyone, so an incomplete section is
# refused at startup rather than left answering every request with a 401.
#
# None of these is a secret. The team domain and the audience tag are public
# identifiers, and verification uses Cloudflare's published signing keys. The
# audience tag is what confines an assertion to this one application: without
# it, a token minted for any other application of the same team would verify.
[access.cloudflare]
team_domain = "yourteam.cloudflareaccess.com"
application_aud = "the AUD tag of the Access application"
allowed_email = "you@example.com"

[state]
database_path = "/var/lib/domestique/state.db"
encryption_key_file = "/run/secrets/state_encryption_key"

[veloplanner]
base_url = "https://veloplanner.com"
email_file = "/run/secrets/veloplanner_email"
password_file = "/run/secrets/veloplanner_password"

[wahoo]
api_base_url = "https://api.sandbox.wahooligan.com"
oauth_base_url = "https://api.sandbox.wahooligan.com"
client_id = "replace-with-client-id"
client_secret_file = "/run/secrets/wahoo_client_secret"
# Must be the URL a browser returns to after authorising Wahoo, and must match
# the callback registered with Wahoo. Use the public hostname when the
# Cloudflare path is deployed, because the redirect lands in an ordinary browser
# that may not be on the Tailnet; use the Tailnet URL otherwise.
#
# Its origin is also the one a state-changing request must come from, because it
# is the hostname a browser reaches this service at. A request to a sync trigger,
# the schedule switch, or a stage reprocess that names any other origin — or
# none — is refused, so that an authenticated session cannot be driven from
# another site.
redirect_url = "https://domestique.example.com/oauth/wahoo/callback"

[[wahoo.targets]]
id = "rider-a"

[[wahoo.targets]]
id = "rider-b"

[sync]
initial_delay = "1m"
interval = "1h"
max_deletions_per_target = 5
empty_source_deletion = "deny"

[notifications]
# How much a routine successful run tells you. A failure, a blocked run, and the
# first success that ends one are always sent, whatever this says: they are the
# signals notifications exist for, and no policy here can hold them back.
#
#   every  — one message per successful run. The default, and what a deployment
#            that says nothing about this keeps.
#   quiet  — say nothing while the service is healthy.
#   digest — replace the per-run message with one aggregate message per period.
#
# A digest carries counts alone: how many runs of each half succeeded and how
# many routes they created, updated and deleted. It names no route, no target
# and no run.
success_policy = "every"

# The period one digest covers, read only by the digest policy. It is sent by
# the first run to finish after the period elapses, so a service that is not
# running sends nothing rather than an empty message. At most seven days: a
# digest totals the recorded run history, and a longer period would report a
# total missing every run already pruned from under it.
digest_interval = "24h"

[notifications.pushover]
application_token_file = "/run/secrets/pushover_application_token"
user_key_file = "/run/secrets/pushover_user_key"

[webui]
# The MapLibre style the route map view loads in your browser. The default is a
# keyless provider, so nothing identifies you to it and no credential reaches the
# page. Your browser still requests tiles for the area of a route you open, which
# is the one thing this service sends outside the Tailnet.
#
# A provider requiring an API key would carry it in this URL's query, where it is
# visible to anyone who can load the UI. Self-hosted tiles avoid both concerns.
tile_style_url = "https://tiles.openfreemap.org/styles/bright"

# The style loaded instead when your system asks for a dark colour scheme, which
# is how the map follows the rest of the UI after dark. It must be on the same
# host as the style above: the page is confined to one tile origin, and that is
# also the only origin a route's viewport is revealed to. Leave it empty for a
# provider that publishes one style, and the map keeps that style in both schemes.
tile_style_url_dark = "https://tiles.openfreemap.org/styles/dark"

[surface]
# The OpenStreetMap regions the service builds its own surface index from, so it
# can tell asphalt from paving, gravel, or a forest track. Each entry is a
# Geofabrik region path.
#
# Name the regions you actually ride. Naming more only costs disk and build time
# for map nobody will be matched against. The default is an empty list, which
# switches classification off entirely: nothing is downloaded, no index is built,
# and stages carry no surface.
#
# No route shape ever leaves this host — classification reads a local file. The
# only thing that goes out is the scheduled download of each region's published
# extract, which tells the extract host which regions you care about and nothing
# about any route.
regions = []
# regions = ["europe/germany/rheinland-pfalz", "europe/germany/hessen"]

# How often the index is rebuilt. This is time between builds, not time since
# this process started, so restarting the service does not restart the clock.
#
# A rebuild fetches each region's published checksum first and stops there when
# nothing upstream has changed, so a weekly cadence costs one small request per
# region on most weeks. The index is written beside the state database, and a
# build needs about half a gigabyte of memory and a few hundred megabytes of
# disk for the extract it stages.
rebuild_interval = "168h"
