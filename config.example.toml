# Copy this file outside the repository, then replace every placeholder and
# provide the two referenced secret files. The file itself contains no secret
# value.
#
# This is the whole of it: where to listen, who may call, and where the state
# lives. Every provider, credential and schedule the service works with is a
# setting you edit on its own settings page, stored in the state database. A
# copy of this file that still carries one of those sections is refused at
# startup, naming the section, rather than silently ignored.

[http]
listen_address = ":8080"

# The readiness probe's own listener. Optional; this is the default. It is a
# second port rather than a second path so that only the served one is given to
# the reverse proxy, which keeps readiness reachable from host-local health
# checking and off the public surface. Its port must differ from
# listen_address above.
readiness_address = ":8081"

# The address a browser reaches this service at, behind the reverse proxy.
# The OAuth and Auth0 redirects both land in an ordinary browser, so this has
# to be the address that browser can reach. It must be an absolute HTTPS
# origin with no path.
#
# It is the one origin a state-changing request may come from, and the Wahoo
# callback and the Auth0 callback are both derived from it. A request to a
# sync trigger, the schedule switch, a stage reprocess, sign-in start, or
# sign-out that names any other origin — or none — is refused, so that a
# session cannot be driven from another site.
browser_origin_url = "https://domestique.example.com"

# Auth0 is the only way in. Every request needs a session this service issued
# from an ID token it verified itself against this tenant. The section is
# required in full: a service that cannot verify a session cannot authenticate
# anyone, so an incomplete section is refused at startup rather than left
# answering every request with a 401. Who may sign in at all, and who among
# them holds cross-subject rights, is decided by a post-login Action in the
# tenant itself — this file holds nothing about either.
#
# Neither domain nor client_id is a secret: verification uses Auth0's
# published signing keys. The client secret is the one part of this section
# that is secret, so it names a file rather than carrying a value here, the
# same way the state encryption key below does.
[auth.auth0]
domain = "yourtenant.eu.auth0.com"
client_id = "the application's client ID"
client_secret_file = "/run/secrets/auth0_client_secret"

# The database every runtime setting and every credential is stored in, and the
# key the credentials are encrypted with. Losing the key means re-entering the
# credentials on the settings page; it does not lose the routes.
[state]
database_path = "/var/lib/domestique/state.db"
encryption_key_file = "/run/secrets/state_encryption_key"
