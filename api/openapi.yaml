openapi: 3.1.0
info:
  title: Domestique API
  version: 2.0.0
  description: |
    The API contract served by Domestique. JSON property names are camelCase.
    All routes except `GET /healthz` require the browser session cookie;
    state-changing routes also require the same-origin `Origin` header. The
    sign-in routes under `/auth/` are browser navigation rather than API
    operations, and are not described here.
servers:
  - url: /
security:
  - session: []
x-domestique-unmatched-path:
  status: 404
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
tags:
  - name: browser-api
    description: Programmatic same-origin API used by the embedded UI.
  - name: oauth
  - name: readiness
    description: Loopback readiness listener, served separately from the public handler.
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
        - readiness
      operationId: getReadiness
      security: []
      x-domestique-listener: readiness
      responses:
        "200":
          description: Local state is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        "503":
          description: Local state is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unready'
  /v1/status:
    get:
      tags:
        - browser-api
      operationId: getStatus
      responses:
        "200":
          description: Current local status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/tasks:
    get:
      tags:
        - browser-api
      operationId: listTasks
      security:
        - session: []
      description: >-
        Every background activity this build registers, in the order a status
        page reads best.
      responses:
        "200":
          description: The registered tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/tasks/{name}/schedule:
    put:
      tags:
        - browser-api
      operationId: setTaskSchedule
      security:
        - session: []
          browserOrigin: []
      description: >-
        Sets whether the schedule may start this task. It governs unattended
        runs only: a task switched off still runs when an operator asks for it.
      parameters:
        - $ref: '#/components/parameters/TaskName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskScheduleUpdate'
      responses:
        "200":
          description: The registered tasks, as they now stand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/tasks/{name}/run:
    post:
      tags:
        - browser-api
      operationId: runTask
      security:
        - session: []
          browserOrigin: []
      description: >-
        Starts one attempt of a task and reports whether it was accepted. An
        accepted attempt continues independently of this request.
      parameters:
        - $ref: '#/components/parameters/TaskName'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/TaskInProgress'
  /v1/tasks/{name}/run/{argument}:
    post:
      tags:
        - browser-api
      operationId: runTaskArgument
      security:
        - session: []
          browserOrigin: []
      description: >-
        Starts one attempt of a task over one argument, such as a single target
        slot. Otherwise identical to running it with none. The `404` is about
        the task name; an unconfigured argument is the task's own to interpret
        and is accepted.
      parameters:
        - $ref: '#/components/parameters/TaskName'
        - $ref: '#/components/parameters/TaskArgument'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/TaskInProgress'
  /v1/tasks/runs:
    get:
      tags:
        - browser-api
      operationId: getTaskRuns
      description: >-
        What the background activities have been doing, newest first: one page
        of the recorded history, over every task or over one named task.
      parameters:
        - name: task
          in: query
          description: >-
            Narrows the page to one registered task. A name this build does not
            register is refused rather than answered with an empty page.
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A newest-first cursor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunPage'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/sync/runs:
    get:
      tags:
        - browser-api
      operationId: getSyncRuns
      parameters:
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A newest-first cursor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunPage'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/activities:
    get:
      tags:
        - browser-api
      operationId: getActivities
      description: >-
        The recorded activities of one target, newest first. A caller reads
        only the target they own; an admin may name any. The window is
        half-open on the start time with no maximum span, and no more than
        5000 activities are served in one response.
      parameters:
        - name: from
          in: query
          description: >-
            Inclusive start of the window. Left out, the window has no lower
            bound and reaches every stored activity.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive end of the window. Defaults to now.
          schema:
            type: string
            format: date-time
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own. A target the
            caller does not own is answered not found rather than forbidden,
            so the surface never confirms which targets exist.
          schema:
            type: string
      responses:
        "200":
          description: Recorded activities, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/activities/fitness:
    get:
      tags:
        - browser-api
      operationId: getFitness
      description: >-
        The rider's fitness, fatigue and form over time: one row per day, on
        both of the scales a ride's load is measured on. Scoped exactly as the
        activity list is.
      parameters:
        - name: target
          in: query
          required: false
          description: >-
            Whose timeline. Omitted is the caller's own; an administrator may
            name another target, and anyone else naming one is answered 404.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: The first day to return. Earlier days still shape the averages.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: The day after the last to return.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The rider's timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fitness'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/activities/{activityId}/track:
    get:
      tags:
        - browser-api
      operationId: getActivityTrack
      description: >-
        One activity's recorded track, as a GeoJSON Feature. A caller reads
        only an activity of the target they own; an admin may name any target.
        An activity with fewer than two positioned samples has a null geometry
        and no box, and `properties.state` says why: its samples are not stored
        yet, too few of them carried a position, or its file did not decode. An
        activity of another target, and one this service has no summary for, are
        both answered not found.
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActivityID'
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own.
          schema:
            type: string
      responses:
        "200":
          description: The activity's recorded track, or the state that explains its absence.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/ActivityTrack'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/activities/{activityId}/series/{series}:
    get:
      tags:
        - browser-api
      operationId: getActivitySeries
      description: >-
        One named series of an activity's recorded samples, indexed 1:1 with
        the coordinates that activity's track is served as. One request names
        one series and receives that series alone; nothing of this is bundled
        into the track response or into any listing. Scoped exactly as the
        track is: a caller reads only an activity of the target they own, and
        an admin may name any target. A series no sample of the ride recorded
        is answered not found, so a bicycle with no meter is told apart from a
        meter that dropped out; a `speed` no pair of samples could yield — a
        ride that recorded no distance — answers the same way rather than as a
        column of nulls.
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActivityID'
        - name: series
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActivitySeriesName'
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own.
          schema:
            type: string
      responses:
        "200":
          description: The named series, one value per coordinate of the activity's track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySeries'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'

  /v1/activities/{activityId}/splits:
    get:
      tags:
        - browser-api
      operationId: getActivitySplits
      description: >-
        One activity cut into kilometres, in the order they were ridden. Cut by
        the bicycle's own odometer rather than by the distance between recorded
        positions, so the table agrees with the distance the ride is listed at.
        The seconds are moving ones: a pair of samples the odometer did not
        advance over is a rider standing still, and is left out. Scoped exactly
        as the track is: a caller reads only an activity of the target they own,
        and an admin may name any target. A ride whose samples are not stored,
        or that recorded no distance to cut by, is served an empty list rather
        than an error.
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActivityID'
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own.
          schema:
            type: string
      responses:
        "200":
          description: The ride's kilometres, in the order they were ridden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitySplits'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'

  /v1/routes:
    get:
      tags:
        - browser-api
      operationId: getRoutes
      responses:
        "200":
          description: Stored route inventory without geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/sourceRoutes/{sourceRouteId}/routes/{stageOrder}:
    get:
      tags:
        - browser-api
      operationId: getRoute
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SourceRouteId'
        - $ref: '#/components/parameters/StageOrder'
      responses:
        "200":
          description: Stored route metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/sourceRoutes/{sourceRouteId}/routes/{stageOrder}/geometry:
    get:
      tags:
        - browser-api
      operationId: getRouteGeometry
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SourceRouteId'
        - $ref: '#/components/parameters/StageOrder'
      responses:
        "200":
          description: Stored route geometry.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeature'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/sourceRoutes/{sourceRouteId}/routes/{stageOrder}/climbs:
    get:
      tags:
        - browser-api
      operationId: getRouteClimbs
      description: >-
        The route's sustained climbs in the order they are ridden, each with the
        caller's own attempts at it, quickest first. Scoped exactly as the
        activity list is: a caller reads only the target they own, and so reads
        their own attempts and never another rider's. A route the library does
        not hold is not found; a route with no climbs, or one nobody has ridden,
        is an empty list rather than a missing page.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SourceRouteId'
        - $ref: '#/components/parameters/StageOrder'
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own. A target the
            caller does not own is answered not found rather than forbidden,
            so an address says nothing about whose it is.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The route's climbs and the caller's attempts at them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteClimbList'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/sourceRoutes/{sourceRouteId}/routes/{stageOrder}/activities:
    get:
      tags:
        - browser-api
      operationId: getRouteActivities
      description: >-
        The rides one target rode on this route, newest first. Scoped exactly
        as the activity list is: a caller reads only the target they own, and
        so reads their own history of a route and never another rider's. A
        route the library does not hold is not found, as it is on every other
        address under a route; a route nobody has ridden is an empty list.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SourceRouteId'
        - $ref: '#/components/parameters/StageOrder'
        - name: target
          in: query
          description: >-
            The target to read. Omitted means the caller's own. A target the
            caller does not own is answered not found rather than forbidden,
            so the surface never confirms which targets exist.
          schema:
            type: string
      responses:
        "200":
          description: The rides ridden on this route, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteActivityList'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/sourceRoutes/{sourceRouteId}/routes/{stageOrder}/reprocess:
    post:
      tags:
        - browser-api
      operationId: reprocessRoute
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/SourceRouteId'
        - $ref: '#/components/parameters/StageOrder'
      security:
        - session: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}:
    get:
      operationId: redirectStageRoute
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}/geometry:
    get:
      operationId: redirectStageGeometry
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}/reprocess:
    post:
      operationId: redirectStageReprocess
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      security:
        - session: []
          browserOrigin: []
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/routes/{routeId}/stages/{stage}:
    get:
      operationId: redirectLegacyRoute
      parameters:
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/routes/{routeId}/stages/{stage}/geometry:
    get:
      operationId: redirectLegacyGeometry
      parameters:
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/routes/{routeId}/stages/{stage}/reprocess:
    post:
      operationId: redirectLegacyReprocess
      parameters:
        - $ref: '#/components/parameters/LegacyRouteId'
        - $ref: '#/components/parameters/LegacyStage'
      security:
        - session: []
          browserOrigin: []
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/settings:
    get:
      tags:
        - browser-api
      operationId: getSettings
      responses:
        "200":
          description: The settings in force right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/wahoo:
    put:
      tags:
        - browser-api
      operationId: setWahooApplication
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces the registered Wahoo application. The target slots are written
        separately: they are the targets this application writes to, not part
        of the application itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahooApplicationUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/sources/{provider}:
    put:
      tags:
        - browser-api
      operationId: setSource
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces one library and the account it is read with, leaving the other
        libraries exactly as they are. Turning a library off removes it from the
        list a run reads; the account it was read with stays stored, so turning
        it back on does not ask for the credentials again.
      parameters:
        - name: provider
          in: path
          required: true
          description: The library this edit is about.
          schema:
            type: string
            enum:
              - veloplanner
              - komoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/notifications:
    put:
      tags:
        - browser-api
      operationId: setNotifications
      security:
        - session: []
          browserOrigin: []
      description: Replaces the notification settings and the Pushover credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/alerts:
    put:
      tags:
        - browser-api
      operationId: setAlerts
      security:
        - session: []
          browserOrigin: []
      description: >-
        Records which alerts are delivered. Deciding is what creates a record,
        so an alert left out keeps whatever it had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/basemaps:
    put:
      tags:
        - browser-api
      operationId: setBasemaps
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces the basemap list whole, in the order it is offered. The first
        is what a browser that has never chosen one loads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasemapsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/surface:
    put:
      tags:
        - browser-api
      operationId: setSurface
      security:
        - session: []
          browserOrigin: []
      description: Replaces the surface index's regions and rebuild cadence, and starts a rebuild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurfaceSettings'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/timezone:
    put:
      tags:
        - browser-api
      operationId: setTimezone
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces the zone this service reads local time in. A zone it cannot
        load is refused, because a schedule with no local time has no time to
        run at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimezoneUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/sync:
    put:
      tags:
        - browser-api
      operationId: setSync
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces the settings a run reads when it starts, including the gate
        that lets an empty library delete a target's routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSettings'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/rider:
    get:
      tags:
        - browser-api
      operationId: getRiderProfile
      description: >-
        The signed-in rider's own parameters, and what their recent rides
        suggest two of them could be. Answered for the caller's own subject
        only: no session reads another rider's profile here, an administrator's
        included.
      responses:
        "200":
          description: The rider's own profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
    put:
      tags:
        - browser-api
      operationId: setRiderProfile
      security:
        - session: []
          browserOrigin: []
      description: >-
        Replaces the caller's own parameters whole. A parameter left out is
        cleared rather than kept: this is the rider's whole profile, not a patch
        of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderParameters'
      responses:
        "200":
          description: The rider's own profile, as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/rider/credentials/zwift:
    put:
      tags:
        - browser-api
      operationId: setRiderZwiftCredentials
      security:
        - session: []
          browserOrigin: []
      description: >-
        Writes the caller's own Zwift email and password, over their own
        subject alone. A field left out of the body keeps whatever is stored;
        the value is never returned in any form, in this response or any
        other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiderZwiftCredentialsUpdate'
      responses:
        "204":
          $ref: '#/components/responses/NoContent'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
        - browser-api
      operationId: deleteRiderZwiftCredentials
      security:
        - session: []
          browserOrigin: []
      description: >-
        Removes both of the caller's own Zwift credentials, over their own
        subject alone.
      responses:
        "204":
          $ref: '#/components/responses/NoContent'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/webui/config:
    get:
      tags:
        - browser-api
      operationId: getWebUIConfig
      responses:
        "200":
          description: Browser-only runtime configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUIConfig'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/weather:
    get:
      tags:
        - browser-api
      operationId: getWeather
      parameters:
        - name: point
          in: query
          required: true
          style: form
          explode: true
          allowReserved: true
          schema:
            type: array
            minItems: 1
            maxItems: 48
            items:
              type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,.+$
      responses:
        "200":
          description: Forecast samples in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecast'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
  /v1/weather-grid/latest:
    get:
      tags:
        - browser-api
      operationId: getWeatherGridLatest
      description: >-
        Relays the model's own capture manifest — its reference time and the
        valid times it currently publishes — from Open-Meteo's spatial data
        files, so the browser's reader never reaches a third party directly.
      responses:
        "200":
          description: The manifest, exactly as the provider publishes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherGridManifest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
  /v1/weather-grid/object:
    get:
      tags:
        - browser-api
      operationId: getWeatherGridObject
      description: >-
        Relays one .om file's bytes for the run named by referenceTime and
        the hour named by validTime. The browser's own reader decides which
        byte ranges it needs and asks for them with its own Range header,
        which this operation forwards unchanged.
      parameters:
        - $ref: '#/components/parameters/WeatherGridReferenceTime'
        - $ref: '#/components/parameters/WeatherGridValidTime'
      responses:
        "200":
          description: The whole object.
          content:
            application/octet-stream: {}
        "206":
          description: The requested byte range.
          content:
            application/octet-stream: {}
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
    head:
      # No tag, so Orval never generates a client for it — the browser's own
      # reader (@openmeteo/file-reader) issues this directly, the same way it
      # issues its own Range reads, never through a generated binding.
      operationId: headWeatherGridObject
      description: >-
        The same relay as GET, without a body — the reader's own probe for
        Accept-Ranges and Content-Length before it starts asking for ranges.
      parameters:
        - $ref: '#/components/parameters/WeatherGridReferenceTime'
        - $ref: '#/components/parameters/WeatherGridValidTime'
      responses:
        "200":
          description: The object exists; headers only, no body.
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
  /v1/zwift/worlds/{worldId}/map:
    get:
      # No tag, so Orval never generates a client for it: the browser loads the
      # artwork with an <img>, never through a generated binding.
      operationId: getZwiftWorldMap
      description: >-
        One Zwift world's published map artwork, relayed from Zwift's CDN
        through this origin. The CDN answers no CORS header, so a browser
        cannot read it directly; relaying it also keeps which world a rider is
        looking at from reaching a third party. The image is fetched once and
        held in memory. A world this service's table does not name is answered
        not found.
      parameters:
        - name: worldId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The world's map image.
          content:
            image/png: {}
        "304":
          description: The caller's copy of the image is current.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
  /oauth/wahoo/start:
    get:
      tags:
        - oauth
      operationId: startOwnOAuth
      description: >-
        Starts the flow for the caller's own target, creating it on first use.
        The bare path exists because the browser is never told its own
        subject, so it cannot name a target the way an admin starting
        another's does.
      responses:
        "302":
          $ref: '#/components/responses/OAuthRedirect'
        "400":
          $ref: '#/components/responses/AuthorizationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /oauth/wahoo/start/{target}:
    get:
      tags:
        - oauth
      operationId: startOAuth
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        "302":
          $ref: '#/components/responses/OAuthRedirect'
        "400":
          $ref: '#/components/responses/AuthorizationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /oauth/wahoo/callback:
    get:
      tags:
        - oauth
      operationId: completeOAuth
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          $ref: '#/components/responses/BrowserRedirect'
        "400":
          $ref: '#/components/responses/AuthorizationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-domestique_session
      description: Browser session cookie issued by the sign-in flow.
    browserOrigin:
      type: apiKey
      in: header
      name: Origin
      description: Exact browser origin configured for this service. Required by every operation that starts a run or writes state, and modelled as a security scheme rather than a parameter because a request without it is refused rather than misread.
  parameters:
    WeatherGridReferenceTime:
      name: referenceTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
    WeatherGridValidTime:
      name: validTime
      in: query
      required: true
      schema:
        type: string
        format: date-time
    TaskName:
      name: name
      in: path
      required: true
      description: The task's registered name, such as sync or surface:index.
      schema:
        type: string
        minLength: 1
    TaskArgument:
      name: argument
      in: path
      required: true
      description: What the attempt is over, such as a target slot name.
      schema:
        type: string
        minLength: 1
    Target:
      name: target
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SourceRouteId:
      name: sourceRouteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    StageOrder:
      name: stageOrder
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LegacyRouteId:
      name: routeId
      in: path
      required: true
      description: The source route identifier, under the name a superseded address gave it.
      schema:
        type: integer
        format: int64
        minimum: 1
    LegacyStage:
      name: stage
      in: path
      required: true
      description: The stage order, under the name a superseded address gave it.
      schema:
        type: integer
        minimum: 1
  responses:
    SettingsStored:
      description: >-
        Every setting now in force, not only the section this request replaced,
        so one answer refills the whole page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Settings'
    Accepted:
      description: Work was accepted to run asynchronously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    InvalidRequest:
      description: Request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid browser session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Session identity or origin is not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Local state is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: The write took effect. There is nothing to answer with.
    ProviderUnavailable:
      description: Provider request failed without exposing provider detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TaskInProgress:
      description: >-
        The attempt was refused. This exact work is already happening, or
        something it needs is held by another run. Neither is a fault.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationFailed:
      description: OAuth request failed safely.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthRedirect:
      description: Redirect to Wahoo authorization.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    BrowserRedirect:
      description: Redirect back to browser UI.
      headers:
        Location:
          required: true
          schema:
            type: string
    LegacyRedirect:
      description: Permanent method-preserving redirect.
      headers:
        Location:
          required: true
          schema:
            type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ready
    Unready:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: unready
        reason:
          type: string
          enum:
            - state_unreadable
            - state_incomplete
    Accepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    TargetRoutes:
      type: object
      additionalProperties: false
      required:
        - current
        - pending
      properties:
        current:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    TargetRun:
      type: object
      additionalProperties: false
      required:
        - completedAt
        - result
      properties:
        completedAt:
          type: string
          format: date-time
        result:
          type: string
        failure:
          type: string
    TargetStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - authorisation
        - convergence
        - routes
      properties:
        id:
          type: string
        owner:
          type: string
          description: >-
            The subject that owns this target. Present only for an admin
            caller: a non-admin's own target is already known to be theirs,
            and never sees another's here at all.
        own:
          type: boolean
          description: >-
            True when this target belongs to the calling subject. Present
            only for an admin caller, whose list also carries other riders'
            targets; a non-admin's list holds only their own.
        ownerNickname:
          type: string
          description: >-
            The owning subject's display nickname, when its sign-in's ID
            token carried one. Present only alongside owner, and only as a
            label: never a key, and never present without owner too.
        authorisation:
          type: string
        convergence:
          type: string
          enum:
            - current
            - lagging
            - failed
            - unauthorized
        routes:
          $ref: '#/components/schemas/TargetRoutes'
        lastRun:
          $ref: '#/components/schemas/TargetRun'
    RouteValidation:
      type: object
      additionalProperties: false
      required:
        - biasPercent
        - maePercent
        - p90Percent
        - evaluatedRides
      properties:
        biasPercent:
          type: number
          format: double
        maePercent:
          type: number
          format: double
        p90Percent:
          type: number
          format: double
        evaluatedRides:
          type: integer
          minimum: 0
    Route:
      type: object
      additionalProperties: false
      required:
        - provider
        - sourceRouteId
        - stageOrder
        - title
        - sourceRouteName
        - routeName
        - sourceRevision
        - contentHash
        - distanceMetres
        - ascentMetres
        - descentMetres
        - maxGradientPercent
        - pointCount
      properties:
        provider:
          type: string
        sourceRouteId:
          type: integer
          format: int64
        stageOrder:
          type: integer
        title:
          type: string
        sourceRouteName:
          type: string
        routeName:
          type: string
        sourceRevision:
          type: string
        contentHash:
          type: string
        distanceMetres:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        descentMetres:
          type: number
          format: double
        maxGradientPercent:
          type: number
          format: double
        pointCount:
          type: integer
        movingSeconds:
          type: number
          format: double
        validation:
          $ref: '#/components/schemas/RouteValidation'
    ActivityID:
      type: string
      pattern: '^[0-9]+$'
      description: >-
        An activity id exceeds the 2^53 range a JSON number survives exactly
        in a browser, so it is carried as a string everywhere it appears on
        the wire, request paths included.
    Activity:
      type: object
      additionalProperties: false
      required:
        - id
        - startedAt
        - distanceMetres
        - movingSeconds
        - elapsedSeconds
        - ascentMetres
        - typeId
        - locationId
        - provider
      properties:
        id:
          $ref: '#/components/schemas/ActivityID'
        startedAt:
          type: string
          format: date-time
        distanceMetres:
          type: number
          format: double
        movingSeconds:
          type: number
          format: double
        elapsedSeconds:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        descentMetres:
          type: number
          format: double
          description: >-
            The ride's total descent, from the file's session message. Absent
            for a ride whose file declared none.
        caloriesKcal:
          type: number
          format: double
          description: >-
            The device's own calorie estimate for the ride. Absent for a ride
            whose file declared none.
        typeId:
          type: integer
        locationId:
          type: integer
        provider:
          type: string
          enum:
            - wahoo
            - zwift
          description: >-
            Which upstream this service read the ride from, not where it was
            ridden: an indoor ride recorded by a Wahoo head unit still answers
            wahoo, not zwift.
        workoutName:
          type: string
          description: >-
            The ride's name as Zwift lists it, from its own single-activity
            response: a structured workout's name, or a free ride's route.
            Absent for every other provider.
        workoutHash:
          type: integer
          format: int64
          description: >-
            Zwift's stable hash of what the ride was, alongside workoutName.
        workoutCompletion:
          type: number
          format: double
          description: >-
            How much of the ride's workout was completed, 0 to 1, alongside
            workoutName; 1 for a free ride, which has nothing to fall short of.
        metrics:
          $ref: '#/components/schemas/ActivityMetrics'
        weather:
          $ref: '#/components/schemas/ActivityWeatherSummary'
        routeMatch:
          $ref: '#/components/schemas/ActivityRouteMatch'
        analysis:
          $ref: '#/components/schemas/ActivityAnalysis'
    ActivityAnalysis:
      type: object
      additionalProperties: false
      description: >-
        What a language model made of this ride. Absent for a ride not yet
        analysed, for one whose derivation yielded nothing, and everywhere on a
        deployment that configured no token. Text for the rider to read; never
        an input to any figure served here.
      required:
        - text
        - model
        - promptRevision
        - analysedAt
      properties:
        text:
          type: string
          maxLength: 2000
          description: Plain text, at most 2000 characters.
        model:
          type: string
          description: The model id that answered.
        promptRevision:
          type: integer
          description: The revision of the prompt it was asked with.
        analysedAt:
          type: string
          format: date-time
    ActivityRouteMatch:
      type: object
      additionalProperties: false
      description: >-
        The library route this ride was ridden on. Absent where the ride was
        ridden on none of them, or has not been matched yet; the two are not
        distinguished, because neither gives a route to show.
      required:
        - provider
        - sourceRouteId
        - stageOrder
        - routeCoverage
        - rideCoverage
        - direction
      properties:
        provider:
          type: string
        sourceRouteId:
          type: integer
          format: int64
        stageOrder:
          type: integer
        routeCoverage:
          type: number
          format: double
          description: Share of the route's length this ride covered, 0 to 1.
        rideCoverage:
          type: number
          format: double
          description: Share of this ride's length that lay on the route, 0 to 1.
        direction:
          $ref: '#/components/schemas/RouteRideDirection'
    RouteRideDirection:
      type: string
      description: >-
        Which way round the route the ride went. Unknown where it could not be
        told, which a route ridden out and back never can: it advances as far
        one way as the other.
      enum:
        - forward
        - reverse
        - unknown
    RouteActivity:
      type: object
      additionalProperties: false
      required:
        - id
        - routeCoverage
        - rideCoverage
        - direction
      properties:
        id:
          $ref: '#/components/schemas/ActivityID'
        routeCoverage:
          type: number
          format: double
        rideCoverage:
          type: number
          format: double
        direction:
          $ref: '#/components/schemas/RouteRideDirection'
    RouteClimbList:
      type: object
      additionalProperties: false
      required:
        - climbs
      properties:
        climbs:
          type: array
          items:
            $ref: '#/components/schemas/RouteClimb'
    RouteClimb:
      type: object
      additionalProperties: false
      description: >-
        One sustained climb of the route, found again from the route's stored
        geometry rather than kept beside the attempts at it. See
        docs/specs/measurement.md §Sustained climbs.
      required:
        - startMetres
        - endMetres
        - distanceMetres
        - ascentMetres
        - averageGradePercent
        - maxGradePercent
        - attempts
      properties:
        startMetres:
          type: number
          format: double
        endMetres:
          type: number
          format: double
        distanceMetres:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        averageGradePercent:
          type: number
          format: double
        maxGradePercent:
          type: number
          format: double
        attempts:
          type: array
          description: The caller's own attempts at this climb, quickest first.
          items:
            $ref: '#/components/schemas/RouteClimbAttempt'
    RouteClimbAttempt:
      type: object
      additionalProperties: false
      description: >-
        One ride over one climb. Only a ride that reached both ends of it the
        way the route stores it is here: a ride that turned back, or ran the
        route the other way round, made no attempt at it.
      required:
        - activityId
        - riddenAt
        - seconds
        - vamMetresPerHour
      properties:
        activityId:
          $ref: '#/components/schemas/ActivityID'
        riddenAt:
          type: string
          format: date-time
        seconds:
          type: number
          format: double
        vamMetresPerHour:
          type: number
          format: double
          description: >-
            The climb's own ascent over the time this attempt took, which is
            what makes two attempts at one climb comparable.
        heartRateBpm:
          type: number
          format: double
          description: The mean over the samples inside the climb.
        powerWatts:
          type: number
          format: double
          description: >-
            The mean measured power inside the climb. Never fed by an estimate.
        estimatedPowerWatts:
          type: number
          format: double
          description: >-
            The mean estimated power inside the climb, for a bicycle carrying no
            meter. Never ranked or summed with the measured figure above.
    RouteActivityList:
      type: object
      additionalProperties: false
      required:
        - activities
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/RouteActivity'
    Fitness:
      type: object
      additionalProperties: false
      required:
        - days
        - weeks
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/FitnessDay'
        weeks:
          type: array
          items:
            $ref: '#/components/schemas/FitnessWeek'
        powerCurve:
          type: array
          description: >-
            The power-duration curve over the window: the best mean power the
            rider held at each of a fixed set of durations, shortest first.
            Folded from what each ride was derived to hold, so a ride awaiting
            derivation is not in it yet. Measured power only -- an estimate from
            the track never enters the curve. Absent where no ride in the window
            carried a meter; a duration no ride was long enough for carries no
            point rather than a nought.
          items:
            $ref: '#/components/schemas/PowerCurvePoint'
    PowerCurvePoint:
      type: object
      additionalProperties: false
      required:
        - seconds
        - watts
      properties:
        seconds:
          type: integer
          minimum: 1
          description: The duration this point is the best mean power over.
        watts:
          type: number
          format: double
    FitnessDay:
      type: object
      additionalProperties: false
      description: >-
        One day of the timeline. Fitness is the long average of daily load,
        fatigue the short one, and form their difference: fresh above zero,
        buried below it. A day nobody rode carries no load and still decays both
        averages, which is what makes rest visible.
      required:
        - date
        - trimpLoad
        - trimpFitness
        - trimpFatigue
        - trimpForm
        - tssLoad
        - tssFitness
        - tssFatigue
        - tssForm
      properties:
        date:
          type: string
          format: date
        trimpLoad:
          type: number
          format: double
        trimpFitness:
          type: number
          format: double
        trimpFatigue:
          type: number
          format: double
        trimpForm:
          type: number
          format: double
        tssLoad:
          type: number
          format: double
          description: >-
            Power TSS where the ride carried a meter and hrTSS otherwise, so the
            series stays continuous across the day a power meter arrives.
        tssFitness:
          type: number
          format: double
        tssFatigue:
          type: number
          format: double
        tssForm:
          type: number
          format: double
    FitnessWeek:
      type: object
      additionalProperties: false
      description: How long one week held each of the five heart-rate zones.
      required:
        - weekStart
        - zoneSeconds
      properties:
        weekStart:
          type: string
          format: date
          description: The Monday the week began on, in the service's own zone.
        zoneSeconds:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: number
            format: double
    ActivityWeatherSummary:
      type: object
      additionalProperties: false
      description: >-
        What the ride was ridden through, in one line: the range the temperature
        moved over, the wind it was ridden in, and what fell. Absent for a ride
        nobody has asked the weather about, and for one the provider had nothing
        to say about.
      required:
        - temperatureMinCelsius
        - temperatureMaxCelsius
        - windSpeedKmh
        - precipitationMillimetres
        - weatherCode
      properties:
        temperatureMinCelsius:
          type: number
          format: double
        temperatureMaxCelsius:
          type: number
          format: double
        windSpeedKmh:
          type: number
          format: double
          description: The mean over the ride's steps.
        precipitationMillimetres:
          type: number
          format: double
          description: The whole of what fell over the ride, not an hourly rate.
        weatherCode:
          type: integer
          description: >-
            The worst of the ride's steps rather than a mean: half a ride in
            rain was ridden in rain, and a mean of two codes names no weather.
    RideWeatherStep:
      type: object
      additionalProperties: false
      description: One step of what a ride was actually ridden through.
      required:
        - time
        - stepSeconds
        - temperatureCelsius
        - apparentTemperatureCelsius
        - precipitationMillimetres
        - windSpeedKmh
        - windDirectionDegrees
        - weatherCode
        - cloudCoverPercent
      properties:
        time:
          type: string
          format: date-time
        stepSeconds:
          type: integer
          description: >-
            How long this step covers: 3600 for a ride answered by the
            reanalysis, 900 for a recent one answered by the forecast
            endpoint.
        temperatureCelsius:
          type: number
          format: double
        apparentTemperatureCelsius:
          type: number
          format: double
        precipitationMillimetres:
          type: number
          format: double
        precipitationProbabilityPercent:
          type: number
          format: double
          description: >-
            Absent for a ride old enough to be answered by reanalysis, which
            records what fell rather than what might have.
        windSpeedKmh:
          type: number
          format: double
        windDirectionDegrees:
          type: number
          format: double
        weatherCode:
          type: integer
        cloudCoverPercent:
          type: number
          format: double
    ActivityMetrics:
      type: object
      additionalProperties: false
      description: >-
        What this ride's recorded samples say about how hard it was: the load
        figures the rider's profile shapes, and the plain averages the device
        declared or, failing that, its sensors came to on their own. Absent
        from a ride that has none, and each part is absent on its own: a ride
        carries the sensors it carries, a file declares what its head unit
        chose to, and a profile holds what the rider entered.
      properties:
        zoneSeconds:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: number
            format: double
          description: >-
            How long the ride held each of five heart-rate zones, easiest
            first. Cut from the lactate threshold where the profile has one and
            from the maximum otherwise.
        zoneBoundsBpm:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
          description: >-
            The four heart rates the five zones were cut at, ascending, in beats
            per minute. Worked out from the profile values this ride was derived
            against, not the rider's current ones. Present whenever zoneSeconds
            is.
        trimp:
          type: number
          format: double
          description: >-
            Banister's training impulse: how long the ride lasted, weighted by
            how much of the rider's heart-rate reserve it held.
        heartRateTss:
          type: number
          format: double
          description: An hour held at the lactate threshold is a hundred.
        normalizedPowerWatts:
          type: number
          format: double
          description: >-
            From measured power only. An estimate worked out from the track
            never feeds this.
        intensityFactor:
          type: number
          format: double
        powerTss:
          type: number
          format: double
        estimatedPowerWatts:
          type: number
          format: double
          description: >-
            The ride's average estimated power, for a bicycle carrying no meter.
            An estimate from a physics model over the recorded track, never a
            measurement: it feeds none of the figures above and must not be
            presented as though it were one of them. Absent for a ride that
            measured its own power, one with no usable track, and one whose
            rider has entered no mass.
        estimateQuality:
          $ref: '#/components/schemas/EstimateQuality'
        averageSpeedKmh:
          type: number
          format: double
          description: >-
            The device's own average speed in km/h, from the file's session
            message. Absent where the file declared none, in which case a
            client falls back to distance over moving time — both of which
            the activity already carries.
        averageHeartRateBpm:
          type: number
          format: double
          description: >-
            The device's own session average where the file declared one,
            otherwise the mean of the ride's recorded heart-rate samples.
            Absent for a ride that carried no strap.
        minHeartRateBpm:
          type: number
          format: double
          description: >-
            The lowest heart rate the device's session declared. Absent for a
            file that declared none.
        maxHeartRateBpm:
          type: number
          format: double
          description: >-
            The device's own session maximum where the file declared one,
            otherwise the highest heart rate the ride recorded.
        averageCadenceRpm:
          type: number
          format: double
          description: >-
            The device's own session average where the file declared one,
            otherwise the mean of the ride's recorded cadence samples. A
            reading of zero is a reading — a stopped rider's cadence — and
            counts towards it.
        maxCadenceRpm:
          type: number
          format: double
          description: >-
            The highest cadence the device's session declared. Absent for a
            file that declared none.
        averagePowerWatts:
          type: number
          format: double
          description: >-
            The device's own session average where the file declared one,
            otherwise the mean of the ride's measured power samples. Never
            fed by an estimate: a bicycle with no meter has no average power.
        maxPowerWatts:
          type: number
          format: double
          description: >-
            The highest power the device's session declared. Absent for a
            file that declared none.
        thresholdPowerWatts:
          type: number
          format: double
          description: >-
            The functional threshold power set on the head unit at the time
            of the ride, from the file's session message. Absent where the
            file declared none.
        maxSpeedKmh:
          type: number
          format: double
          description: >-
            The device's own session maximum where the file declared one,
            otherwise the ride's highest recorded speed in km/h, from the
            device's own speed reading where recorded and otherwise from
            distance over time. Readings above a plausible ceiling are
            dropped in the fallback. Absent for a ride with no speed series
            at all.
        sport:
          type: string
          description: >-
            The FIT profile's sport name for the ride, e.g. "cycling". Absent
            where the file declared none.
        deviceZoneSeconds:
          type: array
          items:
            type: number
            format: double
          description: >-
            How long the ride held each of the head unit's own heart-rate
            zones, easiest first, from the file's session message. Served
            beside zoneSeconds rather than instead of it: the load figures
            above and the page's default view are worked out from the
            profile's zones, not the device's own.
        deviceZoneBoundsBpm:
          type: array
          items:
            type: number
            format: double
          description: >-
            The heart rates the head unit cut its own zones at, ascending, one
            fewer than deviceZoneSeconds has entries. Served only beside
            deviceZoneSeconds, and absent for a file that declared the times
            but not the table they were cut by.
        decouplingPercent:
          type: number
          format: double
          description: >-
            How much of the ride's power-to-heart-rate ratio was lost over its
            second half, as a percentage of its first. Positive is the usual
            direction: the same watts cost more beats later on. From measured
            power only, over a ride of at least an hour, and absent otherwise.
            It describes a steady aerobic ride; over intervals the two halves
            are different efforts and the figure says nothing about drift. See
            docs/specs/measurement.md §Decoupling and heat drift.
        heatDrift:
          $ref: '#/components/schemas/HeatDrift'
    HeatDrift:
      type: object
      additionalProperties: false
      description: >-
        What one ride says about riding warm: the heart rate it held in the
        rider's endurance band and the temperature it was recorded at. One ride
        is a point rather than a trend, and the drift is these points over a
        season. Absent for a ride with no measured power, no thermometer, too
        few samples in the band, or a rider who has entered no threshold power
        to place the band with.
      required:
        - heartRateBpm
        - temperatureCelsius
        - samples
      properties:
        heartRateBpm:
          type: number
          format: double
          description: The mean heart rate over the ride's samples inside the band.
        temperatureCelsius:
          type: number
          format: double
          description: The mean temperature over those same samples.
        samples:
          type: integer
          minimum: 1
          description: How many samples the pair was read from.
    EstimateQuality:
      type: object
      additionalProperties: false
      description: >-
        What the estimate's own shape says about whether to trust it: a real
        ride's power is strongly autocorrelated sample to sample and moves by
        a few watts a second, and a series driven by recorder noise is
        neither. Present beside estimatedPowerWatts once the ride has been
        derived since these existed; a ride derived before then omits it
        until it is derived again. See
        docs/specs/measurement.md §Estimated power.
      required:
        - autocorrelation
        - meanAbsDeltaWattsPerSecond
        - clipBiasWatts
      properties:
        autocorrelation:
          type: number
          format: double
          description: >-
            The lag-1 Pearson correlation of the estimated watts with
            themselves shifted by one sample.
        meanAbsDeltaWattsPerSecond:
          type: number
          format: double
          description: >-
            The mean absolute change in watts per second of elapsed time
            between consecutive samples.
        clipBiasWatts:
          type: number
          format: double
          description: >-
            The mean amount the zero clamp added: clamped watts minus the
            unclamped force times speed it would otherwise have reported.
    ActivityList:
      type: object
      additionalProperties: false
      required:
        - activities
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    RouteList:
      type: object
      additionalProperties: false
      required:
        - routes
      properties:
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    SyncPhaseRun:
      type: object
      additionalProperties: false
      required:
        - lastCompletedAt
        - lastResult
        - sourceRoutes
        - created
        - updated
        - deleted
      properties:
        lastCompletedAt:
          type: string
          format: date-time
        lastResult:
          type: string
        lastFailure:
          type: string
        sourceRoutes:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    SyncPhases:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/SyncPhaseRun'
        targets:
          $ref: '#/components/schemas/SyncPhaseRun'
    SyncActive:
      type: object
      additionalProperties: false
      required:
        - targets
        - routes
      properties:
        phase:
          type: string
          enum:
            - source
            - targets
        startsAt:
          type: string
          format: date-time
        targets:
          type: integer
          minimum: 0
        routes:
          $ref: '#/components/schemas/TargetRoutes'
    SurfaceCoverage:
      type: object
      additionalProperties: false
      required:
        - classified
        - total
        - incomplete
        - enrichmentFailures
      properties:
        generation:
          type: string
        builtAt:
          type: string
          format: date-time
        classified:
          type: integer
        total:
          type: integer
        incomplete:
          type: integer
        enrichmentFailures:
          description: >-
            How many stages currently have a surface or duration enrichment
            pass recorded against them as unable to finish.
          type: integer
    WahooRateLimit:
      type: object
      additionalProperties: false
      required:
        - remaining
        - observedAt
      properties:
        remaining:
          type: integer
        resetsAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
    TrustedInventory:
      type: object
      additionalProperties: false
      required:
        - ageSeconds
        - maxAgeSeconds
        - fresh
      properties:
        lastSuccessAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
        maxAgeSeconds:
          type: integer
        fresh:
          type: boolean
    SyncStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - phases
        - surface
        - sourceRoutes
        - created
        - updated
        - deleted
      properties:
        state:
          type: string
        active:
          $ref: '#/components/schemas/SyncActive'
        lastResult:
          type: string
        lastCompletedAt:
          type: string
          format: date-time
        sourceRoutes:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        phases:
          $ref: '#/components/schemas/SyncPhases'
        surface:
          $ref: '#/components/schemas/SurfaceCoverage'
        wahooRateLimit:
          $ref: '#/components/schemas/WahooRateLimit'
        trustedInventory:
          $ref: '#/components/schemas/TrustedInventory'
    Build:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          type: string
        imageDigest:
          type: string
    Status:
      type: object
      additionalProperties: false
      required:
        - ready
        - converged
        - targets
        - sync
      properties:
        ready:
          type: boolean
        converged:
          type: boolean
        build:
          $ref: '#/components/schemas/Build'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetStatus'
        sync:
          $ref: '#/components/schemas/SyncStatus'
    SyncRun:
      type: object
      additionalProperties: false
      required:
        - reference
        - phase
        - completedAt
        - result
        - sourceRoutes
        - created
        - updated
        - deleted
      properties:
        reference:
          type: string
        phase:
          type: string
          enum:
            - source
            - targets
        completedAt:
          type: string
          format: date-time
        result:
          type: string
        failure:
          type: string
        sourceRoutes:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    SyncRunPage:
      type: object
      additionalProperties: false
      required:
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        next:
          type: string
    Settings:
      type: object
      additionalProperties: false
      description: >-
        The settings held in the state database rather than in the
        configuration file, which take effect on the next run or the next
        request rather than on the next restart.
      required:
        - timezone
        - sync
        - notifications
        - basemaps
        - surface
        - wahoo
        - sources
        - rideModel
        - alerts
        - secretsSet
        - missing
      properties:
        timezone:
          type: string
          description: >-
            The IANA zone this service reads local time in: what a scheduled
            time of day means, and what hour a forecast describes.
        sync:
          $ref: '#/components/schemas/SyncSettings'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
        surface:
          $ref: '#/components/schemas/SurfaceSettings'
        wahoo:
          $ref: '#/components/schemas/WahooSettings'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSettings'
          description: >-
            The libraries a run reads, in the order it reads them. An empty list
            is a service nobody has configured yet, not an error.
        rideModel:
          $ref: '#/components/schemas/RideModelStatus'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertSetting'
          description: >-
            Every alert this service can raise, and whether it is delivered. An
            alert nobody has ruled on is delivered: a fault nobody has heard of
            is the one worth hearing about.
        secretsSet:
          type: object
          additionalProperties:
            type: boolean
          description: >-
            Whether each credential is stored. This is the whole of what any
            observable surface is told about one: never the value, only that
            there is one to replace.
        missing:
          type: array
          items:
            type: string
          description: >-
            The settings still to be entered, in the order the page offers
            them. Everything a run needs is here, and so are the Pushover
            credentials while notifications are on, which no run needs but every
            notification does. Empty is a configured service.
    WahooApplicationUpdate:
      type: object
      additionalProperties: false
      description: >-
        The registered application, without the slots it writes to. Those are
        replaced on their own.
      required:
        - apiBaseUrl
        - oauthBaseUrl
        - clientId
      properties:
        apiBaseUrl:
          type: string
          description: The origin route reads and writes are sent to.
        oauthBaseUrl:
          type: string
          description: The origin an authorization and a token refresh are sent to.
        clientId:
          type: string
          description: The registered application's public identifier.
        clientSecret:
          type: string
          description: >-
            The application's secret, sent only when it was typed into the form.
            Left out it keeps the stored value, which is how a page that was
            never told the secret can save the rest of the application; sent
            empty it removes the credential.
        webhookToken:
          type: string
          description: >-
            The token Wahoo carries in every webhook body, sent only when it was
            typed into the form. It follows the same rule as the client secret:
            left out it keeps the stored value, sent empty it removes the
            credential, and it is never read back.
    SourceUpdate:
      type: object
      additionalProperties: false
      description: One library, and the account it is read with.
      required:
        - read
        - baseUrl
      properties:
        read:
          type: boolean
          description: >-
            Whether a run reads this library at all. Off takes it out of the
            list without forgetting the account it was read with.
        baseUrl:
          type: string
          description: >-
            The source's own web application, which is both the origin the
            service reads and the one a route is linked back to.
        email:
          type: string
          description: >-
            The account's email address, sent only when it was typed. The rules
            the application secret follows apply here too.
        password:
          type: string
          description: The account's password, on the same terms as the email address.
    AlertSetting:
      type: object
      additionalProperties: false
      required:
        - task
        - alert
        - enabled
        - decided
      properties:
        task:
          type: string
          description: The background activity the alert is about.
        alert:
          type: string
          description: >-
            The stable reason the alert names. It never carries provider text, a
            route name, or an upstream identifier.
        enabled:
          type: boolean
          description: Whether this alert is delivered.
        decided:
          type: boolean
          description: >-
            Whether anybody has ruled on it. An alert nobody has ruled on is
            delivered, which is not the same as one somebody switched on.
    AlertsUpdate:
      type: object
      additionalProperties: false
      required:
        - alerts
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertDecision'
          description: >-
            What the operator has decided. Deciding is what creates a record, so
            an alert left out of this list keeps whatever it had.
    AlertDecision:
      type: object
      additionalProperties: false
      required:
        - task
        - alert
        - enabled
      properties:
        task:
          type: string
        alert:
          type: string
        enabled:
          type: boolean
    NotificationsUpdate:
      type: object
      additionalProperties: false
      required:
        - enabled
        - pushoverBaseUrl
      properties:
        enabled:
          type: boolean
          description: >-
            The switch for the whole channel. Off, nothing is sent at all: a
            failure, a blocked run, a recovery and a task that has stopped
            succeeding are held back as surely as a routine success is. Which
            alerts are sent while it is on is a decision per task and per
            reason, held in the alert matrix.
        pushoverBaseUrl:
          type: string
          format: uri
          description: >-
            The origin the application token and user key are sent to.
        applicationToken:
          type: string
          description: >-
            The Pushover application's token, sent only when it was typed. The
            rules the application secret follows apply here too.
        userKey:
          type: string
          description: The recipient key, on the same terms as the application token.
    BasemapsUpdate:
      type: object
      additionalProperties: false
      required:
        - basemaps
      properties:
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
    TaskScheduleUpdate:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: >-
            Whether the schedule may start this task. It governs unattended runs
            only.
    TaskList:
      type: object
      additionalProperties: false
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    Task:
      type: object
      additionalProperties: false
      required:
        - name
        - scheduled
        - enabled
        - running
      properties:
        name:
          type: string
          description: What a trigger asks for.
        scheduled:
          type: boolean
          description: Whether the task has a schedule at all.
        enabled:
          type: boolean
          description: >-
            Whether the schedule may start it. A task nobody has ruled on runs.
            It governs unattended runs only.
        running:
          type: integer
          description: How many attempts of this task are in flight.
        intervalSeconds:
          type: integer
          description: >-
            The gap between runs for a task on a fixed schedule. Absent for a
            task with no schedule, or a calendar one, whose gap changes with
            the wall clock.
        nextRunAt:
          type: string
          format: date-time
          description: >-
            When the next scheduled run is due. Absent for a task nothing
            schedules, and while the task's own scheduled run is under way. A
            run somebody asked for does not disturb the schedule, so this stays
            put during one.
    TaskRun:
      type: object
      additionalProperties: false
      description: >-
        One recorded attempt. It carries the aggregate record and nothing about
        what the attempt touched.
      required:
        - task
        - startedAt
        - finishedAt
        - outcome
        - reference
      properties:
        task:
          type: string
        argument:
          type: string
          description: >-
            What the attempt was over, such as a target slot. Absent for a task
            that covers only one thing.
        trigger:
          type: string
          description: >-
            What started the attempt: `schedule`, `manual`, or `chain`. Absent
            for an attempt recorded before this was written down.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
        detail:
          type: string
          description: >-
            A stable, safe-to-display reason for the outcome. Never provider
            text, a route name, or an upstream identifier.
        reference:
          type: string
          description: The name an alert about this attempt carries.
    TaskRunPage:
      type: object
      additionalProperties: false
      required:
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/TaskRun'
        next:
          type: string
    RiderProfile:
      type: object
      additionalProperties: false
      required:
        - profile
        - suggestions
        - zwift
      properties:
        profile:
          $ref: '#/components/schemas/RiderParameters'
        suggestions:
          $ref: '#/components/schemas/RiderSuggestions'
        zwift:
          $ref: '#/components/schemas/RiderCredentialState'
    RiderCredentialState:
      type: object
      additionalProperties: false
      required:
        - emailSet
        - passwordSet
      description: >-
        Whether the rider's own Zwift email and password are stored. Never the
        values themselves: a credential entered on this page is written and
        never read back, over the rider's own subject alone.
      properties:
        emailSet:
          type: boolean
        passwordSet:
          type: boolean
    RiderZwiftCredentialsUpdate:
      type: object
      additionalProperties: false
      description: >-
        A save carries only what was typed: a field left out keeps whatever is
        stored, unlike the rider's parameters below, which a save replaces
        whole.
      properties:
        email:
          type: string
        password:
          type: string
    RiderParameters:
      type: object
      additionalProperties: false
      description: >-
        One rider's own body and equipment. Every parameter is optional: one the
        rider has not entered is absent rather than zero, because nothing
        downstream can use a zero heart rate or a massless bicycle.
      properties:
        maxHeartRateBpm:
          type: number
          minimum: 1
          maximum: 250
        restingHeartRateBpm:
          type: number
          minimum: 1
          maximum: 250
        thresholdHeartRateBpm:
          type: number
          minimum: 1
          maximum: 250
          description: The lactate threshold rate heart-rate zones are cut at.
        functionalThresholdPowerWatts:
          type: number
          minimum: 1
          maximum: 2000
        riderMassKg:
          type: number
          minimum: 1
          maximum: 500
        bikeMassKg:
          type: number
          minimum: 1
          maximum: 500
          description: The bicycle and everything carried on it.
    RiderSuggestions:
      type: object
      additionalProperties: false
      description: >-
        What the rider's rides of the last ninety days say some of these numbers
        could be, offered beside the controls and stored nowhere. A parameter no
        ride carried a sensor for is absent rather than zero.
      properties:
        maxHeartRateBpm:
          type: number
          description: The highest heart rate held over a rolling minute.
        functionalThresholdPowerWatts:
          type: number
          description: The best twenty-minute average power, taken at 95%.
        stopping:
          $ref: '#/components/schemas/StoppingSuggestion'
    StoppingSuggestion:
      type: object
      additionalProperties: false
      required:
        - medianSecondsPerHour
        - lowerQuartileSecondsPerHour
        - upperQuartileSecondsPerHour
        - rides
      description: >-
        How long the rider stood still per hour of moving over their own outdoor
        rides under their own power in the last ninety days, as a median and the
        quartiles either side of it. An indoor ride stands still without
        stopping and a motor does not stop for a cafe, so neither is counted. Measured over the caller's own targets alone and
        never pooled across riders, and absent until enough rides carry it.
      properties:
        medianSecondsPerHour:
          type: number
          minimum: 0
        lowerQuartileSecondsPerHour:
          type: number
          minimum: 0
        upperQuartileSecondsPerHour:
          type: number
          minimum: 0
        rides:
          type: integer
          minimum: 1
          description: How many of the rider's rides the figures were read from.
    TimezoneUpdate:
      type: object
      additionalProperties: false
      required:
        - timezone
      properties:
        timezone:
          type: string
          description: >-
            An IANA zone name this service can load, such as Europe/Berlin.
    SyncSettings:
      type: object
      additionalProperties: false
      required:
        - allowEmptySourceDeletion
        - staleAfterSeconds
        - initialDelaySeconds
      properties:
        allowEmptySourceDeletion:
          type: boolean
          description: >-
            Whether a source that reports an empty library may delete the last
            routes a target holds. It stays on until it is turned off again.
        staleAfterSeconds:
          type: integer
          minimum: 1
          description: >-
            How long the trusted source inventory may go without a successful
            refresh before it is reported and notified as stale.
        initialDelaySeconds:
          type: integer
          minimum: 1
          description: >-
            How long after start the first run is attempted. It is read by the
            start it delays, so an edit reaches the next restart rather than the
            next run.
    NotificationSettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - pushoverBaseUrl
      properties:
        enabled:
          type: boolean
          description: >-
            The switch for the whole channel. Off, nothing is sent at all: a
            failure, a blocked run, a recovery and a task that has stopped
            succeeding are held back as surely as a routine success is. Which
            alerts are sent while it is on is a decision per task and per
            reason, held in the alert matrix.
        pushoverBaseUrl:
          type: string
          format: uri
          description: >-
            The origin the application token and user key are sent to.
    WahooSettings:
      type: object
      additionalProperties: false
      required:
        - apiBaseUrl
        - oauthBaseUrl
        - clientId
      properties:
        apiBaseUrl:
          type: string
          description: >-
            The origin route reads and writes are sent to. Empty until the
            application is registered, which is a service that runs nothing
            rather than one that is broken.
        oauthBaseUrl:
          type: string
          description: The origin an authorization and a token refresh are sent to.
        clientId:
          type: string
          description: >-
            The registered application's public identifier. Its secret is not
            here: it is written through secrets and read back only as set.
    SourceSettings:
      type: object
      additionalProperties: false
      required:
        - provider
        - baseUrl
      properties:
        provider:
          type: string
          enum:
            - veloplanner
            - komoot
        baseUrl:
          type: string
          description: >-
            The source's own web application, which is both the origin the
            service reads and the one a route is linked back to.
    RideModelStatus:
      type: object
      additionalProperties: false
      description: >-
        The coefficient pair predicted moving time is priced with. Read-only:
        it is replaced by a calibration, not by an operator.
      required:
        - secondsPerKm
        - secondsPerAscentM
        - source
        - evaluatedRides
      properties:
        secondsPerKm:
          type: number
          description: Seconds added per kilometre ridden.
        secondsPerAscentM:
          type: number
          description: Seconds added per metre climbed.
        source:
          type: string
          enum:
            - default
            - calibrated
          description: >-
            Whether these are the built-in values every deployment starts with
            or the ones a calibration fitted.
        calibrationCutoff:
          type: string
          format: date
          description: The last day of riding the fit that produced them read.
        evaluatedRides:
          type: integer
          description: >-
            How many unseen rides the fit's error was measured over. Zero is
            not measured, which is what the built-in pair always reports.
    SurfaceSettings:
      type: object
      additionalProperties: false
      required:
        - regions
        - rebuildIntervalSeconds
      properties:
        regions:
          type: array
          items:
            type: string
          description: >-
            The Geofabrik region paths the surface index is built from. An empty
            list switches classification off.
        rebuildIntervalSeconds:
          type: integer
          minimum: 1
          description: >-
            How often the index is rebuilt. Required whether or not a region is
            named: the rebuild schedule runs either way, and with no region it
            simply builds nothing.
    BrowserBasemap:
      type: object
      additionalProperties: false
      required:
        - name
        - styleUrl
      properties:
        name:
          type: string
          minLength: 1
        styleUrl:
          type: string
          format: uri
        styleUrlDark:
          type: string
          format: uri
        darkCartography:
          type: boolean
    WebUIConfig:
      type: object
      additionalProperties: false
      required:
        - basemaps
        - timezone
        - identity
      properties:
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
        sourceBaseUrls:
          $ref: '#/components/schemas/SourceBaseUrls'
        timezone:
          type: string
          description: The IANA zone the service reads local time in.
        identity:
          $ref: '#/components/schemas/BrowserIdentity'
    BrowserIdentity:
      type: object
      additionalProperties: false
      description: >-
        Who the gate let through. It names the reader rather than identifying
        them: it is how a session can be seen to be the one intended.
      required:
        - display
        - admin
      properties:
        display:
          type: string
        admin:
          type: boolean
          description: >-
            Whether this subject holds cross-subject rights. Asserted by the
            same Auth0 Action that separately decides whether this subject
            may sign in at all — that decision is what admits the session in
            the first place, and holds regardless of this field's value.
    SourceBaseUrls:
      type: object
      additionalProperties: false
      properties:
        veloplanner:
          type: string
          format: uri
        komoot:
          type: string
          format: uri
    SurfaceRange:
      type: object
      additionalProperties: false
      required:
        - kind
        - startIndex
        - endIndex
      properties:
        kind:
          type: string
          enum:
            - asphalt
            - paving
            - compacted
            - gravel
            - ground
            - unknown
        startIndex:
          type: integer
          minimum: 0
        endIndex:
          type: integer
          minimum: 0
    GeoJSONLineString:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 3
            items:
              type: number
              format: double
    ActivityTrackLineString:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              format: double
    ActivityTrack:
      type: object
      additionalProperties: false
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          const: Feature
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
        geometry:
          oneOf:
            - $ref: '#/components/schemas/ActivityTrackLineString'
            - type: 'null'
        properties:
          $ref: '#/components/schemas/ActivityTrackProperties'
    ActivityTrackWorld:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - bounds
        - mapUrl
        - imageQuarterTurns
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        bounds:
          type: object
          additionalProperties: false
          description: >-
            The world's corners in degrees, which the coordinates of a ride in
            it fall between. Virtual coordinates: Watopia sits in open ocean.
          required:
            - north
            - west
            - south
            - east
          properties:
            north:
              type: number
              format: double
            west:
              type: number
              format: double
            south:
              type: number
              format: double
            east:
              type: number
              format: double
        mapUrl:
          type: string
          description: >-
            Where this service serves the world's map artwork from, on its own
            origin.
        imageQuarterTurns:
          type: integer
          minimum: 0
          maximum: 3
          description: >-
            How many quarter turns clockwise a reader has to turn the artwork
            by before `bounds` describes it. Zwift draws the newer worlds'
            minimaps a quarter turn from the frame their coordinates are quoted
            in, so artwork placed in that box untouched lands nowhere near the
            roads a ride in it was recorded on.
    ActivityTrackProperties:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - stored
            - pending
            - empty
            - unreadable
            - indoor
          description: >-
            indoor names a ride recorded over no ground: never given a line,
            regardless of whether it stored any coordinates.
        altitudeMetres:
          description: >-
            The altitude at each coordinate, indexed 1:1 with them; null where
            that sample recorded none. Omitted, never all null, when no
            positioned sample recorded an altitude.
          type: array
          items:
            type:
              - number
              - "null"
            format: double
        weather:
          description: >-
            What this ride was actually ridden through, one row per step of it,
            asked of the weather provider once after the ride's samples were
            stored. Absent for a ride nobody has asked about yet and for one the
            provider had nothing to say about.
          type: array
          items:
            $ref: '#/components/schemas/RideWeatherStep'
        world:
          description: >-
            The virtual world an indoor ride was ridden in, present only for a
            ride whose world this service knows the map of. Such a ride keeps
            `state: indoor` — it was ridden over no ground — but carries its
            line, which is drawn over the world's own artwork and never over a
            basemap.
          $ref: '#/components/schemas/ActivityTrackWorld'
        estimatedPowerWatts:
          description: >-
            Power this service worked out from the track itself, for a bicycle
            carrying no meter, indexed 1:1 with the coordinates; null where no
            estimate was made. Deliberately not `powerWatts`: it is an estimate
            from a physics model over position, altitude and time, never a
            measurement, and nothing may present it as one. Omitted entirely for
            a ride that carries real power, one with no usable track, and one
            whose rider has entered no mass.
          type: array
          items:
            type:
              - number
              - "null"
            format: double
    ActivitySeriesName:
      description: >-
        A series of a ride's samples. Every one but `speed` is read from the
        samples as recorded; `speed` prefers the device's own reading and, for
        a sample carrying none, falls back to the distance covered between it
        and the sample before.
      type: string
      enum:
        - heartRate
        - cadence
        - power
        - temperature
        - speed
        - targetPower
    ActivitySeries:
      type: object
      additionalProperties: false
      required:
        - series
        - values
      properties:
        series:
          $ref: '#/components/schemas/ActivitySeriesName'
        values:
          description: >-
            The series at each coordinate of the activity's track, indexed 1:1
            with them; null where that sample recorded nothing. Units are beats
            per minute, revolutions per minute, watts, degrees Celsius,
            kilometres per hour and watts respectively. A reading of zero is a
            reading — a stopped rider's cadence — and never stands in for an
            absent one.
          type: array
          items:
            type:
              - number
              - "null"
            format: double
    ActivitySplit:
      type: object
      additionalProperties: false
      description: >-
        One kilometre of a ride. A ride's last split is whatever was left over,
        which is what distanceMetres says; every other figure is of that stretch
        alone.
      required:
        - distanceMetres
        - movingSeconds
        - ascentMetres
      properties:
        distanceMetres:
          type: number
          format: double
        movingSeconds:
          description: >-
            The seconds the odometer advanced over. A stretch nothing was
            recorded across - a gap in the recording - carries nought.
          type: number
          format: double
        ascentMetres:
          description: >-
            The climbing parts of the stretch summed, unsmoothed, exactly as a
            route's own gain is cut. Nought for a ride that recorded no
            altitude.
          type: number
          format: double
        heartRateBpm:
          description: >-
            The mean of the samples over this stretch that carried a reading.
            Absent where none did.
          type: number
          format: double
        powerWatts:
          description: >-
            The mean of the stretch's measured power. Never fed by an estimate:
            a bicycle with no meter has no average power.
          type: number
          format: double
    ActivitySplits:
      type: object
      additionalProperties: false
      required:
        - splits
      properties:
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ActivitySplit'
    GeoJSONProperties:
      type: object
      additionalProperties: false
      required:
        - provider
        - sourceRouteId
        - stageOrder
        - title
        - sourceRouteName
        - routeName
        - distanceMetres
        - ascentMetres
        - descentMetres
        - maxGradientPercent
        - pointCount
      properties:
        provider:
          type: string
        sourceRouteId:
          type: integer
          format: int64
        stageOrder:
          type: integer
        title:
          type: string
        sourceRouteName:
          type: string
        routeName:
          type: string
        distanceMetres:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        descentMetres:
          type: number
          format: double
        maxGradientPercent:
          type: number
          format: double
        pointCount:
          type: integer
        surface:
          type: object
          additionalProperties: false
          required:
            - ranges
            - matchedMetres
          properties:
            ranges:
              type: array
              items:
                $ref: '#/components/schemas/SurfaceRange'
            matchedMetres:
              type: number
              format: double
        cumulativeSeconds:
          type: array
          items:
            type: number
            format: double
    GeoJSONFeature:
      type: object
      additionalProperties: false
      required:
        - type
        - bbox
        - geometry
        - properties
      properties:
        type:
          type: string
          const: Feature
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
        geometry:
          $ref: '#/components/schemas/GeoJSONLineString'
        properties:
          $ref: '#/components/schemas/GeoJSONProperties'
    WeatherPoint:
      type: object
      additionalProperties: false
      required:
        - time
        - temperatureCelsius
        - apparentTemperatureCelsius
        - precipitationMillimetres
        - precipitationProbabilityPercent
        - windSpeedKmh
        - windDirectionDegrees
        - weatherCode
        - cloudCoverPercent
      properties:
        time:
          type: string
          format: date-time
        temperatureCelsius:
          type: number
          format: double
        apparentTemperatureCelsius:
          type: number
          format: double
        precipitationMillimetres:
          type: number
          format: double
        precipitationProbabilityPercent:
          type: number
          format: double
        windSpeedKmh:
          type: number
          format: double
        windDirectionDegrees:
          type: number
          format: double
        weatherCode:
          type: integer
        cloudCoverPercent:
          type: number
          format: double
    WeatherForecast:
      type: object
      additionalProperties: false
      required:
        - points
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/WeatherPoint'
    WeatherGridManifest:
      description: >-
