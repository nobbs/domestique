    Route:
      type: object
      additionalProperties: false
      required:
        - provider
        - routeId
        - stageOrder
        - title
        - routeName
        - stageName
        - sourceRevision
        - contentHash
        - distanceMetres
        - ascentMetres
        - maxGradientPercent
        - pointCount
      properties:
        provider:
          type: string
        routeId:
          type: integer
          format: int64
        stageOrder:
          type: integer
        title:
          type: string
        routeName:
          type: string
        stageName:
          type: string
        sourceRevision:
          type: string
        contentHash:
          type: string
        distanceMetres:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        maxGradientPercent:
          type: number
          format: double
        pointCount:
          type: integer
        movingSeconds:
          type: number
          format: double
        validation:
          $ref: '#/components/schemas/RouteValidation'
    RouteList:
      type: object
      additionalProperties: false
      required:
        - stages
      properties:
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Route'
    SyncSchedule:
      type: object
      additionalProperties: false
      required:
        - source
        - targets
      properties:
        source:
          type: boolean
        targets:
          type: boolean
    SyncPhaseRun:
      type: object
      additionalProperties: false
      required:
        - lastCompletedAt
        - lastResult
        - sourceStages
        - created
        - updated
        - deleted
      properties:
        lastCompletedAt:
          type: string
          format: date-time
        lastResult:
          type: string
        lastFailure:
          type: string
        sourceStages:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    SyncPhases:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/SyncPhaseRun'
        targets:
          $ref: '#/components/schemas/SyncPhaseRun'
    SyncActive:
      type: object
      additionalProperties: false
      required:
        - targets
        - stages
      properties:
        phase:
          type: string
          enum:
            - source
            - targets
        startsAt:
          type: string
          format: date-time
        targets:
          type: integer
          minimum: 0
        stages:
          $ref: '#/components/schemas/TargetStages'
    SurfaceCoverage:
      type: object
      additionalProperties: false
      required:
        - classified
        - total
        - incomplete
      properties:
        generation:
          type: string
        builtAt:
          type: string
          format: date-time
        classified:
          type: integer
        total:
          type: integer
        incomplete:
          type: integer
    WahooRateLimit:
      type: object
      additionalProperties: false
      required:
        - remaining
      properties:
        remaining:
          type: integer
        resetsAt:
          type: string
          format: date-time
    TrustedInventory:
      type: object
      additionalProperties: false
      required:
        - ageSeconds
        - maxAgeSeconds
        - fresh
      properties:
        lastSuccessAt:
          type: string
          format: date-time
        ageSeconds:
          type: integer
        maxAgeSeconds:
          type: integer
        fresh:
          type: boolean
    SyncStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - phases
        - surface
        - sourceStages
        - created
        - updated
        - deleted
        - schedule
      properties:
        state:
          type: string
        active:
          $ref: '#/components/schemas/SyncActive'
        lastResult:
          type: string
        lastCompletedAt:
          type: string
          format: date-time
        sourceStages:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        schedule:
          $ref: '#/components/schemas/SyncSchedule'
        phases:
          $ref: '#/components/schemas/SyncPhases'
        surface:
          $ref: '#/components/schemas/SurfaceCoverage'
        wahooRateLimit:
          $ref: '#/components/schemas/WahooRateLimit'
        trustedInventory:
          $ref: '#/components/schemas/TrustedInventory'
    Build:
      type: object
      additionalProperties: false
      required:
        - revision
      properties:
        revision:
          type: string
        imageDigest:
          type: string
    Status:
      type: object
      additionalProperties: false
      required:
        - ready
        - converged
        - targets
        - sync
      properties:
        ready:
          type: boolean
        converged:
          type: boolean
        build:
          $ref: '#/components/schemas/Build'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetStatus'
        sync:
          $ref: '#/components/schemas/SyncStatus'
    SyncRun:
      type: object
      additionalProperties: false
      required:
        - reference
        - phase
        - completedAt
        - result
        - sourceStages
        - created
        - updated
        - deleted
      properties:
        reference:
          type: string
        phase:
          type: string
          enum:
            - source
            - targets
        completedAt:
          type: string
          format: date-time
        result:
          type: string
        failure:
          type: string
        sourceStages:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
    SyncRunPage:
      type: object
      additionalProperties: false
      required:
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        next:
          type: string
    Settings:
      type: object
      additionalProperties: false
      description: >-
        The settings held in the state database rather than in the
        configuration file, which take effect on the next run or the next
        request rather than on the next restart.
      required:
        - sync
        - notifications
        - basemaps
        - surface
        - wahoo
        - sources
        - rideModel
        - secretsSet
        - missing
      properties:
        sync:
          $ref: '#/components/schemas/SyncSettings'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
        surface:
          $ref: '#/components/schemas/SurfaceSettings'
        wahoo:
          $ref: '#/components/schemas/WahooSettings'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceSettings'
          description: >-
            The libraries a run reads, in the order it reads them. An empty list
            is a service nobody has configured yet, not an error.
        rideModel:
          $ref: '#/components/schemas/RideModelSettings'
        secretsSet:
          type: object
          additionalProperties:
            type: boolean
          description: >-
            Whether each credential is stored. This is the whole of what any
            observable surface is told about one: never the value, only that
            there is one to replace.
        missing:
          type: array
          items:
            type: string
          description: >-
            The settings still to be entered, in the order the page offers
            them. Everything a run needs is here, and so are the Pushover
            credentials while notifications are on, which no run needs but every
            notification does. Empty is a configured service.
    WahooApplicationUpdate:
      type: object
      additionalProperties: false
      description: >-
        The registered application, without the slots it writes to. Those are
        replaced on their own.
      required:
        - apiBaseUrl
        - oauthBaseUrl
        - clientId
      properties:
        apiBaseUrl:
          type: string
          description: The origin route reads and writes are sent to.
        oauthBaseUrl:
          type: string
          description: The origin an authorization and a token refresh are sent to.
        clientId:
          type: string
          description: The registered application's public identifier.
        clientSecret:
          type: string
          description: >-
            The application's secret, sent only when it was typed into the form.
            Left out it keeps the stored value, which is how a page that was
            never told the secret can save the rest of the application; sent
            empty it removes the credential.
    TargetsUpdate:
      type: object
      additionalProperties: false
      required:
        - targets
      properties:
        targets:
          type: array
          maxItems: 2
          items:
            type: string
          description: >-
            The destination slots, in the order they are offered. A slot name is
            the identity every stored authorization, target stage and recorded
            run already carries, so renaming one abandons that slot's state
            rather than moving it.
    SourceUpdate:
      type: object
      additionalProperties: false
      description: One library, and the account it is read with.
      required:
        - read
        - baseUrl
      properties:
        read:
          type: boolean
          description: >-
            Whether a run reads this library at all. Off takes it out of the
            list without forgetting the account it was read with.
        baseUrl:
          type: string
          description: >-
            The source's own web application, which is both the origin the
            service reads and the one a stage is linked back to.
        email:
          type: string
          description: >-
            The account's email address, sent only when it was typed. The rules
            the application secret follows apply here too.
        password:
          type: string
          description: The account's password, on the same terms as the email address.
    NotificationsUpdate:
      type: object
      additionalProperties: false
      required:
        - enabled
        - successPolicy
        - digestIntervalSeconds
        - pushoverBaseUrl
      properties:
        enabled:
          type: boolean
          description: >-
            The switch for the whole channel. Off suppresses a failure and a
            stale inventory as surely as it suppresses a routine success.
        successPolicy:
          type: string
          enum:
            - every
            - quiet
            - digest
        digestIntervalSeconds:
          type: integer
          minimum: 1
          description: The period one digest covers, read only by the digest policy.
        pushoverBaseUrl:
          type: string
          format: uri
          description: >-
            The origin the application token and user key are sent to.
        applicationToken:
          type: string
          description: >-
            The Pushover application's token, sent only when it was typed. The
            rules the application secret follows apply here too.
        userKey:
          type: string
          description: The recipient key, on the same terms as the application token.
    BasemapsUpdate:
      type: object
      additionalProperties: false
      required:
        - basemaps
      properties:
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
    SyncSettings:
      type: object
      additionalProperties: false
      required:
        - allowEmptySourceDeletion
        - staleAfterSeconds
        - initialDelaySeconds
      properties:
        allowEmptySourceDeletion:
          type: boolean
          description: >-
            Whether a source that reports an empty library may delete the last
            routes a target holds. It stays on until it is turned off again.
        staleAfterSeconds:
          type: integer
          minimum: 1
          description: >-
            How long the trusted source inventory may go without a successful
            refresh before it is reported and notified as stale.
        initialDelaySeconds:
          type: integer
          minimum: 1
          description: >-
            How long after start the first run is attempted. It is read by the
            start it delays, so an edit reaches the next restart rather than the
            next run.
    NotificationSettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - successPolicy
        - digestIntervalSeconds
        - pushoverBaseUrl
      properties:
        enabled:
          type: boolean
          description: >-
            The switch for the whole channel. Off suppresses a failure and a
            stale inventory as surely as it suppresses a routine success.
        successPolicy:
          type: string
          enum:
            - every
            - quiet
            - digest
        digestIntervalSeconds:
          type: integer
          minimum: 1
          description: The period one digest covers, read only by the digest policy.
        pushoverBaseUrl:
          type: string
          format: uri
          description: >-
            The origin the application token and user key are sent to.
    WahooSettings:
      type: object
      additionalProperties: false
      required:
        - apiBaseUrl
        - oauthBaseUrl
        - clientId
        - targets
      properties:
        apiBaseUrl:
          type: string
          description: >-
            The origin route reads and writes are sent to. Empty until the
            application is registered, which is a service that runs nothing
            rather than one that is broken.
        oauthBaseUrl:
          type: string
          description: The origin an authorization and a token refresh are sent to.
        clientId:
          type: string
          description: >-
            The registered application's public identifier. Its secret is not
            here: it is written through secrets and read back only as set.
        targets:
          type: array
          maxItems: 2
          items:
            type: string
          description: >-
            The destination slots, in the order they are offered. A slot name is
            the identity every stored authorization, target stage and recorded
            run already carries, so renaming one abandons that slot's state
            rather than moving it.
    SourceSettings:
      type: object
      additionalProperties: false
      required:
        - provider
        - baseUrl
      properties:
        provider:
          type: string
          enum:
            - veloplanner
            - komoot
        baseUrl:
          type: string
          description: >-
            The source's own web application, which is both the origin the
            service reads and the one a stage is linked back to.
    RideModelSettings:
      type: object
      additionalProperties: false
      required:
        - coefficientsFile
      properties:
        coefficientsFile:
          type: string
          description: >-
            The coefficient file the offline fitting tooling emits, named by an
            absolute path the service can read. Empty is predicted moving time
            switched off, which is also the default.
    SurfaceSettings:
      type: object
      additionalProperties: false
      required:
        - regions
        - rebuildIntervalSeconds
      properties:
        regions:
          type: array
          items:
            type: string
          description: >-
            The Geofabrik region paths the surface index is built from. An empty
            list switches classification off.
        rebuildIntervalSeconds:
          type: integer
          minimum: 1
          description: >-
            How often the index is rebuilt. Required whether or not a region is
            named: the rebuild schedule runs either way, and with no region it
            simply builds nothing.
    BrowserBasemap:
      type: object
      additionalProperties: false
      required:
        - name
        - styleUrl
      properties:
        name:
          type: string
          minLength: 1
        styleUrl:
          type: string
          format: uri
        styleUrlDark:
          type: string
          format: uri
        darkCartography:
          type: boolean
    WebUIConfig:
      type: object
      additionalProperties: false
      required:
        - basemaps
        - identity
      properties:
        basemaps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BrowserBasemap'
        sourceBaseUrls:
          $ref: '#/components/schemas/SourceBaseUrls'
        identity:
          $ref: '#/components/schemas/BrowserIdentity'
    BrowserIdentity:
      type: object
      additionalProperties: false
      description: >-
        Who the gate let through. There is one authorised address, so this
        names the reader rather than identifying them: it is how a session can
        be seen to be the one intended, and where the way out of it lives.
      required:
        - email
      properties:
        email:
          type: string
          format: email
        signOutUrl:
          type: string
          description: >-
            Where to end the session, served by whatever fronts this service
            rather than by the service itself. Absent when nothing does, so
            the page offers no way out instead of a link that answers 404.
    SourceBaseUrls:
      type: object
      additionalProperties: false
      properties:
        veloplanner:
          type: string
          format: uri
        komoot:
          type: string
          format: uri
    SurfaceRange:
      type: object
      additionalProperties: false
      required:
        - kind
        - startIndex
        - endIndex
      properties:
        kind:
          type: string
          enum:
            - asphalt
            - paving
            - compacted
            - gravel
            - ground
            - unknown
        startIndex:
          type: integer
          minimum: 0
        endIndex:
          type: integer
          minimum: 0
    GeoJSONLineString:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 3
            items:
              type: number
              format: double
    GeoJSONProperties:
      type: object
      additionalProperties: false
      required:
        - provider
        - routeId
        - stageOrder
        - title
        - routeName
        - stageName
        - distanceMetres
        - ascentMetres
        - maxGradientPercent
        - pointCount
      properties:
        provider:
          type: string
        routeId:
          type: integer
          format: int64
        stageOrder:
          type: integer
        title:
          type: string
        routeName:
          type: string
        stageName:
          type: string
        distanceMetres:
          type: number
          format: double
        ascentMetres:
          type: number
          format: double
        maxGradientPercent:
          type: number
          format: double
        pointCount:
          type: integer
        surface:
          type: object
          additionalProperties: false
          required:
            - ranges
            - matchedMetres
          properties:
            ranges:
              type: array
              items:
                $ref: '#/components/schemas/SurfaceRange'
            matchedMetres:
              type: number
              format: double
        cumulativeSeconds:
          type: array
          items:
            type: number
            format: double
    GeoJSONFeature:
      type: object
      additionalProperties: false
      required:
        - type
        - bbox
        - geometry
        - properties
      properties:
        type:
          type: string
          const: Feature
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
        geometry:
          $ref: '#/components/schemas/GeoJSONLineString'
        properties:
          $ref: '#/components/schemas/GeoJSONProperties'
    WeatherPoint:
      type: object
      additionalProperties: false
      required:
        - time
        - temperatureCelsius
        - apparentTemperatureCelsius
        - precipitationMillimetres
        - precipitationProbabilityPercent
        - windSpeedKmh
        - windDirectionDegrees
        - weatherCode
      properties:
        time:
          type: string
          format: date-time
        temperatureCelsius:
          type: number
          format: double
        apparentTemperatureCelsius:
          type: number
          format: double
        precipitationMillimetres:
          type: number
          format: double
        precipitationProbabilityPercent:
          type: number
          format: double
        windSpeedKmh:
          type: number
          format: double
        windDirectionDegrees:
          type: number
          format: double
        weatherCode:
          type: integer
    WeatherForecast:
      type: object
      additionalProperties: false
      required:
        - points
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/WeatherPoint'
