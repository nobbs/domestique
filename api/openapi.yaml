openapi: 3.1.0
info:
  title: Domestique API
  version: 1.0.0
  description: |
    The API contract served by Domestique. JSON property names are camelCase.
    All routes except `GET /healthz` require the signed Cloudflare Access
    assertion; state-changing routes also require the same-origin `Origin`
    header.
servers:
  - url: /
security:
  - accessAssertion: []
x-domestique-unmatched-path:
  status: 404
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
tags:
  - name: browser-api
    description: Programmatic same-origin API used by the embedded UI.
  - name: oauth
  - name: readiness
    description: Loopback readiness listener, served separately from the public handler.
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags:
        - readiness
      operationId: getReadiness
      security: []
      x-domestique-listener: readiness
      responses:
        "200":
          description: Local state is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        "503":
          description: Local state is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unready'
  /v1/status:
    get:
      tags:
        - browser-api
      operationId: getStatus
      responses:
        "200":
          description: Current local status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/sync:
    post:
      tags:
        - browser-api
      operationId: triggerSync
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/sync/source:
    post:
      tags:
        - browser-api
      operationId: triggerSourceSync
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/sync/targets:
    post:
      tags:
        - browser-api
      operationId: triggerTargetsSync
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/sync/targets/{target}:
    post:
      tags:
        - browser-api
      operationId: triggerTargetSync
      security:
        - accessAssertion: []
          browserOrigin: []
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/targets/{target}/clear:
    post:
      tags:
        - browser-api
      operationId: clearTarget
      security:
        - accessAssertion: []
          browserOrigin: []
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/sync/surface:
    post:
      tags:
        - browser-api
      operationId: triggerSurfaceSync
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/SyncInProgress'
  /v1/sync/schedule:
    put:
      tags:
        - browser-api
      operationId: setSyncSchedule
      security:
        - accessAssertion: []
          browserOrigin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSchedule'
      responses:
        "200":
          description: Stored schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSchedule'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/sync/runs:
    get:
      tags:
        - browser-api
      operationId: getSyncRuns
      parameters:
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A newest-first cursor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunPage'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/routes:
    get:
      tags:
        - browser-api
      operationId: getRoutes
      responses:
        "200":
          description: Stored stage inventory without geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteList'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}:
    get:
      tags:
        - browser-api
      operationId: getRoute
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      responses:
        "200":
          description: Stored stage metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}/geometry:
    get:
      tags:
        - browser-api
      operationId: getRouteGeometry
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      responses:
        "200":
          description: Stored stage geometry.
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJSONFeature'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/providers/{provider}/routes/{routeId}/stages/{stage}/reprocess:
    post:
      tags:
        - browser-api
      operationId: reprocessRoute
      parameters:
        - $ref: '#/components/parameters/Provider'
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "202":
          $ref: '#/components/responses/Accepted'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/routes/{routeId}/stages/{stage}:
    get:
      operationId: redirectLegacyRoute
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/routes/{routeId}/stages/{stage}/geometry:
    get:
      operationId: redirectLegacyGeometry
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/routes/{routeId}/stages/{stage}/reprocess:
    post:
      operationId: redirectLegacyReprocess
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/Stage'
      security:
        - accessAssertion: []
          browserOrigin: []
      responses:
        "308":
          $ref: '#/components/responses/LegacyRedirect'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /v1/settings:
    get:
      tags:
        - browser-api
      operationId: getSettings
      responses:
        "200":
          description: The settings in force right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/wahoo:
    put:
      tags:
        - browser-api
      operationId: setWahooApplication
      security:
        - accessAssertion: []
          browserOrigin: []
      description: >-
        Replaces the registered Wahoo application. The target slots are written
        separately: they are the targets this application writes to, not part
        of the application itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WahooApplicationUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/targets:
    put:
      tags:
        - browser-api
      operationId: setTargets
      security:
        - accessAssertion: []
          browserOrigin: []
      description: >-
        Replaces the destination slots whole, in the order they are offered. A
        slot name is the identity every stored authorization, target stage and
        recorded run already carries, so renaming one abandons that slot's state
        rather than moving it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/sources/{provider}:
    put:
      tags:
        - browser-api
      operationId: setSource
      security:
        - accessAssertion: []
          browserOrigin: []
      description: >-
        Replaces one library and the account it is read with, leaving the other
        libraries exactly as they are. Turning a library off removes it from the
        list a run reads; the account it was read with stays stored, so turning
        it back on does not ask for the credentials again.
      parameters:
        - name: provider
          in: path
          required: true
          description: The library this edit is about.
          schema:
            type: string
            enum:
              - veloplanner
              - komoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/notifications:
    put:
      tags:
        - browser-api
      operationId: setNotifications
      security:
        - accessAssertion: []
          browserOrigin: []
      description: Replaces the notification settings and the Pushover credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/basemaps:
    put:
      tags:
        - browser-api
      operationId: setBasemaps
      security:
        - accessAssertion: []
          browserOrigin: []
      description: >-
        Replaces the basemap list whole, in the order it is offered. The first
        is what a browser that has never chosen one loads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasemapsUpdate'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/surface:
    put:
      tags:
        - browser-api
      operationId: setSurface
      security:
        - accessAssertion: []
          browserOrigin: []
      description: Replaces the surface index's regions and rebuild cadence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurfaceSettings'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/ridemodel:
    put:
      tags:
        - browser-api
      operationId: setRideModel
      security:
        - accessAssertion: []
          browserOrigin: []
      description: Replaces the coefficient file predicted moving time is computed from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideModelSettings'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/settings/sync:
    put:
      tags:
        - browser-api
      operationId: setSync
      security:
        - accessAssertion: []
          browserOrigin: []
      description: >-
        Replaces the settings a run reads when it starts, including the gate
        that lets an empty library delete a target's routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSettings'
      responses:
        "200":
          $ref: '#/components/responses/SettingsStored'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /v1/webui/config:
    get:
      tags:
        - browser-api
      operationId: getWebUIConfig
      responses:
        "200":
          description: Browser-only runtime configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUIConfig'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /v1/weather:
    get:
      tags:
        - browser-api
      operationId: getWeather
      parameters:
        - name: point
          in: query
          required: true
          style: form
          explode: true
          allowReserved: true
          schema:
            type: array
            minItems: 1
            maxItems: 48
            items:
              type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?,.+$
      responses:
        "200":
          description: Forecast samples in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecast'
        "400":
          $ref: '#/components/responses/InvalidRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "502":
          $ref: '#/components/responses/ProviderUnavailable'
  /oauth/wahoo/start/{target}:
    get:
      tags:
        - oauth
      operationId: startOAuth
      parameters:
        - $ref: '#/components/parameters/Target'
      responses:
        "302":
          $ref: '#/components/responses/OAuthRedirect'
        "400":
          $ref: '#/components/responses/AuthorizationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "503":
          $ref: '#/components/responses/Unavailable'
  /oauth/wahoo/callback:
    get:
      tags:
        - oauth
      operationId: completeOAuth
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          $ref: '#/components/responses/BrowserRedirect'
        "400":
          $ref: '#/components/responses/AuthorizationFailed'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    accessAssertion:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Signed Cloudflare Access assertion for the configured principal.
    browserOrigin:
      type: apiKey
      in: header
      name: Origin
      description: Exact browser origin configured for this service. Required by every operation that starts a run or writes state, and modelled as a security scheme rather than a parameter because a request without it is refused rather than misread.
  parameters:
    Target:
      name: target
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RouteId:
      name: routeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Stage:
      name: stage
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    SettingsStored:
      description: >-
        Every setting now in force, not only the section this request replaced,
        so one answer refills the whole page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Settings'
    Accepted:
      description: Work was accepted to run asynchronously.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    InvalidRequest:
      description: Request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid Access assertion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Assertion identity or origin is not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Local state is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderUnavailable:
      description: Provider request failed without exposing provider detail.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SyncInProgress:
      description: A conflicting run is already active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthorizationFailed:
      description: OAuth request failed safely.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OAuthRedirect:
      description: Redirect to Wahoo authorization.
      headers:
        Location:
          required: true
          schema:
            type: string
            format: uri
    BrowserRedirect:
      description: Redirect back to browser UI.
      headers:
        Location:
          required: true
          schema:
            type: string
    LegacyRedirect:
      description: Permanent method-preserving redirect.
      headers:
        Location:
          required: true
          schema:
            type: string
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ready
    Unready:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          const: unready
        reason:
          type: string
          enum:
            - state_unreadable
            - state_incomplete
    Accepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
    TargetStages:
      type: object
      additionalProperties: false
      required:
        - current
        - pending
      properties:
        current:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
    TargetRun:
      type: object
