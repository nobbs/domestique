          $ref: '#/components/schemas/TargetRun'
    RouteValidation:
      type: object
      additionalProperties: false
      required:
        - biasPercent
        - maePercent
        - p90Percent
        - evaluatedRides
      properties:
        biasPercent:
          type: number
