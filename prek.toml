# A fast commit guard, not a second quality gate: whole-file safety checks that
# cost nothing, plus formatting scoped to the staged files. Tests, full linting,
# audits, cross-compilation and the browser suites belong to `mise run check`.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.agents/skills/"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.agents/skills/"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=512"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "detect-private-key"

[[repos]]
repo = "local"

# `pass_filenames = true` judges a commit on what it stages. `mise run ci-lint`
# runs these same hooks over every file with `prek run --all-files`.

[[repos.hooks]]
id = "golangci-format"
name = "golangci-lint format"
entry = "mise exec -- golangci-lint fmt --diff"
language = "system"
files = "\\.go$"
pass_filenames = true

# The file list comes from git rather than a filesystem glob: fetched skills are
# gitignored but still on disk, and a glob walked into third-party Markdown.
[[repos.hooks]]
id = "markdownlint"
name = "Markdown lint"
entry = "mise exec -- markdownlint-cli2"
language = "system"
files = "\\.md$"
pass_filenames = true

# yamlfmt parses before it formats, so it answers what `check-yaml` used to.
# What it will not touch is named in `.yamlfmt`'s exclude list.
[[repos.hooks]]
id = "yamlfmt"
name = "YAML format"
entry = "mise exec -- yamlfmt -conf .yamlfmt -lint"
language = "system"
files = "\\.ya?ml$"
pass_filenames = true

# yamlfmt preserves flow mappings. Reject nonempty flow nodes separately while
# allowing OpenAPI's idiomatic empty arrays (`[]`).
[[repos.hooks]]
id = "openapi-no-flow-style"
name = "OpenAPI block style"
entry = "mise exec -- yq eval --exit-status '[.. | select(style == \"flow\" and length > 0)] | length == 0'"
language = "system"
files = "^api/openapi\\.yaml$"
pass_filenames = true

# biome.json lives in internal/webui/app, not the repo root, so the entry
# shells out to a wrapper that cds there; biome isn't mise-pinned, so no
# `mise exec --`.
[[repos.hooks]]
id = "biome-format"
name = "Biome format"
entry = "dev/check-ui-format.sh"
language = "system"
files = "^internal/webui/app/.*\\.(ts|tsx|json)$"
pass_filenames = true
