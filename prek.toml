[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = "^\\.agents/skills/"

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = "^\\.agents/skills/"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=512"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "detect-private-key"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "golangci-format"
name = "golangci-lint format"
entry = "mise exec -- golangci-lint fmt --diff"
language = "system"
files = "\\.go$"
pass_filenames = true

# Files come from git, not a filesystem glob: gitignored, fetched skill Markdown stays unlinted.
[[repos.hooks]]
id = "markdownlint"
name = "Markdown lint"
entry = "mise exec -- markdownlint-cli2"
language = "system"
files = "\\.md$"
pass_filenames = true

[[repos.hooks]]
id = "yamlfmt"
name = "YAML format"
entry = "mise exec -- yamlfmt -conf .yamlfmt -lint"
language = "system"
files = "\\.ya?ml$"
pass_filenames = true

# yamlfmt preserves flow mappings; this rejects the ones it leaves alone.
[[repos.hooks]]
id = "openapi-no-flow-style"
name = "OpenAPI block style"
entry = "mise exec -- yq eval --exit-status '[.. | select(style == \"flow\" and length > 0)] | length == 0'"
language = "system"
files = "^api/openapi\\.yaml$"
pass_filenames = true

# biome.json lives in internal/webui/app; the wrapper cds there since biome isn't mise-pinned.
[[repos.hooks]]
id = "biome-format"
name = "Biome format"
entry = "dev/check-ui-format.sh"
language = "system"
files = "^internal/webui/app/.*\\.(ts|tsx|json)$"
pass_filenames = true

# gitleaks reads the staged diff itself; pass_filenames would only hand it
# positional arguments protect ignores, so it's explicitly off, not omitted.
[[repos.hooks]]
id = "gitleaks-protect"
name = "Secret scan"
entry = "mise exec -- gitleaks protect --staged --redact --no-banner"
language = "system"
pass_filenames = false
