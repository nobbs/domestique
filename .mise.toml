[tools]
go = "1.27.0"
node = "24.20.0"
# Kept in step with the `packageManager` field in internal/webui/app/package.json,
# which is what establishes the same pnpm inside the container build.
pnpm = "11.25.0"
golangci-lint = "2.13.2"
prek = "0.5.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
# fastq, which markdownlint-cli2 pulls in transitively, published 1.20.2 by
# hand on 2026-08-28 after eight months of workflow releases, so it carries no
# provenance where 1.20.0 and 1.20.1 do. mise reads that lost trust evidence as
# a downgrade and refuses the install. The release is what it claims to be —
# every file in the tarball is byte-identical to mcollina/fastq at v1.20.2, a
# four-line fix and its tests — so this names that one version and nothing
# else. Drop it once fastq publishes through its workflow again.
markdownlint-cli2 = { version = "0.23.2", trust_policy_excludes = ["fastq@1.20.2"] }
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
yq = "4.53.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"
"go:gotest.tools/gotestsum" = "v1.13.0"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "v1.30.0"
atlas = "1.3.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

# Every task lives in mise-tasks.toml, so this file stays what it has always
# been: the pins. See that file for the tasks themselves.
[task_config]
includes = ["mise-tasks.toml"]
