[tools]
go = "1.26.6"
node = "24.19.0"
golangci-lint = "2.12.2"
prek = "0.4.14"
actionlint = "1.7.12"
gitleaks = "8.30.1"
markdownlint-cli2 = "0.23.2"
shellcheck = "0.11.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"
"go:gotest.tools/gotestsum" = "v1.13.0"

[env]
GOCACHE = "{{config_root}}/.cache/go-build"
GOLANGCI_LINT_CACHE = "{{config_root}}/.cache/golangci-lint"

# Every task lives in mise-tasks.toml, so this file stays what it has always
# been: the pins. See that file for the tasks themselves.
[task_config]
includes = ["mise-tasks.toml"]
