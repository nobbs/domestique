[tools]
go = "1.27.1"
node = "24.20.0"
# Kept in step with the `packageManager` field in internal/webui/app/package.json.
pnpm = "12.1.0"
golangci-lint = "2.13.2"
prek = "0.5.2"
actionlint = "1.7.12"
gitleaks = "8.30.1"
# fastq 1.20.2 was published by hand, so mise reads it as a downgrade; drop once it publishes by workflow.
markdownlint-cli2 = { version = "0.23.2", trust_policy_excludes = ["fastq@1.20.2"] }
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
yq = "4.53.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.6.0"
"go:gotest.tools/gotestsum" = "v1.13.0"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "v1.31.1"
atlas = "1.3.0"

[env]
# Resolved against the main checkout: a linked worktree would otherwise grow its own multi-gigabyte cache.
GOCACHE = '{{ exec(command="git rev-parse --path-format=absolute --git-common-dir") | trim_end_matches(pat="/.git") }}/.cache/go-build'
GOLANGCI_LINT_CACHE = '{{ exec(command="git rev-parse --path-format=absolute --git-common-dir") | trim_end_matches(pat="/.git") }}/.cache/golangci-lint'

[task_config]
includes = ["mise-tasks.toml"]
