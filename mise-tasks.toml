# Every command the repository runs. `.mise.toml` holds the pins; this file is
# the work those tools do, already resolved to those pinned versions.
# `mise tasks ls` lists them, `mise tasks deps` draws the graph.
#
# `depends` runs in parallel, so ordering that matters is spelled `wait_for`,
# which orders two tasks when both are scheduled and does nothing when only one
# is. A task that reads a generated file waits for the generator that rewrites
# it in the worktree.
#
# `sources` lets mise skip a check whose inputs have not moved. A check earns
# one only when its verdict is a function of the files it names — `vulncheck`
# and `ui-audit` read advisory databases, `hygiene` and `secret-scan` read the
# whole worktree — and a glob names a kind of file, not today's directories, so
# it cannot stop noticing a new one. CI runs `mise run --force` regardless.

[fmt]
description = "Format the Go tree"
run = "golangci-lint fmt"

# The repository-wide pass the commit hook deliberately does not pay for: the
# hook runs these same prek hooks over staged files alone.
[hygiene]
description = "Run every prek hook over the whole tree"
wait_for = ["api-generate", "sql-generate"]
run = "prek run --all-files"

[lint]
description = "Lint the Go tree"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", ".golangci.yml", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "golangci-lint run ./..."

# Both scripts run somewhere a mistake is expensive: one against the deployed
# state, the other as root on the deploying host.
[shell-lint]
description = "Lint the shell scripts"
sources = ["deploy/*.sh", "dev/*.sh"]
outputs = { auto = true }
run = "shellcheck deploy/*.sh dev/*.sh"

# actionlint shells out to shellcheck for every `run:` block, so the pinned
# shellcheck above lints the workflow scripts too.
[workflow-lint]
description = "Lint the GitHub Actions workflows"
sources = [".github/workflows/*.yml"]
outputs = { auto = true }
run = "actionlint .github/workflows/*.yml"

# Asserts the structure that keeps the commit hook cheap, rather than a
# wall-clock number CI cannot measure reliably. See dev/check-hook-cost.sh.
[hook-check]
description = "Assert the commit hook stays cheap"
sources = ["prek.toml", "dev/check-hook-cost.sh"]
outputs = { auto = true }
run = "./dev/check-hook-cost.sh"

# `quick` is only trustworthy while it stays a strict subset of `check`, and the
# work it defers exactly the documented set. See dev/gatecheck.
[gate-check]
description = "Assert `quick` is a strict subset of `check`"
sources = ["mise-tasks.toml", ".mise.toml", "dev/gatecheck/*.go"]
outputs = { auto = true }
run = "go run ./dev/gatecheck"

# Catches a cycle or a malformed definition, which the gate would otherwise
# discover by failing somewhere less obvious.
[task-check]
description = "Validate the task definitions"
sources = ["mise-tasks.toml", ".mise.toml"]
outputs = { auto = true }
run = "mise tasks validate"

# One contract generates the Go models and the browser client. Generated files
# are committed, so `api-check` makes drift a review-time failure.
[api-generate]
description = "Generate Go models and browser API bindings from OpenAPI"
sources = ["api/openapi.yaml", "api/generate.go", "go.mod", "go.sum", "internal/webui/app/orval.config.ts", "internal/webui/app/src/api/request.ts", "internal/webui/app/package.json", "internal/webui/app/pnpm-lock.yaml"]
outputs = [
  "internal/httpapi/contract/openapi.gen.go",
  "internal/readiness/contract/openapi.gen.go",
  "internal/webui/app/src/api/generated.ts",
]
# The second command reads node_modules.
wait_for = ["ui-install"]
run = [
  "go run api/generate.go",
  "pnpm --dir internal/webui/app run api:generate",
]

[api-check]
description = "Check generated API bindings are current"
depends = ["api-generate"]
run = "./dev/check-generated.sh"

[sql-generate]
description = "Generate the SQLite query bindings"
sources = ["sqlc.yaml", "internal/sqlite/migrations/*.sql", "internal/sqlite/queries/*.sql"]
outputs = { auto = true }
run = "sqlc generate"

[sql-check]
description = "Check SQLite schema and query bindings are current"
depends = ["sql-generate"]
run = ["atlas migrate validate --dir file://internal/sqlite/migrations", "./dev/check-sql-generated.sh"]

# `standard-quiet` is what `go test` itself prints; the JUnit report beside it
# is what CI uploads to Codecov's test analytics. `-timeout` is spelled out
# because dev/gatecheck asserts this plus `test-race` against the CI job budget.
[test]
description = "Run the Go tests and write their JUnit report"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 gotestsum --format standard-quiet --junitfile .test-results/go.xml -- -shuffle=on -timeout=10m ./..."

# A separate invocation because the detector needs cgo, which the rest of this
# file does without, and costs several times the plain run. It waits for `test`
# rather than racing it: both drive the whole suite on one machine.
[test-race]
description = "Run the Go tests under the race detector"
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
wait_for = ["test"]
run = "CGO_ENABLED=1 go test -race -shuffle=on -timeout=10m ./..."

[vet]
description = "Vet the Go tree"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 go vet ./..."

[mod-check]
description = "Check the Go module graph is tidy and verified"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = ["go mod tidy -diff", "go mod verify"]

[vulncheck]
description = "Check the Go tree against the advisory database"
wait_for = ["api-generate"]
run = "CGO_ENABLED=0 govulncheck ./..."

[secret-scan]
description = "Scan the working tree for secrets"
wait_for = ["api-generate"]
run = "gitleaks dir . --redact --no-banner"

# Measured on demand: instrumenting the tree makes the suite slower. This
# reports what a change leaves untested; `patch-coverage` below is what judges.
[coverage]
description = "Measure Go and UI coverage"
depends = ["coverage-go", "coverage-ui"]

# -coverpkg attributes coverage across the whole service, so the per-package
# percentage on each line is the fraction of the service that package reached;
# the real number is the summary after it. dev/ is tooling, not the service.
[coverage-go]
description = "Measure Go coverage and summarise it per package"
wait_for = ["api-generate"]
run = [
  "mkdir -p .coverage",
  "CGO_ENABLED=0 go test -shuffle=on -coverpkg=./cmd/...,./internal/... -coverprofile=.coverage/go.out ./...",
  "go run ./dev/coveragesummary <.coverage/go.out",
]

# Vitest writes its LCOV beside the Go report under .coverage, so one upload
# step finds both; see the coverage block in internal/webui/app/vite.config.ts.
[coverage-ui]
description = "Measure UI coverage across the jsdom suite"
depends = ["ui-install"]
wait_for = ["api-generate"]
run = "pnpm --dir internal/webui/app run test:coverage"

# The one coverage verdict that blocks a merge, answered before the first push
# rather than five minutes and one push later. Needs no base and no network;
# see dev/patchcoverage. Outside `quick` and `check`, as `coverage` is.
[patch-coverage]
description = "Judge the coverage of what this change adds, as Codecov will"
depends = ["patch-coverage-go", "patch-coverage-ui"]

# No `sources`: the verdict is the working tree against a merge base, which is
# not a list of files mise can watch.
[patch-coverage-go]
description = "Judge the Go coverage of what this change adds"
depends = ["coverage-go"]
run = "go run ./dev/patchcoverage -flag go"

# Reports and does not fail, because codecov.yml's ui patch status does not
# either: the browser suite reaches code the LCOV file cannot see.
[patch-coverage-ui]
description = "Report the UI coverage of what this change adds"
depends = ["coverage-ui"]
run = "go run ./dev/patchcoverage -flag ui"

# bunx skills only manages .agents/skills/; the symlinks are what makes a
# fetched skill visible to Claude Code. No `sources`: what it checks is which
# symlinks exist on disk, not the files it would name.
[skills-sync]
description = "Fetch pinned skills and symlink them into .claude/skills for Claude Code"
run = '''
if [ -f skills-lock.json ]; then
  for s in $(jq -r '.skills | keys[]' skills-lock.json); do
    if [ ! -d ".agents/skills/$s" ]; then
      bunx skills experimental_install -y
      break
    fi
  done
fi
for d in .agents/skills/*/; do
  [ -d "$d" ] || continue
  n=$(basename "$d")
  [ -e ".claude/skills/$n" ] || ln -s "../../.agents/skills/$n" ".claude/skills/$n"
done
'''

# Snapshots the deployed SQLite state and writes a configuration that reads real
# VeloPlanner data but cannot reach Wahoo. See dev/setup.sh.
[dev-setup]
description = "Snapshot the deployed state into .local/dev"
run = "./dev/setup.sh"

# Serves on :8081 against the snapshot, so it never contends with the deployed
# container for a SQLite file.
[dev-api]
description = "Serve the API against the .local/dev snapshot"
run = "DOMESTIQUE_CONFIG_FILE={{config_root}}/.local/dev/config.toml CGO_ENABLED=0 go run ./cmd/domestique"

# A throwaway configuration over a synthetic library: no account, no secret, no
# copy of anyone's routes. See dev/demo.sh.
[demo]
description = "Run the whole stack against a synthetic library"
depends = ["ui-install"]
run = "./dev/demo.sh"

# Answers #623. Offline only, never in the image or a gate, and needs the
# operator's own snapshot: `mise run level-study -- -database .local/dev/state.db`.
[level-study]
description = "Cross-validate a rider's bicycle numbers against their stated bicycle"
run = "go run ./dev/levelstudy"

# The only thing that installs node_modules, which is why the routine loop can
# afford to depend on it. The timestamp is bumped because an install with
# nothing to do leaves that file alone and the task would never settle.
[ui-install]
description = "Install the UI dependency tree from the lockfile"
sources = [
  "internal/webui/app/package.json",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/node_modules/.modules.yaml"]
run = [
  "pnpm --dir internal/webui/app install --frozen-lockfile",
  "touch internal/webui/app/node_modules/.modules.yaml",
]

[ui-dev]
description = "Serve the UI with hot reload"
run = "pnpm --dir internal/webui/app run dev"

[storybook]
description = "Serve the UI component workshop"
run = "pnpm --dir internal/webui/app run storybook"

[storybook-build]
description = "Build the UI component workshop"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/*.json",
  "internal/webui/app/*.ts",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/storybook-static/**"]
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run storybook:build"

# The UI checks below read node_modules but do not install it. The three that
# read src/api/generated.ts also follow `api-check`.
[ui-typecheck]
description = "Type-check the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install", "api-check"]
run = "pnpm --dir internal/webui/app run typecheck"

[ui-lint]
description = "Lint the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install", "api-check"]
run = "pnpm --dir internal/webui/app run lint"

[ui-format]
description = "Format the UI"
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run format"

[ui-test]
description = "Run the jsdom UI suite"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install", "api-check"]
run = "pnpm --dir internal/webui/app run test"

# Separate from running the suite so a failure names which of the two went
# wrong. A host needing the browser's system libraries passes the escape hatch:
# `mise run ui-browser-install -- --with-deps`. CI's image already has them.
[ui-browser-install]
description = "Download the browser the whole-page suite runs in"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run test:browser:install"

# What a WebGL map and a cross-component interaction cannot be asserted about in
# jsdom. It starts the demo stack itself and reaches nothing else; see
# internal/webui/app/playwright.config.ts.
[ui-browser-test]
description = "Run the browser UI suite over the demo stack"
wait_for = ["ui-browser-install", "api-generate"]
run = "pnpm --dir internal/webui/app run test:browser"

# Every story in that same browser: an interaction asserted against a component
# with no jsdom test of its own, or a story that stopped matching its behaviour.
[ui-storybook-test]
description = "Run the Storybook component suite"
wait_for = ["ui-browser-install", "api-generate"]
run = "pnpm --dir internal/webui/app run test:storybook"

# Neither Vitest project can ask this: a story reaching for something only the
# test runner provides passes there and shows an error card in Storybook itself.
# Ordered after the story suite, whose timed interactions a third browser
# starting up alongside is enough to make miss.
[ui-storybook-sweep]
description = "Open every story and docs page in a built Storybook"
wait_for = ["ui-browser-install", "ui-storybook-test", "api-generate"]
run = "pnpm --dir internal/webui/app run test:storybook:sweep"

# govulncheck does not see npm packages, so the JavaScript tree needs its own
# advisory check in the same gate.
[ui-audit]
description = "Check the UI dependency tree against the advisory database"
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app audit --prod"

# Waits for `ci-ui` because the browser suite in that group bundles into this
# same directory, and two bundlers emptying it at once leave neither whole.
[ui-build]
description = "Build the UI bundle"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
# The bundle alone: `dist` also holds the committed placeholder that keeps the
# go:embed pattern valid, which the bundler neither writes nor reads.
outputs = ["internal/webui/app/dist/bundle/**"]
wait_for = ["ui-install", "ci-ui"]
run = "pnpm --dir internal/webui/app run build"

# A Docker build context carries no VCS metadata, so only a build input can say
# which commit produced the running service. SOURCE_REVISION is empty for a
# local build on purpose: reporting no revision is honest, a wrong one is not.
[build]
description = "Build the Linux service binary, UI bundle included"
depends = ["ui-build"]
run = """
mkdir -p build
REVISION_FLAGS=""
if [ -n "${SOURCE_REVISION:-}" ]; then
	REVISION_FLAGS="-ldflags=-X=github.com/nobbs/domestique/internal/build.revision=${SOURCE_REVISION}"
fi
CGO_ENABLED=0 GOOS=linux GOARCH="${BUILD_ARCH:-$(go env GOARCH)}" \
	go build -trimpath -buildvcs=true ${REVISION_FLAGS} -o build/domestique ./cmd/domestique
"""

# The release image is published for linux/amd64 alone. RELEASE_ARCHES is a list
# so publishing a second architecture is this line plus the workflow's platforms.
[build-check]
description = "Compile the published release target"
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
depends = ["ui-build"]
wait_for = ["ci-ui"]
run = """
RELEASE_ARCHES="amd64"
for arch in ${RELEASE_ARCHES}; do
	echo "==> linux/${arch}"
	CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
		go build -trimpath -buildvcs=true -o /dev/null ./cmd/domestique || exit 1
done
"""

# The one check that runs the built container rather than reasoning about it.
# Outside every gate: it needs an image, and building one needs a
# `docker login dhi.io`. CI runs it in the `Image` job. See
# dev/container-smoke.sh for pointing it at an image locally.
[container-smoke]
description = "Run the production image and assert it comes up"
run = "./dev/container-smoke.sh"

# CI runs the ci-* groups as separate jobs so a failure names the area it came
# from; `check` runs the same work locally in one command. Every step of a gate
# task is a task of its own, named in `depends`, and the gate carries no `run`:
# an inline command would run as part of the gate while being invisible to a
# dependency query, so `gate-check` rejects one.
[ci-lint]
description = "The lint half of the gate, as CI groups it"
depends = [
  "sql-check",
  "hygiene",
  "lint",
  "shell-lint",
  "workflow-lint",
  "hook-check",
  "gate-check",
  "task-check",
]

[ci-test]
description = "The test half of the gate, as CI groups it"
depends = ["vet", "test", "test-race"]

[ci-security]
description = "The security half of the gate, as CI groups it"
depends = ["mod-check", "vulncheck", "ui-audit", "secret-scan"]

# Every UI task reads node_modules, so this group installs before it runs
# anything and the checks that follow wait for it.
[ci-ui]
description = "The UI half of the gate, as CI groups it"
depends = [
  "ui-install",
  "api-check",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
  "ui-browser-install",
  "ui-browser-test",
  "ui-storybook-test",
  "ui-storybook-sweep",
]

# The routine local loop: every check that reads the tree as it stands and needs
# nothing beyond it. It defers `build-check` and `test-race`, the slowest,
# `vulncheck` and `ui-audit`, which need the network, and the browser-driven
# tasks, which need a browser. All still run in `check` and on every pull
# request; `gate-check` names the difference and asserts it is the whole of it.
[quick]
description = "The routine local loop"
depends = [
  "sql-check",
  "ui-install",
  "api-check",
  "hygiene",
  "lint",
  "shell-lint",
  "workflow-lint",
  "hook-check",
  "gate-check",
  "task-check",
  "vet",
  "test",
  "mod-check",
  "secret-scan",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
]

# GitHub Actions runs this same work on every pull request and is what gates the
# merge, so this buys an earlier answer rather than a different one.
[check]
description = "The full gate, on demand"
depends = ["ci-lint", "ci-test", "ci-security", "ci-ui", "build-check"]
