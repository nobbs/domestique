# `depends` runs tasks in parallel; `wait_for` orders two tasks instead.
# `sources` skips a check whose inputs haven't moved; CI always forces it anyway.

[fmt]
description = "Format the Go tree"
run = "golangci-lint fmt"

[hygiene]
description = "Run every prek hook over the whole tree"
depends = ["ui-install"]
wait_for = ["api-generate", "sql-generate"]
run = "prek run --all-files"

[lint]
description = "Lint the Go tree"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", ".golangci.yml", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "golangci-lint run ./..."

[shell-lint]
description = "Lint the shell scripts"
sources = ["deploy/*.sh", "dev/*.sh"]
outputs = { auto = true }
run = "shellcheck deploy/*.sh dev/*.sh"

# actionlint runs the pinned shellcheck for its `run:` blocks too.
[workflow-lint]
description = "Lint the GitHub Actions workflows"
sources = [".github/workflows/*.yml"]
outputs = { auto = true }
run = "actionlint .github/workflows/*.yml"

[task-check]
description = "Validate the task definitions"
sources = ["mise-tasks.toml", ".mise.toml"]
outputs = { auto = true }
run = "mise tasks validate"

[api-generate]
description = "Generate Go models and browser API bindings from OpenAPI"
sources = ["api/openapi.yaml", "api/generate.go", "go.mod", "go.sum", "internal/webui/app/orval.config.ts", "internal/webui/app/src/api/request.ts", "internal/webui/app/package.json", "internal/webui/app/pnpm-lock.yaml"]
outputs = [
  "internal/httpapi/contract/openapi.gen.go",
  "internal/readiness/contract/openapi.gen.go",
  "internal/webui/app/src/api/generated.ts",
]
# The second command reads node_modules.
wait_for = ["ui-install"]
run = [
  "go run api/generate.go",
  "pnpm --dir internal/webui/app run api:generate",
]

[api-check]
description = "Check generated API bindings are current"
depends = ["api-generate"]
run = "./dev/check-generated.sh"

[sql-generate]
description = "Generate the SQLite query bindings"
sources = ["sqlc.yaml", "internal/sqlite/migrations/*.sql", "internal/sqlite/queries/*.sql"]
outputs = { auto = true }
run = "sqlc generate"

[sql-check]
description = "Check SQLite schema and query bindings are current"
depends = ["sql-generate"]
run = ["atlas migrate validate --dir file://internal/sqlite/migrations", "./dev/check-sql-generated.sh"]

[test]
description = "Run the Go tests and write their JUnit report"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 gotestsum --format standard-quiet --junitfile .test-results/go.xml -- -shuffle=on -timeout=10m ./..."

# wait_for `test`, not depends: running both at once doubles the load on one CI machine.
[test-race]
description = "Run the Go tests under the race detector"
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
wait_for = ["test"]
run = "CGO_ENABLED=1 go test -race -shuffle=on -timeout=10m ./..."

[vet]
description = "Vet the Go tree"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 go vet ./..."

[mod-check]
description = "Check the Go module graph is tidy and verified"
wait_for = ["api-generate", "sql-generate"]
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = ["go mod tidy -diff", "go mod verify"]

[vulncheck]
description = "Check the Go tree against the advisory database"
wait_for = ["api-generate"]
run = "CGO_ENABLED=0 govulncheck ./..."

[coverage]
description = "Measure Go and UI coverage"
depends = ["coverage-go", "coverage-ui"]

[coverage-go]
description = "Measure Go coverage and summarise it per package"
wait_for = ["api-generate"]
run = [
  "mkdir -p .coverage",
  "CGO_ENABLED=0 go test -shuffle=on -coverpkg=./cmd/...,./internal/... -coverprofile=.coverage/go.out ./...",
  "go run ./dev/coveragesummary <.coverage/go.out",
]

[coverage-ui]
description = "Measure UI coverage across the jsdom suite"
depends = ["ui-install"]
wait_for = ["api-generate"]
run = "pnpm --dir internal/webui/app run test:coverage"

# Outside quick/check: needs a merge base and network access, unlike the rest of this file.
[patch-coverage]
description = "Judge the coverage of what this change adds, as Codecov will"
depends = ["patch-coverage-go", "patch-coverage-ui"]

[patch-coverage-go]
description = "Judge the Go coverage of what this change adds"
depends = ["coverage-go"]
run = "go run ./dev/patchcoverage -flag go"

# Never fails: the browser suite reaches UI code this LCOV file can't see.
[patch-coverage-ui]
description = "Report the UI coverage of what this change adds"
depends = ["coverage-ui"]
run = "go run ./dev/patchcoverage -flag ui"

# The symlink loop is what makes a fetched skill visible to Claude Code.
[skills-sync]
description = "Fetch pinned skills and symlink them into .claude/skills for Claude Code"
run = '''
if [ -f skills-lock.json ]; then
  for s in $(jq -r '.skills | keys[]' skills-lock.json); do
    if [ ! -d ".agents/skills/$s" ]; then
      bunx skills experimental_install -y
      break
    fi
  done
fi
for d in .agents/skills/*/; do
  [ -d "$d" ] || continue
  n=$(basename "$d")
  [ -e ".claude/skills/$n" ] || ln -s "../../.agents/skills/$n" ".claude/skills/$n"
done
'''

[dev-setup]
description = "Snapshot the deployed state into .local/dev"
run = "./dev/setup.sh"

[dev-api]
description = "Serve the API against the .local/dev snapshot"
run = "DOMESTIQUE_CONFIG_FILE={{config_root}}/.local/dev/config.toml CGO_ENABLED=0 go run ./cmd/domestique"

[demo]
description = "Run the whole stack against a synthetic library"
depends = ["ui-install"]
run = "./dev/demo.sh"

[level-study]
description = "Cross-validate a rider's bicycle numbers against their stated bicycle"
run = "go run ./dev/levelstudy"

# `touch` marks the output current even when the install itself changed nothing.
[ui-install]
description = "Install the UI dependency tree from the lockfile"
sources = [
  "internal/webui/app/package.json",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/node_modules/.modules.yaml"]
run = [
  "pnpm --dir internal/webui/app install --frozen-lockfile",
  "touch internal/webui/app/node_modules/.modules.yaml",
]

[ui-dev]
description = "Serve the UI with hot reload"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run dev"

[storybook]
description = "Serve the UI component workshop"
run = "pnpm --dir internal/webui/app run storybook"

[storybook-build]
description = "Build the UI component workshop"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/*.json",
  "internal/webui/app/*.ts",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/storybook-static/**"]
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run storybook:build"

[ui-typecheck]
description = "Type-check the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install", "api-check"]
run = "pnpm --dir internal/webui/app run typecheck"

[ui-lint]
description = "Lint the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install", "api-check"]
run = "pnpm --dir internal/webui/app run lint"

[ui-format]
description = "Format the UI"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run format"

[ui-test]
description = "Run the jsdom UI suite"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
depends = ["ui-install"]
wait_for = ["api-check"]
run = "pnpm --dir internal/webui/app run test"

[ui-browser-install]
description = "Download the browser the whole-page suite runs in"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run test:browser:install"

[ui-browser-test]
description = "Run the browser UI suite over the demo stack"
depends = ["ui-browser-install"]
wait_for = ["api-generate"]
run = "pnpm --dir internal/webui/app run test:browser"

[ui-storybook-test]
description = "Run the Storybook component suite"
wait_for = ["ui-browser-install", "api-generate"]
run = "pnpm --dir internal/webui/app run test:storybook"

# govulncheck doesn't see npm packages; this is the UI tree's own advisory check.
[ui-audit]
description = "Check the UI dependency tree against the advisory database"
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app audit --prod"

# Waits for `ci-ui`: two bundlers writing into `dist` at once corrupt it.
[ui-build]
description = "Build the UI bundle"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = ["internal/webui/app/dist/bundle/**"]
wait_for = ["ui-install", "ci-ui"]
run = "pnpm --dir internal/webui/app run build"

# SOURCE_REVISION is empty locally on purpose: no revision beats a wrong one.
[build]
description = "Build the Linux service binary, UI bundle included"
depends = ["ui-build"]
run = """
mkdir -p build
REVISION_FLAGS=""
if [ -n "${SOURCE_REVISION:-}" ]; then
	REVISION_FLAGS="-ldflags=-X=github.com/nobbs/domestique/internal/build.revision=${SOURCE_REVISION}"
fi
CGO_ENABLED=0 GOOS=linux GOARCH="${BUILD_ARCH:-$(go env GOARCH)}" \
	go build -trimpath -buildvcs=true ${REVISION_FLAGS} -o build/domestique ./cmd/domestique
"""

[build-check]
description = "Compile the published release target"
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
depends = ["ui-build"]
wait_for = ["ci-ui"]
run = """
RELEASE_ARCHES="amd64"
for arch in ${RELEASE_ARCHES}; do
	echo "==> linux/${arch}"
	CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
		go build -trimpath -buildvcs=true -o /dev/null ./cmd/domestique || exit 1
done
"""

# Outside every gate: needs a built image, which needs `docker login dhi.io`.
[container-smoke]
description = "Run the production image and assert it comes up"
run = "./dev/container-smoke.sh"

[ci-lint]
description = "The lint half of the gate, as CI groups it"
depends = [
  "sql-check",
  "hygiene",
  "lint",
  "shell-lint",
  "workflow-lint",
  "task-check",
]

[ci-test]
description = "The test half of the gate, as CI groups it"
depends = ["vet", "test"]

[ci-test-race]
description = "The race-detector half of the gate, as CI groups it"
depends = ["test-race"]

[ci-security]
description = "The security half of the gate, as CI groups it"
depends = ["mod-check", "vulncheck", "ui-audit"]

[ci-ui]
description = "The UI half of the gate, as CI groups it"
depends = [
  "ui-install",
  "api-check",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
  "ui-browser-install",
  "ui-browser-test",
  "ui-storybook-test",
  "storybook-build",
]

[quick]
description = "The routine local loop"
depends = [
  "sql-check",
  "ui-install",
  "api-check",
  "hygiene",
  "lint",
  "shell-lint",
  "workflow-lint",
  "task-check",
  "vet",
  "test",
  "mod-check",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
]

[check]
description = "The full gate, on demand"
depends = ["ci-lint", "ci-test", "ci-test-race", "ci-security", "ci-ui", "build-check"]
