# Every command the repository runs, as mise tasks. `.mise.toml` stays what it
# is — the tool and environment pins — and this file is the work those tools do.
# `mise tasks ls` lists them with the descriptions below; `mise tasks deps`
# draws the graph.
#
# Tools are not re-declared here. mise has already resolved every one of them
# from `.mise.toml`, so a task names `go` or `golangci-lint` directly and gets
# the pinned version.
#
# A note on ordering, because it is the one thing that does not survive a
# mechanical port: mise runs `depends` in parallel. Where a step genuinely has
# to follow another, it says so with `wait_for`, which orders two tasks when
# both are scheduled and does nothing when only one is. Ordering is never left
# to a `depends` list that happens to work.
#
# Most checks below declare `sources`, so mise skips one whose inputs have not
# moved since it last succeeded, and says so where it would have run it. Three
# rules decide which check gets that treatment:
#
#   * Its verdict must be a function of the files it names. `vulncheck` and
#     `ui-audit` read an advisory database that moves without the tree, so an
#     unchanged tree can still be newly vulnerable and they always run.
#   * Its inputs must be nameable. `hygiene` and `secret-scan` read the whole
#     worktree, and a source list that broad is likelier to be wrong than those
#     runs are to be slow.
#   * A glob is written to match a whole kind of file — `**/*.go`, not the
#     directories that hold Go today — because a list that misses a new file is
#     a check that stops noticing it.
#
# What makes that safe rather than merely fast: a failed task is never recorded
# as up to date, editing a task's own definition invalidates it, a glob that
# matches nothing is a `gate-check` failure, and CI runs `mise run --force`, so
# the gate a merge must satisfy never consults any of this.

[fmt]
description = "Format the Go tree"
run = "golangci-lint fmt"

# prek's own configuration over the whole tree. The installed commit hook runs
# the same hooks over staged files alone, so this is the repository-wide pass
# that the hook deliberately does not pay for.
[hygiene]
description = "Run every prek hook over the whole tree"
run = "prek run --all-files"

[lint]
description = "Lint the Go tree"
sources = ["**/*.go", "go.mod", "go.sum", ".golangci.yml", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "golangci-lint run ./..."

[markdownlint]
description = "Lint the Markdown"
sources = ["**/*.md", ".markdownlint-cli2.yaml"]
outputs = { auto = true }
run = 'markdownlint-cli2 "**/*.md"'

# Both scripts run somewhere a mistake is expensive: one against the deployed
# state, the other as root on the deploying host.
[shell-lint]
description = "Lint the shell scripts"
sources = ["deploy/*.sh", "dev/*.sh"]
outputs = { auto = true }
run = "shellcheck deploy/*.sh dev/*.sh"

# actionlint shells out to shellcheck for every `run:` block, so the pinned
# shellcheck above is what lints the workflow scripts too.
[workflow-lint]
description = "Lint the GitHub Actions workflows"
sources = [".github/workflows/*.yml"]
outputs = { auto = true }
run = "actionlint .github/workflows/*.yml"

# The commit hook is only worth installing while it stays fast. This asserts
# the structure that keeps it so, rather than a wall-clock number CI cannot
# measure reliably. See dev/check-hook-cost.sh.
[hook-check]
description = "Assert the commit hook stays cheap"
sources = ["prek.toml", "dev/check-hook-cost.sh"]
outputs = { auto = true }
run = "./dev/check-hook-cost.sh"

# `quick` is only trustworthy while it stays a strict subset of `check`. This
# asserts that, and that the work it defers is exactly the documented set, so a
# new check cannot land in one and be forgotten in the other. See
# dev/gatecheck.
[gate-check]
description = "Assert `quick` is a strict subset of `check`"
sources = ["mise-tasks.toml", ".mise.toml", "dev/gatecheck/*.go"]
outputs = { auto = true }
run = "go run ./dev/gatecheck"

# Catches a cycle or a malformed task definition, which the gate would otherwise
# discover by failing somewhere less obvious.
[task-check]
description = "Validate the task definitions"
sources = ["mise-tasks.toml", ".mise.toml"]
outputs = { auto = true }
run = "mise tasks validate"

# gotestsum runs `go test` and reformats its JSON stream: `standard-quiet` is
# what `go test` itself prints, so the only thing that changed here is the JUnit
# report written alongside it. CI uploads that file to Codecov's test analytics,
# which is what turns a failure into something readable on the pull request
# rather than a folded log; see the test-results block in .github/workflows/ci.yml.
#
# All three suites write their report under one gitignored directory, for the
# reason the coverage reports share theirs: an upload step should have one place
# to look.
#
# `-timeout` is spelled out rather than left to `go test`'s default, which is the
# same ten minutes. It is stated because the CI job that runs this also runs
# `test-race` after it, and the job's own budget has to exceed both — a number
# the gate can only check if both tasks say what they are. See dev/gatecheck.
[test]
description = "Run the Go tests and write their JUnit report"
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 gotestsum --format standard-quiet --junitfile .test-results/go.xml -- -shuffle=on -timeout=10m ./..."

# The same suite under the race detector, which answers a different question
# from the one `test` answers: `-shuffle=on` catches tests coupled through
# ordering, and the detector catches memory shared without synchronisation. The
# service is genuinely concurrent — the sync service and its reporter, the Wahoo
# client, the Access verifier and the composition root all run goroutines — and
# a data race there does not surface as a failing test. It surfaces as a
# corrupted report or a wedged run, in production, on a schedule.
#
# It is a second invocation rather than a flag on `test` because the two answer
# different questions and cost differently. The detector needs cgo, so it cannot
# share the `CGO_ENABLED=0` the rest of this file uses — on the pinned toolchain
# `CGO_ENABLED=0 go test -race` fails outright — and instrumenting the build
# costs several times the wall clock of the plain run. The routine local loop
# stays fast and cgo-free; `gate-check`'s deferred set is where that is written
# down.
#
# Nothing about the shipped artefact changes. `build`, `build-check` and the
# image stay `CGO_ENABLED=0` and statically linked; the detector instruments a
# test binary that is never published.
#
# `-timeout` is explicit because the toolchain has to be the one that gives up
# on a wedged package first: `go test` prints every goroutine's stack when its
# own timeout expires, and the runner prints nothing at all when
# `timeout-minutes` does. Both defaults are ten minutes, so left alone they
# expire together and the dump is lost.
#
# The budget that has to clear it is the CI job's, and that job runs `test`
# first, so it has to exceed both timeouts rather than only this one — a
# `-timeout` applies to each test binary, not to the invocation, so neither
# suite's total runtime is bounded by it. dev/gatecheck asserts that sum against
# the job. That is a floor rather than a guarantee: a tree slow enough that the
# surviving packages alone outlast the job would still be cut off, which is a
# reason to watch the job's duration, not a reason to leave the floor unstated.
#
# It waits for `test` for the reason the two coverage halves are ordered: both
# drive the whole suite, and running them at once on the same machine buys less
# wall clock than it costs in contention. Running it alone schedules only this.
[test-race]
description = "Run the Go tests under the race detector"
sources = ["**/*.go", "go.mod", "go.sum", "**/testdata/**", "internal/webui/app/dist/**"]
outputs = { auto = true }
wait_for = ["test"]
run = "CGO_ENABLED=1 go test -race -shuffle=on -timeout=10m ./..."

[vet]
description = "Vet the Go tree"
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
run = "CGO_ENABLED=0 go vet ./..."

[mod-check]
description = "Check the Go module graph is tidy and verified"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = { auto = true }
run = ["go mod tidy -diff", "go mod verify"]

[vulncheck]
description = "Check the Go tree against the advisory database"
run = "govulncheck ./..."

[secret-scan]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --redact --no-banner"

# Coverage is measured on demand and is deliberately not part of `quick`,
# `check`, or the CI gate: instrumenting the tree makes the suite slower. This
# task reports what a change leaves untested; it does not judge it. The task
# that does judge is `patch-coverage`, further down, which reads these same two
# reports and answers the one coverage question that blocks a merge.
[coverage]
description = "Measure Go and UI coverage"
depends = ["coverage-go", "coverage-ui"]

# -coverpkg attributes coverage across the whole service, so a function
# exercised only through another package's tests is not reported as dead. The
# cost is that the per-package percentage `go test` prints on each line below
# becomes the fraction of the whole service that package's tests reached; the
# real per-package number is the summary printed after it.
#
# Both coverage reports land under one gitignored directory so that a single
# upload step can find them without rediscovering where each toolchain likes to
# write. Vitest is pointed at the same place from internal/webui/app/vite.config.ts.
#
# The -coverpkg set is the service; dev/ is repository tooling, measured by its
# own tests but not part of the service's coverage.
[coverage-go]
description = "Measure Go coverage and summarise it per package"
run = [
  "mkdir -p .coverage",
  "CGO_ENABLED=0 go test -shuffle=on -coverpkg=./cmd/...,./internal/... -coverprofile=.coverage/go.out ./...",
  "go run ./dev/coveragesummary <.coverage/go.out",
]

# The jsdom suite, instrumented. Vitest writes its LCOV and a terminal summary
# under .coverage; see the coverage block in internal/webui/app/vite.config.ts
# for what it measures.
#
# The browser suite used to be merged in here, so that the map and the
# page-level components were not reported untested merely because only jsdom was
# asked. That merge cost around three minutes on every pull request — it drove a
# real Chromium over the demo stack — to move a status that no longer gates; see
# the ui block in codecov.yml. What the browser suite is for it still does, in
# `ui-browser-test`; it is no longer part of a number.
[coverage-ui]
description = "Measure UI coverage across the jsdom suite"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run test:coverage"

# The one coverage verdict that blocks a merge, answered here rather than five
# minutes and one push later. It reads the reports the tasks above write and
# grades them by the rules in codecov.yml; see dev/patchcoverage for why that
# needs no base measurement and no network. Run it before the first push of a
# change, which is when a shortfall is cheapest to fix.
#
# Deliberately outside `quick` and `check`, as `coverage` is: it measures the
# tree, which the routine loop should not pay for. `dev/gatecheck` walks from
# those two roots, so nothing there needs to know about these.
[patch-coverage]
description = "Judge the coverage of what this change adds, as Codecov will"
depends = ["patch-coverage-go", "patch-coverage-ui"]

# Each half depends on its own measurement rather than reading whatever report
# a previous run left behind. No `sources`: the verdict is a function of the
# working tree against a merge base, which is not a list of files mise can watch.
[patch-coverage-go]
description = "Judge the Go coverage of what this change adds"
depends = ["coverage-go"]
run = "go run ./dev/patchcoverage -flag go"

# Reports and does not fail, because codecov.yml's ui patch status does not
# either: the browser suite reaches code the LCOV file cannot see.
[patch-coverage-ui]
description = "Report the UI coverage of what this change adds"
depends = ["coverage-ui"]
run = "go run ./dev/patchcoverage -flag ui"

# Snapshots the deployed SQLite state and writes a development configuration
# that reads real VeloPlanner data but cannot reach Wahoo. See dev/setup.sh.
[dev-setup]
description = "Snapshot the deployed state into .local/dev"
run = "./dev/setup.sh"

# Serves the API on :8081 against the snapshot, so it never contends with the
# deployed container for a SQLite file.
[dev-api]
description = "Serve the API against the .local/dev snapshot"
run = "DOMESTIQUE_CONFIG_FILE={{config_root}}/.local/dev/config.toml CGO_ENABLED=0 go run ./cmd/domestique"

# Starts the whole demo: a throwaway configuration, a freshly seeded synthetic
# library, the API serving it, and the UI dev server in front. No account, no
# secret, and no copy of anyone's routes. See dev/demo.sh.
[demo]
description = "Run the whole stack against a synthetic library"
depends = ["ui-install"]
run = "./dev/demo.sh"

# Turns a Strava bulk export into a flat ride sample corpus for dev/fitter's
# ETA benchmark to score against. Never built into the image and always
# outside quick and check: it needs an export directory only the operator
# has, and its own unit suite runs entirely on in-module synthetic fixtures.
# The export path is required and has no default; pass it and where to write
# the corpus with
# `mise run ridemodel -- -export /path/to/export -out .local/ridemodel`.
[ridemodel]
description = "Turn a Strava bulk export into a ride sample corpus"
run = "go run ./dev/ridemodel"

# Benchmarks the accepted hybrid ETA model (#213, #239, #240) — the real
# internal/ridemodel.Predict, never a second implementation of it — against
# the corpus dev/ridemodel emits, and can recalibrate its two route
# coefficients when explicitly asked (#241). Never built into the image and
# always outside quick and check for the same reason ridemodel is: it needs a
# real corpus only the operator has, and its own unit suite runs entirely on
# in-module synthetic fixtures. The corpus directory and the coefficient file
# being evaluated are both required and have no default:
# `mise run fitter -- -corpus .local/ridemodel -coefficients
# /etc/domestique/ridemodel.toml`. Append `-recalibrate` to also refit
# seconds_per_km and seconds_per_ascent_m over the newest
# -eta-training-months of the corpus, validate that recipe against the
# rolling-origin folds of #251, and print a copy-ready profile.
[fitter]
description = "Benchmark and recalibrate the hybrid ETA model against the ride corpus"
run = "go run ./dev/fitter"

# The only thing that installs node_modules. It declares the lockfile as its
# source and the state file pnpm writes beside the installed tree as its output,
# so it reinstalls when a dependency changes or the tree is gone, and costs a few
# milliseconds otherwise — which is why the routine loop can afford to depend on
# it.
#
# The timestamp is bumped afterwards because an install with nothing to do leaves
# that file alone: without it, anything newer than the last real install — a task
# definition edited here, most often — leaves the task permanently stale and it
# reinstalls on every run.
[ui-install]
description = "Install the UI dependency tree from the lockfile"
sources = [
  "internal/webui/app/package.json",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/node_modules/.modules.yaml"]
run = [
  "pnpm --dir internal/webui/app install --frozen-lockfile",
  "touch internal/webui/app/node_modules/.modules.yaml",
]

[ui-dev]
description = "Serve the UI with hot reload"
run = "pnpm --dir internal/webui/app run dev"

[storybook]
description = "Serve the UI component workshop"
run = "pnpm --dir internal/webui/app run storybook"

[storybook-build]
description = "Build the UI component workshop"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/*.json",
  "internal/webui/app/*.ts",
  "internal/webui/app/pnpm-lock.yaml",
  "internal/webui/app/pnpm-workspace.yaml",
]
outputs = ["internal/webui/app/storybook-static/**"]
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run storybook:build"

# The UI checks below read node_modules but do not install it. `wait_for` orders
# them behind `ui-install` when a gate scheduled it, and does nothing when one
# of them is run on its own.
[ui-typecheck]
description = "Type-check the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run typecheck"

[ui-lint]
description = "Lint the UI"
sources = [
  "internal/webui/app/.storybook/**",
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run lint"

[ui-format]
description = "Format the UI"
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run format"

[ui-test]
description = "Run the jsdom UI suite"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = { auto = true }
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app run test"

# Downloads the browser the whole-page suite runs in. Separate from running the
# suite so that a failure names which of the two went wrong, and so a contributor
# can pay the download once.
#
# Arguments are the escape hatch for a host that needs --with-deps, which
# installs the browser's system libraries and needs root: run
# `mise run ui-browser-install -- --with-deps`, since mise appends what follows
# `--` to the command below. CI deliberately does not pass it: on ubuntu-24.04
# every library Chromium links is already on the image, so --with-deps adds
# nothing but fonts, off an apt mirror that has taken over five minutes to serve
# them. Reach for it on a bare container.
#
# It installs the dependency tree first so that it can be the first UI task a
# job runs, which is what the Coverage job needs: the browser has to be there
# before `mise run coverage` drives it.
[ui-browser-install]
description = "Download the browser the whole-page suite runs in"
depends = ["ui-install"]
run = "pnpm --dir internal/webui/app run test:browser:install"

# The whole page in a real browser, over `mise run demo`'s synthetic library:
# what a WebGL map and a cross-component interaction cannot be asserted about in
# jsdom. It starts the demo stack itself, so it needs the Go toolchain as well as
# the browser, and it reaches nothing but the service it started. See
# internal/webui/app/playwright.config.ts.
[ui-browser-test]
description = "Run the browser UI suite over the demo stack"
wait_for = ["ui-browser-install"]
run = "pnpm --dir internal/webui/app run test:browser"

# govulncheck does not see npm packages, so the JavaScript tree needs its own
# advisory check in the same gate.
[ui-audit]
description = "Check the UI dependency tree against the advisory database"
wait_for = ["ui-install"]
run = "pnpm --dir internal/webui/app audit --prod"

# The bundler empties dist, which would remove the committed placeholder that
# keeps the go:embed pattern valid before a UI build. Restore it afterwards.
#
# It waits for `ci-ui` for the same reason `build-check` does: the browser suite
# in that group bundles into this same directory. `build-check` waiting is not
# enough on its own, because a dependency is scheduled independently of what the
# task depending on it waits for — so the write has to be ordered where it
# happens.
[ui-build]
description = "Build the UI bundle"
sources = [
  "internal/webui/app/src/**",
  "internal/webui/app/e2e/**",
  "internal/webui/app/public/**",
  "internal/webui/app/index.html",
  "internal/webui/app/*.ts",
  "internal/webui/app/*.json",
]
outputs = ["internal/webui/app/dist/**"]
wait_for = ["ui-install", "ci-ui"]
run = [
  "pnpm --dir internal/webui/app run build",
  "touch internal/webui/app/dist/.gitkeep",
]

# The running service reports which public commit produced it, and only a
# trusted build input can say which one that is: a Docker build context carries
# no VCS metadata, so nothing inside the build can work it out. SOURCE_REVISION
# is empty for a local build on purpose — the service then reports no revision
# at all, which is honest, rather than one an operator might act on.
#
# BUILD_ARCH selects what this writes to disk, and defaults to the machine's own
# architecture so a local build runs where it was built; set it explicitly to
# cross-compile for the deployed host from another.
[build]
description = "Build the Linux service binary, UI bundle included"
depends = ["ui-build"]
run = """
mkdir -p build
REVISION_FLAGS=""
if [ -n "${SOURCE_REVISION:-}" ]; then
	REVISION_FLAGS="-ldflags=-X=github.com/nobbs/domestique/internal/build.revision=${SOURCE_REVISION}"
fi
CGO_ENABLED=0 GOOS=linux GOARCH="${BUILD_ARCH:-$(go env GOARCH)}" \
	go build -trimpath -buildvcs=true ${REVISION_FLAGS} -o build/domestique ./cmd/domestique
"""

# The release image is published for linux/amd64 alone, so that is what the
# compile check covers. RELEASE_ARCHES is a list so that publishing a second
# architecture again is this line plus the two platform arguments in the
# workflow.
#
# It waits for `ci-ui` because both rebuild the UI bundle into the same
# directory, and the browser suite reads the bundle it built. So does `ui-build`
# itself, which is where the write actually happens.
#
# The Makefile shared one flag set with `build`, so this carried the
# `SOURCE_REVISION` injection too. It does not any more: the binary goes to
# /dev/null, a revision stamped into it is read by nobody, and dropping it keeps
# this check a function of the files it names rather than of the environment.
[build-check]
description = "Compile the published release target"
sources = ["**/*.go", "go.mod", "go.sum", "internal/webui/app/dist/**"]
outputs = { auto = true }
depends = ["ui-build"]
wait_for = ["ci-ui"]
run = """
RELEASE_ARCHES="amd64"
for arch in ${RELEASE_ARCHES}; do
	echo "==> linux/${arch}"
	CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
		go build -trimpath -buildvcs=true -o /dev/null ./cmd/domestique || exit 1
done
"""

# Starts the production image under the runtime a deployment gives it and asks
# whether the service comes up: the one check that runs the built container
# rather than reasoning about it. Deliberately outside `check` and `quick`, and
# outside the ci-* groups: it needs an image, and building one needs a
# `docker login dhi.io` for the hardened base images, which a local gate must
# not require. CI runs it in the `Image` job, which already holds those
# credentials, over a natively built image. See dev/container-smoke.sh for how to
# point it at an image locally.
[container-smoke]
description = "Run the production image and assert it comes up"
run = "./dev/container-smoke.sh"

# CI runs the ci-* groups below as separate jobs so that a failure names the
# area it came from, and GitHub Actions running them is what actually gates a
# merge. Keep them as the only decomposition of the full gate: `check` exists to
# run the same work locally, in one command, when you want the answer earlier.
#
# Every step of a gate task — the ci-* groups, `check`, and `quick` — is a task
# of its own, named in `depends` (or `depends_post`, which counts the same way),
# and the gate task carries no `run` of its own.
# A command written inline on a gate task would still run as part of the gate
# while being invisible to a dependency query, so `gate-check` rejects one.
[ci-lint]
description = "The lint half of the gate, as CI groups it"
depends = [
  "hygiene",
  "lint",
  "markdownlint",
  "shell-lint",
  "workflow-lint",
  "hook-check",
  "gate-check",
  "task-check",
]

[ci-test]
description = "The test half of the gate, as CI groups it"
depends = ["vet", "test", "test-race"]

[ci-security]
description = "The security half of the gate, as CI groups it"
depends = ["mod-check", "vulncheck", "ui-audit", "secret-scan"]

# Every UI task reads node_modules, so this group installs before it runs
# anything — `ui-install` is a step here, and the checks that follow it wait for
# it.
[ci-ui]
description = "The UI half of the gate, as CI groups it"
depends = [
  "ui-install",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
  "ui-browser-install",
  "ui-browser-test",
]

# The routine local loop. It runs every check that reads the tree as it stands
# and needs nothing beyond it, and defers six things to `check` and to GitHub
# Actions, which is the authoritative gate a merge has to pass:
#
#   build-check  rebuilds the UI bundle and compiles the published release
#                target; the slowest check in the gate whenever the build cache
#                is cold, which is every CI run
#   test-race    reruns the whole Go suite under the race detector, which needs
#                cgo and costs several times the wall clock of the plain run
#   vulncheck    needs the network and a current Go advisory database
#   ui-audit     needs the network and a current npm advisory database
#   ui-browser-install
#                downloads a browser, which is a network fetch and a few hundred
#                megabytes on disk
#   ui-browser-test
#                runs that browser over the demo stack: minutes rather than
#                seconds, and useless without the download above
#
# Nothing is weakened by leaving them out: every one still runs in `check` and
# on every pull request. `gate-check` asserts that this list is the whole of the
# difference, so a check added to the full gate cannot silently skip this one.
#
[quick]
description = "The routine local loop"
depends = [
  "ui-install",
  "hygiene",
  "lint",
  "markdownlint",
  "shell-lint",
  "workflow-lint",
  "hook-check",
  "gate-check",
  "task-check",
  "vet",
  "test",
  "mod-check",
  "secret-scan",
  "ui-typecheck",
  "ui-lint",
  "ui-test",
]

# The full gate, on demand. GitHub Actions runs this same work on every pull
# request and is what gates the merge, so running it here buys an earlier
# answer rather than a different one. `quick` is what to run while writing and
# before handing work over; reach for this when a change specifically implicates
# one of the five checks `quick` defers.
[check]
description = "The full gate, on demand"
depends = ["ci-lint", "ci-test", "ci-security", "ci-ui", "build-check"]
