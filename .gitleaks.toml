# gitleaks configuration: the default rule set, plus the directories a local run
# leaves generated state in.
#
# `mise run secret-scan` scans the working tree rather than history, so it also sees
# files git never will. Two of those directories necessarily hold credential-
# shaped material: `mise run demo` mints a signed assertion for its dev server, and a
# development environment holds a placeholder key set. Both are gitignored, both
# are generated on the spot, and neither can reach a commit — but a scan that
# flags them fails the gate for having run the demo, which trains people to
# ignore it.
#
# Nothing here excludes a tracked path in the checkout being scanned. A secret in
# a file git can carry is still a finding.
#
# Linked worktrees are the exception, and only because they are not this
# checkout: `gitleaks dir` walks the filesystem, so a worktree nested under the
# repository root gets scanned a second time, by a run whose branch does not
# contain it. Each worktree scans itself, on its own branch, with this same
# config.

[extend]
useDefault = true

[allowlist]
description = "Gitignored local state generated by dev/demo.sh, dev/setup.sh, Storybook and the browser suite, plus linked worktrees, which scan themselves"
paths = [
  '''^\.local/''',
  '''^\.cache/''',
  '''^\.playwright/''',
  '''^\.pnpm-store/''',
  '''^internal/webui/app/storybook-static/''',
  '''^\.claude/worktrees/''',
  '''^\.worktrees/''',
]
