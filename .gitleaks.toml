# gitleaks configuration: the default rule set, plus the directories a local run
# leaves generated state in.
#
# The commit hook runs `gitleaks protect --staged`, which reads the staged git
# diff, not the filesystem — gitignored paths are never staged, so this
# allowlist only matters for a force-added (`git add -f`) file under one of
# them. It stays as a backstop: `mise run demo` mints a signed assertion for its
# dev server, and a development environment holds a placeholder key set, both
# credential-shaped and both gitignored.
#
# Nothing here excludes a tracked path in the checkout being scanned. A secret in
# a file git can carry is still a finding.

[extend]
useDefault = true

[allowlist]
description = "Gitignored local state generated by dev/demo.sh, dev/setup.sh, Storybook and the browser suite. atlas.sum holds one content hash per migration file, and a file named for the credentials table it creates reads to the generic rule as a key beside its value."
paths = [
  '''^internal/sqlite/migrations/atlas\.sum$''',
  '''^\.local/''',
  '''^\.cache/''',
  '''^\.playwright/''',
  '''^\.pnpm-store/''',
  '''^internal/webui/app/storybook-static/''',
]
