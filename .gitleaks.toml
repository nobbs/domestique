# gitleaks configuration: the default rule set alone.
#
# The commit hook runs `gitleaks protect --staged`, which reads the staged git
# diff, not the filesystem. Gitignored paths — dev/demo.sh and dev/setup.sh's
# generated state, Storybook and browser-suite output — are never staged under
# normal operation, so they need no allowlist entry of their own; carving one
# out for them would also exempt a force-added (`git add -f`) secret under the
# same path, which is exactly the case a backstop scan exists for.

[extend]
useDefault = true

[allowlist]
description = "atlas.sum holds one content hash per migration file, and a file named for the credentials table it creates reads to the generic rule as a key beside its value."
paths = [
  '''^internal/sqlite/migrations/atlas\.sum$''',
]
