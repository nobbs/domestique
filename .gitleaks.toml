# gitleaks configuration: the default rule set, plus the directories a local run
# leaves generated state in.
#
# `make secret-scan` scans the working tree rather than history, so it also sees
# files git never will. Two of those directories necessarily hold credential-
# shaped material: `make demo` mints a signed assertion for its dev server, and a
# development environment holds a placeholder key set. Both are gitignored, both
# are generated on the spot, and neither can reach a commit — but a scan that
# flags them fails the gate for having run the demo, which trains people to
# ignore it.
#
# Nothing here excludes a tracked path. A secret in a file git can carry is still
# a finding.

[extend]
useDefault = true

[allowlist]
description = "Gitignored local state, generated by dev/demo.sh, dev/setup.sh and the browser suite"
paths = [
  '''^\.local/''',
  '''^\.cache/''',
  '''^\.playwright/''',
]
