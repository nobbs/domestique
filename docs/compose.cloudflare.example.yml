# Public path for the Domestique Service, added alongside docs/compose.example.yml.
#
# These two containers share one network namespace and form a single tunnel
# node. The Tailscale container joins the tailnet as its own tagged node, so
# cloudflared can dial the Domestique Service by its MagicDNS name rather than
# by loopback or by a node address.
#
# Dialling the Service name is a security requirement, not a preference. It
# keeps Tailscale Serve in the request path, and Serve is what strips any
# client-supplied Tailscale-User-Login header before the application sees it.
# Pointed at 127.0.0.1:8080 instead, this tunnel would forward a header the
# application trusts, and any internet caller could name themselves the
# operator.
services:
  tunnel-tailscale:
    image: "tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680"
    restart: unless-stopped
    hostname: domestique-tunnel
    environment:
      # A reusable, pre-approved, tagged auth key. Supply it through .env; the
      # image does not read this value from a file. Once the state volume holds
      # the node identity, the key can be removed from the environment.
      TS_AUTHKEY: "${TUNNEL_TS_AUTHKEY:?set a tag:cloudflared auth key in .env}"
      TS_EXTRA_ARGS: "--advertise-tags=tag:cloudflared"
      TS_STATE_DIR: /var/lib/tailscale
      # MagicDNS is what resolves the Service name inside this namespace.
      TS_ACCEPT_DNS: "true"
      # Kernel networking; userspace mode would not give cloudflared a route to
      # the Service VIP without a SOCKS proxy it does not use for origins.
      TS_USERSPACE: "false"
    volumes:
      - tunnel-tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true

  cloudflared:
    # Pinned by digest as well as tag: the tag is what a human reads, the
    # digest is what actually gets run. Same convention as the Dockerfile.
    image: "cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38"
    restart: unless-stopped
    # Share the Tailscale container's namespace, so this process resolves and
    # reaches the Service exactly as that tagged node does.
    network_mode: "service:tunnel-tailscale"
    depends_on:
      - tunnel-tailscale
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--config"
      - "/etc/cloudflared/config.yml"
      - "run"
    volumes:
      # Holds config.yml and the tunnel credentials JSON. Both are secrets in
      # the sense that the credentials file authenticates this tunnel.
      - ./cloudflared:/etc/cloudflared:ro
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  tunnel-tailscale-state:
