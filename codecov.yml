# Codecov reports coverage on a pull request, and one of the four statuses below
# decides whether it can merge.
#
# `patch.go` is that one: the Go lines a pull request adds or changes must be
# covered at least as well as the base commit's already are. The other three are
# informational, so a shortfall shows up on the pull request and never blocks
# it. See "Coverage" in CONTRIBUTING.md for the rule and what to do when a
# change legitimately cannot clear the gate.
#
# `mise run patch-coverage` answers the enforced question locally, from the same
# two reports this file grades, before a push spends five minutes finding out.

codecov:
  # A report from a run whose checks failed describes a tree nobody is going to
  # merge, so there is nothing worth saying about it yet.
  require_ci_to_pass: true
  notify:
    # Both flags upload from the same job. Waiting for both means one comment
    # covering the change rather than one per language.
    #
    # The count is coverage reports, not uploads of every kind: the `Test` and
    # `UI` jobs also upload JUnit results under these same two flags, and those
    # are a separate report type that Codecov does not wait on here. So this
    # stays 2 — the two coverage reports the `Coverage` job produces — and a
    # pull request still gets one comment, now with any failed test named in it.
    after_n_builds: 2

coverage:
  precision: 1
  round: down
  # The band the report is coloured against. It sets no threshold and blocks
  # nothing; it is chosen to sit around where the service measures today.
  range: "60...95"

  status:
    # No unflagged status: an aggregate over two languages names nothing anyone
    # can act on. Each flag answers for itself instead.
    project:
      default: false
      go:
        flags:
          - go
        informational: true
      ui:
        flags:
          - ui
        informational: true
    patch:
      default: false
      # The enforced status. `target` is left unset, which means `auto`: the
      # base commit's coverage for this same flag. That is not an approximation
      # of "coverage must not fall" but exactly it — with existing coverage c
      # and a patch of n lines covered at rate p, the new total is at least c
      # precisely when p is at least c. Reading only the diff is what keeps the
      # legitimate deletion of well-covered code from failing a pull request,
      # which a project-total ratchet cannot avoid.
      go:
        flags:
          - go
        # Room for rounding against a base a fraction of a point higher, not
        # room for an untested function.
        threshold: 1%
      # Informational, because the measurement is Vitest alone. The browser suite
      # drives the map and the page-level components in real Chromium and none of
      # that enters the LCOV file, so an enforced target would fail every pull
      # request touching them — making the override the normal route rather than
      # the exception. Merging the browser suite in is what made this gate for a
      # while; it also cost around three minutes of CI on every pull request,
      # documentation-only ones included, and that is the trade this reverses.
      #
      # It still posts, and posts success, so a branch ruleset naming
      # `codecov/patch/ui` stays satisfiable.
      ui:
        flags:
          - ui
        threshold: 1%
        informational: true

# Both flags upload on every run of the coverage job, so nothing has to be
# carried forward from an older commit; a report is always the tree it names.
flags:
  go:
    paths:
      - cmd/
      - internal/
    carryforward: false
  ui:
    paths:
      - internal/webui/app/src/
    carryforward: false

# Neither toolchain writes paths that are relative to the repository root.
fixes:
  # A Go profile names each file by import path.
  - "github.com/nobbs/domestique/::"
  # Vitest writes LCOV paths relative to the UI project root.
  - "src/::internal/webui/app/src/"

ignore:
  # Repository tooling rather than the service. It is already outside the
  # profile's -coverpkg set; this keeps it out if that ever widens.
  - "dev/**"
  # The generated strict OpenAPI bindings are verified by generator freshness
  # and contract tests, not by handwritten branch coverage.
  - "internal/httpapi/contract/openapi.gen.go"
  - "internal/readiness/contract/openapi.gen.go"

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  # Say so even when coverage did not move: silence is ambiguous, because it
  # reads the same as an upload that never arrived.
  require_changes: false
