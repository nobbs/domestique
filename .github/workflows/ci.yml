name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      container: ${{ steps.filter.outputs.container }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        # v4.0.2
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: .github/paths-filter.yml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.lint == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # The module downloads and the compiler cache, which every Go job otherwise
      # pays for from scratch. Two of these paths are `.mise.toml`'s own choice
      # read back — it puts GOCACHE and GOLANGCI_LINT_CACHE under `.cache/` — and
      # dev/gatecheck asserts that the two files still name the same directories,
      # because a cache pointed at a directory nothing writes is saved on every
      # run and restores nothing.
      #
      # The key is the pinned toolchain, then `go.sum`, then the Go tree, so an
      # unchanged tree hits exactly and writes nothing back, and a source change
      # restores the entry built from the same dependencies and recompiles only
      # what moved. `.mise.toml` leads because it is what decides which compiler
      # wrote these directories: without it, a toolchain bump on its own would
      # still hit the old entry exactly, nothing the new compiler produced would
      # ever be saved, and every run would recompile cold until some source file
      # happened to move. The loosest restore-key drops it again on purpose — a
      # bump makes the compiler cache useless but not the module downloads, which
      # are the same bytes whatever compiles them. Each job keys its own entry
      # rather than sharing one: they compile different things — the race
      # detector's object files are not the plain suite's, and golangci-lint's
      # cache is neither — and a shared entry would be whichever job happened to
      # finish last.
      #
      # Nothing restored here can make a check pass that would otherwise fail:
      # every job runs `mise run --force`, and a compiler cache is keyed by the
      # content it was built from. It is the download and the recompilation that
      # is skipped, not the work.
      - name: Restore the Go caches
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            .cache/go-build
            .cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-lint-${{ runner.os }}-
      # --force here and in every other job: a task that declares `sources` is
      # skipped locally when its inputs have not moved, and the gate a merge
      # must satisfy is not the place to trust a cache. It costs nothing on a
      # fresh runner and keeps the property true if one ever restores state.
      - name: Run linters
        run: mise run --force ci-lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    # The suite runs twice here: once as it normally does, and once instrumented
    # by the race detector, which compiles and runs several times slower. The
    # budget is raised rather than the detector given less room, and it clears
    # both suites' `-timeout` put together — not just the race one's — because
    # this job runs them back to back and a `-timeout` bounds each test binary
    # rather than the invocation. A wedged package is then given up on by the
    # toolchain, which prints every goroutine's stack, rather than by the runner,
    # which prints nothing. dev/gatecheck asserts that sum against this number.
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go caches
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            .cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-test-${{ runner.os }}-
      - name: Run tests
        run: mise run --force ci-test
      # Test results go to Codecov's test analytics, which is what makes a
      # failure and a flake readable on the pull request instead of only in a
      # folded log here. They are uploaded from this job and the UI one rather
      # than from `coverage`, even though both are path-filtered and that one is
      # not: nothing compares a test report against a base, and none of these
      # uploads is a required status, so a commit that skipped a suite is a
      # commit with nothing to say rather than a missing context. Uploading from
      # here also means the report describes the suite as it normally runs,
      # rather than the instrumented variant `coverage` drives.
      #
      # A failed suite is exactly the run worth uploading, so the step is
      # conditioned on the run not being cancelled rather than on the one above
      # succeeding. It names its file, does not search the tree, and reports an
      # upload failure without failing the job — the same constraints the
      # coverage uploads carry, and for the same reasons. It is also the same
      # action at the same pinned version, with `report_type` telling it these
      # are test results rather than coverage; the dedicated
      # `codecov/test-results-action` does the same job but is deprecated in
      # favour of exactly this.
      - name: Upload Go test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/go.xml
          flags: go
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go caches
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            .cache/go-build
          key: go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-security-${{ runner.os }}-
      - name: Audit modules and dependencies
        run: mise run --force ci-security

  ui:
    name: UI
    runs-on: ubuntu-24.04
    # The browser suite downloads Chromium and its system libraries, builds the
    # demo API and then drives a software-rendered WebGL map, so this job is
    # minutes rather than seconds.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.ui == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # pnpm downloads every package once into a content-addressed store and hard
      # links it into node_modules, so the store is what makes `ui-install` a
      # link rather than a download. Its location is asked for rather than
      # assumed: pnpm derives it from the platform, and a merely probable path
      # would save an empty directory on every run and never hit.
      #
      # Keyed on the pinned toolchain and then the lockfile: the lockfile decides
      # what the store must hold, and `.mise.toml` decides which pnpm holds it,
      # and therefore which store layout at which path. The looser fallbacks
      # still save most of the download when a single dependency moved, or when
      # the pnpm pin moved without changing the store layout it writes.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      - name: Typecheck, lint and test the UI
        # Deliberately without --with-deps: the runner image already carries every
        # shared library Chromium links, so the flag only adds CJK, Thai, and
        # Cyrillic fonts the suite never renders, and it has spent over five
        # minutes waiting on the apt mirror to serve them.
        run: mise run --force ci-ui
      # Both UI suites under the `ui` flag, so Codecov distinguishes them from
      # the Go results the way the coverage flags already do. See the Go upload
      # above for why this job uploads at all and why it runs when the suite
      # failed. A step of `ci-ui` before the suites can fail and leave a file
      # unwritten, which the uploader reports and does not fail the job for.
      - name: Upload UI test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/ui/vitest.xml,.test-results/ui/browser.xml
          flags: ui
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      # A failed browser test leaves a trace, a failure screenshot and an HTML
      # report under `.playwright/`, and the runner discards them with itself.
      # The suite retries nothing on purpose, so a failure here is meant to be
      # reproducible from what it left rather than by running it again; without
      # the upload, reproducing it costs a Chromium download and a demo stack.
      # The path is Playwright's own output directory alone, never the working
      # tree, which can hold a configuration file, a local database and
      # `.local/`. Nothing uploads from a green run, and the retention is the
      # window in which somebody is actually looking at the failure.
      - name: Upload the browser suite's failure artefacts
        if: failure()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-ui
          path: .playwright/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    # Deliberately unfiltered: this job runs for every pull request and every
    # push, including one that touches only documentation.
    #
    # The branch ruleset requires `codecov/patch/go` and `codecov/patch/ui`, and
    # Codecov posts a status only for a commit it received a report for. A path
    # filter here would mean a documentation-only pull request uploads nothing,
    # the two required contexts never arrive, and the pull request is blocked
    # with nothing to un-block it. The same gap read from the other side: a
    # commit on the default branch with no report is a commit no later pull
    # request can compare against.
    #
    # The job measures both languages in one run because neither flag is carried
    # forward, so a report that arrived with only one of them would leave the
    # other's status describing a commit that is no longer the one under review.
    #
    # Both halves are unit suites: `go test` and Vitest, no browser and no demo
    # stack. The UI number used to include the browser suite, measured here
    # rather than in the path-filtered UI job so that the `ui` flag meant the
    # same thing on every commit — but that cost around three minutes on every
    # pull request, this one included, and it is what set the critical path. The
    # browser suite still runs, in the UI job, for what it is actually for.

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go caches
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            .cache/go-build
          key: go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-
      # The pnpm store, as the UI job above explains it.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      - name: Measure coverage
        run: mise run --force coverage
      # Each upload names exactly the one file it may send. disable_search and
      # the disabled plugins stop the uploader walking the tree for anything
      # else it recognises: this repository's working tree can hold a local
      # database, a configuration file, and secret files, and none of them is
      # ever an input to a coverage report.
      #
      # A failed upload is reported and does not fail the job. Coverage decides
      # nothing yet, and a pull request from a fork has no token at all, so
      # reddening CI for it would mean a broken merge gate rather than a
      # missing report.
      - name: Upload Go coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/go.out
          flags: go
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      - name: Upload UI coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/ui/lcov.info
          flags: ui
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go caches
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            .cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-build-${{ runner.os }}-
      # The pnpm store, as the UI job above explains it.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      # build-check bundles the UI before it compiles, because the binary
      # embeds dist, so the JavaScript tree has to be installed first.
      - name: Install UI dependencies
        run: mise run --force ui-install
      # This is the only check that compiles for both published architectures,
      # so it runs on every Go change rather than only when the image is built.
      - name: Compile for every published architecture
        run: mise run --force build-check

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - changes
      - lint
      - test
    # The proving build belongs to the pull request, and only to one that
    # changes an input of the container build: `container`, not the wider
    # `image` filter that decides whether a merge publishes. A Go change alone
    # is covered by `build`, which compiles the same targets far more cheaply.
    # A push to the default branch goes to `publish` instead, so the same tree
    # is never built twice.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.changes.outputs.container == 'true'

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.8
          install: true
          cache: true
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      # The build cache lives in the private GHCR package, so reading it needs
      # a login even though this job pushes nothing.
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hardened Images require authentication even on the free
      # Community tier, so the image cannot build without these secrets.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # One platform, which is the one that is published and the one this runner
      # is. That is what lets the result be --load-ed into the local image store
      # rather than proved and discarded: the smoke test below starts the very
      # image this step built, instead of a second build of it.
      #
      # The build reads the cache the default branch wrote and writes none of
      # its own: exporting needs `packages: write`, and a pull request must never
      # hold the permission that writes what a host deploys. A cache miss is a
      # warning rather than a failure, so a first run needs no bootstrapping.
      # SOURCE_REVISION is passed here too, so the argument the published build
      # depends on is exercised by the pull-request build that proves it.
      - name: Build production image
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          docker buildx build --platform linux/amd64
          --build-arg "SOURCE_REVISION=${SOURCE_REVISION}"
          --cache-from "type=registry,ref=${IMAGE}:buildcache"
          --load --tag domestique:smoke .
      # Runs the image the way docs/compose.example.yml runs it — unprivileged,
      # read-only root, no capabilities, one tmpfs, one state mount — and asserts
      # that the service comes up under it. It reaches no provider and mounts no
      # real secret; see dev/container-smoke.sh.
      - name: Smoke-test the production runtime contract
        run: mise run --force container-smoke

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - changes
      - lint
      - test
      - security
      - ui
      - build
    # Only a push to the default branch publishes, and only behind the whole
    # gate rather than the subset `image` waits for: what reaches the registry
    # is what a host will run.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.changes.outputs.image == 'true'

    # The workflow's own group keys a push by commit, so two pushes in quick
    # succession would publish in parallel and the older commit could land
    # last. This serialises them instead of cancelling either.
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Nothing is signed, so no `id-token` is needed. `packages: write` is the
    # only permission this repository's automation holds beyond read.
    permissions:
      contents: read
      packages: write

    # The index digest is the deployment instruction, so `deploy` takes it
    # straight from the build that produced it rather than resolving a tag.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hardened Images require authentication even on the free
      # Community tier, so the image cannot build without these secrets.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Trunk-based development has no version tags: `sha-` names the commit an
      # image was built from and never moves, while `latest` is a pointer for
      # inspection that a host must never deploy.
      - name: Compute tags, labels and annotations
        id: meta
        # v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      # The image is deliberately unsigned: GitHub artifact attestations need
      # Enterprise Cloud on a private repository, and this repository stays
      # private. BuildKit's own SBOM and mode=max provenance travel with the
      # index instead. `image-manifest` and `oci-mediatypes` are what make the
      # exported cache a manifest the registry accepts.
      - name: Build and publish image
        id: build
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          # One platform. The push is still an index, because mode=max
          # provenance and the SBOM travel as their own manifests beside the
          # image, so the operator instruction to pin the index digest is
          # unchanged by there being one architecture under it.
          platforms: linux/amd64
          # The commit is a build input rather than something the build can look
          # up: .dockerignore excludes .git, so this is the only trusted source
          # of the revision the running service reports.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      # The digest is the deployment instruction, so it belongs where an
      # operator copies it from rather than at the end of a build log.
      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          {
            echo "## Published image"
            echo
            echo "Pin this digest in the deploying host's DOMESTIQUE_IMAGE:"
            echo
            echo '```text'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags now pointing at it:"
            echo
            echo '```text'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: publish
    # Only what `publish` actually pushed is deployed. A commit that publishes
    # nothing leaves the host on the digest it is already running, which is the
    # same image that commit would have produced.
    #
    # `!cancelled()` is what makes that the whole condition. Without a status
    # function here the implicit gate is `success()` over every ancestor, not
    # over `publish` alone, so a commit that touched no UI file skipped `ui`,
    # published an image, and then skipped the deploy of it — green, and the
    # host left on an older digest than main. `publish` guards itself the same
    # way for the same reason.
    if: >-
      !cancelled() &&
      needs.publish.result == 'success'

    # A GitHub Environment for the deployment record and for the approval gate
    # it can grow later without touching this workflow.
    environment: production

    # Publishes are serialised in commit order, and deploys follow them in the
    # same order for the same reason: cancelling one mid-flight would leave the
    # host between two digests.
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Workload identity federation, so the tailnet credential is a short-lived
    # token GitHub mints for this repository rather than a stored secret. The
    # read is for the deploy script this job hands to the host.
    permissions:
      contents: read
      id-token: write

    steps:
      # One file, and no credentials left behind in the checkout: the next steps
      # of this job reach a production host.
      - name: Check out the deploy script
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: deploy/domestique-deploy.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The runner joins as an ephemeral tag:github node. Policy lets that tag
      # reach exactly port 22 of tag:domestique, as one named account.
      - name: Join the tailnet
        # v4.1.3
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:github
          ping: ${{ vars.DOMESTIQUE_HOST }}
      # The host runs its own copy of the script, so a copy left behind is a
      # deployment whose gates exist only in this repository. Sending it is what
      # keeps the two the same file; the host refuses anything that does not
      # arrive as a bash script that parses, and logs that it is already current
      # when they match.
      #
      # A host whose copy predates `--install-self` fails this step, and fails it
      # before the service is touched. Install the script by hand once; from then
      # on this step is what keeps it current.
      #
      # Before the deploy rather than after it, so the deploy that follows is
      # already the behaviour this commit describes.
      - name: Install the deploy script
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
        run: |
          set -eu

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh --install-self \
            < deploy/domestique-deploy.sh
      # Only the digest crosses the boundary. The host composes the reference
      # from its own configured repository, pins it, restarts the service, and
      # rolls back if the health gate fails; this job is green only if that
      # whole sequence was.
      - name: Deploy the published digest
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -eu

          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "publish reported no digest to deploy: '${DIGEST}'"
              exit 1
              ;;
          esac

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh "${DIGEST}"

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - test
      - security
      - ui
      - coverage
      - build
      - image
      - publish
      - deploy
    if: always()

    permissions: {}

    steps:
      # A skipped job and a job that never existed look identical on a commit
      # status, so the one required check reports what each dependency actually
      # did. This runs before the validation below, so a failing run explains
      # itself too.
      - name: Report what ran
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu

          {
            echo "## CI results"
            echo
            echo "A job reads \`skipped\` when a path filter found nothing it"
            echo "gates, or when the event was the other one of pull request"
            echo "and push. That is a pass, not a gap."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Changes | ${CHANGES_RESULT} |"
            echo "| Lint | ${LINT_RESULT} |"
            echo "| Test | ${TEST_RESULT} |"
            echo "| Security | ${SECURITY_RESULT} |"
            echo "| UI | ${UI_RESULT} |"
            echo "| Coverage | ${COVERAGE_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Image | ${IMAGE_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            echo "| Deploy | ${DEPLOY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Branch protection requires this single job. It fails unless every
      # dependency either succeeded or was skipped by a path filter, so a
      # cancelled or failed job upstream cannot be mistaken for a green run.
      # `image` and `publish` never both run, and a change that touches no
      # container input runs neither, so a skip here carries no information
      # about whether an image exists. `deploy` follows `publish`, so it skips
      # for the same commits. What this does guarantee is that a failed build,
      # publish, or deploy — including one that rolled the host back cleanly —
      # still reddens the commit.
      #
      # `coverage` is deliberately not in the loop below. It is reported above
      # so that a failed upload is visible, but this job does not judge the
      # numbers: the ruleset requires Codecov's own `codecov/patch/*` contexts,
      # so the verdict arrives from the app that measured it rather than from a
      # step here polling for it. A failed upload therefore still costs a report
      # rather than reddening this check.
      - name: Validate CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu

          for result in "$CHANGES_RESULT" "$LINT_RESULT" "$TEST_RESULT" \
            "$SECURITY_RESULT" "$UI_RESULT" "$BUILD_RESULT" "$IMAGE_RESULT" \
            "$PUBLISH_RESULT" "$DEPLOY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "CI validation failed: dependency result was '$result'"
                exit 1
                ;;
            esac
          done
