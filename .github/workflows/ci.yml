name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      container: ${{ steps.filter.outputs.container }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        # v4.0.2
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: .github/paths-filter.yml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.lint == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # Two entries, because they go stale on different clocks. The module
      # cache is downloads — the same bytes for any job — so `go.sum` alone keys
      # it, shared by every job here. The build cache is per job, and
      # `.mise.toml` leads its key: without it a toolchain bump would hit the old
      # entry exactly, save nothing the new compiler produced, and recompile cold
      # until a source file happened to move. Both paths are `.mise.toml`'s own
      # GOCACHE and GOLANGCI_LINT_CACHE, which dev/gatecheck asserts still match.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
            .cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-lint-${{ runner.os }}-
      # --force here and in every other job: a task with `sources` skips itself
      # when its inputs have not moved, which a merge gate must not do.
      - name: Run linters
        run: mise run --force ci-lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Must clear both suites' own `-timeout` summed: `-timeout` bounds each test
    # binary rather than the invocation, and this job runs the plain and the
    # race-instrumented suite back to back. A wedged package is then given up on
    # by the toolchain, which prints every goroutine's stack, rather than by the
    # runner, which prints nothing. dev/gatecheck asserts that sum against this.
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-test-${{ runner.os }}-
      - name: Run tests
        run: mise run --force ci-test
      # Uploaded whenever the run was not cancelled, because a failed suite is
      # exactly the one worth reporting. `report_type` is the supported path for
      # test results; `codecov/test-results-action` is deprecated in favour of it.
      - name: Upload Go test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/go.xml
          flags: go
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-security-${{ runner.os }}-
      - name: Audit modules and dependencies
        run: mise run --force ci-security

  ui:
    name: UI
    runs-on: ubuntu-24.04
    # The browser suite builds the demo API and drives a software-rendered WebGL
    # map on top of it, and the sweep builds the workshop first, so this job is
    # minutes rather than seconds.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.ui == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The whole history, which only this job needs: Chromatic decides what
          # a story's pixels are compared against by walking ancestry for the
          # last build it accepted, and a single-commit clone has no ancestry to
          # walk. It would answer by treating every story as new.
          fetch-depth: 0
          # The branch head, not the merge commit a pull request checks out by
          # default. Chromatic is told the head SHA but finds that build's
          # ancestors by walking `git rev-list HEAD`, and `refs/pull/N/merge` is
          # not a commit its index has ever seen, so every build reported no
          # ancestor. Empty on a push, where the default ref is already correct.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # This job compiles Go too: `api-check` regenerates the client, and the
      # browser suite's web server is `dev/demo.sh`, which builds `dev/demoapi`
      # before Playwright opens a page. Keyed as the Lint job above explains,
      # under its own build-cache prefix — what this job leaves in the compiler
      # cache is the demo stack, which is not what the others compile.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-ui-${{ runner.os }}-
      # pnpm hard-links out of a content-addressed store, so the store is what
      # makes `ui-install` a link rather than a download. Its location is asked
      # for rather than assumed: pnpm derives it from the platform, and a merely
      # probable path would save an empty directory and never hit.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      # A cache hit turns `ui-browser-install` into a check rather than a 184MB
      # download. Keyed on the exact `@playwright/test` pin, with no
      # restore-keys: an exact-match-only cache cannot fall back to a browser the
      # pinned version did not ask for.
      - name: Resolve the Playwright version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '"@playwright/test"' internal/webui/app/package.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "${VERSION}" ]; then
            echo "::error::could not resolve the @playwright/test version from internal/webui/app/package.json" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Restore the Playwright browser cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Typecheck, lint and test the UI
        # Deliberately without --with-deps: the runner image already carries
        # every library Chromium links, and the flag only adds fonts the suite
        # never renders, slowly.
        run: mise run --force ci-ui
      # A step's `env` is applied after its `if` is evaluated, and `secrets` is
      # not a context a step condition may read at all — so this cannot be an
      # `if` on the publish below: it would read an empty string and skip every
      # run, including the ones that can publish. Only the emptiness of the
      # token leaves this step, never the token.
      - name: Note whether there is a workshop to review
        id: visual
        if: ${{ !cancelled() }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          # The publish runs even after a failed suite, which is when the
          # picture is most worth looking at — but a `ci-ui` that stopped before
          # the sweep left no workshop to publish.
          if [ -n "${CHROMATIC_PROJECT_TOKEN:-}" ] && [ -d internal/webui/app/storybook-static ]; then
            echo "publishable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publishable=false" >> "${GITHUB_OUTPUT}"
          fi
      # Over the workshop `ci-ui` already built rather than a second one:
      # `test:storybook:sweep` leaves `storybook-static` behind, so the snapshots
      # are of exactly the bundle it swept. `main` accepts its own changes,
      # because the trunk is the baseline by definition.
      - name: Publish the workshop for visual review
        if: ${{ !cancelled() && steps.visual.outputs.publishable == 'true' }}
        # v18.6.0, the version of the CLI the addon carries in pnpm-lock.yaml.
        uses: chromaui/action@fd5e7e8b66d1a6862ed8866c21e93788217f7cf7
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: internal/webui/app
          storybookBuildDir: storybook-static
          autoAcceptChanges: main
      # All three UI suites under the `ui` flag. See the Go upload above for why
      # this runs when the suite failed.
      - name: Upload UI test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/ui/vitest.xml,.test-results/ui/browser.xml,.test-results/ui/storybook.xml
          flags: ui
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      # The suite retries nothing on purpose, so a failure is meant to be
      # reproducible from the trace, screenshot and report it left. The path is
      # Playwright's own output directory alone, never the working tree, which
      # can hold a configuration file, a local database and `.local/`.
      - name: Upload the browser suite's failure artefacts
        if: failure()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-ui
          path: .playwright/
          # The directory is hidden, and the uploader skips hidden files unless
          # told otherwise: without this it uploaded an empty artefact.
          include-hidden-files: true
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    # Deliberately unfiltered. The branch ruleset requires `codecov/patch/go`
    # and `codecov/patch/ui`, and Codecov posts a status only for a commit it
    # received a report for — so a path filter here would block a
    # documentation-only pull request with nothing to un-block it. Both
    # languages in one run, because a report carrying one flag would leave the
    # other's status describing a commit that is no longer under review.

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-
      # The pnpm store, as the UI job above explains it.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      - name: Measure coverage
        run: mise run --force coverage
      # Each upload names its one file: `disable_search` and the disabled
      # plugins stop the uploader walking a tree that can hold a local database,
      # a configuration file and secrets. A failed upload is reported and does
      # not fail the job — a fork's pull request has no token at all.
      - name: Upload Go coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/go.out
          flags: go
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      - name: Upload UI coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/ui/lcov.info
          flags: ui
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      # The Go caches, as the Lint job above explains them.
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-build-${{ runner.os }}-
      # The pnpm store, as the UI job above explains it.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      # build-check bundles the UI before it compiles, because the binary
      # embeds dist, so the JavaScript tree has to be installed first.
      - name: Install UI dependencies
        run: mise run --force ui-install
      # This is the only check that compiles for both published architectures,
      # so it runs on every Go change rather than only when the image is built.
      - name: Compile for every published architecture
        run: mise run --force build-check

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - changes
      - lint
      - test
    # The proving build belongs to a pull request that moved a container input —
    # `container`, not the wider `image` filter that decides whether a merge
    # publishes. A Go change alone is covered by `build`, and a push goes to
    # `publish`, so the same tree is never built twice.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.changes.outputs.container == 'true'

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.8.12
          install: true
          cache: true
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      # The build cache lives in the private GHCR package, so reading it needs
      # a login even though this job pushes nothing.
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hardened Images require authentication even on the free
      # Community tier, so the image cannot build without these secrets.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # One platform — the published one, and this runner's — which is what lets
      # the result be --load-ed for the smoke test below rather than built twice.
      # No cache is exported: that needs `packages: write`, and a pull request
      # must never hold the permission that writes what a host deploys.
      # SOURCE_REVISION is passed so the published build's argument is exercised.
      - name: Build production image
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          docker buildx build --platform linux/amd64
          --build-arg "SOURCE_REVISION=${SOURCE_REVISION}"
          --cache-from "type=registry,ref=${IMAGE}:buildcache"
          --load --tag domestique:smoke .
      # Runs the image as docs/compose.example.yml does — unprivileged,
      # read-only root, no capabilities — and asserts the service comes up under
      # it. It reaches no provider and mounts no real secret; see
      # dev/container-smoke.sh.
      - name: Smoke-test the production runtime contract
        run: mise run --force container-smoke

  prebuild:
    name: Prebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    # Everything `publish` will do except the push, run beside the gate instead
    # of after it. The expensive layer is one `go build` that the Dockerfile's
    # `--mount=type=cache` cannot help with — a cache mount lives on the builder,
    # and a fresh runner has none — so the only way to have it already is to have
    # produced it. This writes `:buildcache` and no tag; `publish` then runs the
    # identical build and is left with the push. Keyed to `image`, so a commit
    # that will not publish does not build either.
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.image == 'true'

    # Serialised against itself, not against `publish`, which guards a different
    # thing: two pushes would otherwise race to write one cache manifest. Each
    # pushes its blobs before the manifest, so the last one to land is complete
    # and a layer missing from it is rebuilt rather than read wrong.
    concurrency:
      group: prebuild-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # `packages: write` is for the cache manifest and nothing else. No tag a
    # host could deploy is pushed from here, and `:buildcache` is not a runnable
    # image.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hardened Images require authentication even on the free
      # Community tier, so the image cannot build without these secrets.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Platform, build-arg and context must match `publish`'s build exactly: a
      # layer is reused only by a build that hashes the same, and SOURCE_REVISION
      # is an input to the last and most expensive one.
      - name: Warm the build cache
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - changes
      - lint
      - test
      - security
      - ui
      - build
      - prebuild
    # Only a push to the default branch, and only behind the whole gate rather
    # than the subset `image` waits for: what reaches the registry is what a host
    # will run. `prebuild` is in `needs` for ordering, not as a condition — a
    # prebuild that failed leaves this job to do the whole build itself rather
    # than blocking a merge over a warm cache that did not happen.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.changes.outputs.image == 'true'

    # The workflow's own group keys a push by commit, so two in quick succession
    # would publish in parallel and the older commit could land last.
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Nothing is signed, so no `id-token` is needed. `packages: write` is the
    # only permission this repository's automation holds beyond read.
    permissions:
      contents: read
      packages: write

    # The index digest is the deployment instruction, so `deploy` takes it
    # straight from the build that produced it rather than resolving a tag.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hardened Images require authentication even on the free
      # Community tier, so the image cannot build without these secrets.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Trunk-based development has no version tags: `sha-` names the commit an
      # image was built from and never moves, while `latest` is a pointer for
      # inspection that a host must never deploy.
      - name: Compute tags, labels and annotations
        id: meta
        # v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      # Unsigned deliberately: artifact attestations need Enterprise Cloud on a
      # private repository, and this one stays private. BuildKit's own SBOM and
      # mode=max provenance travel with the index instead.
      - name: Build and publish image
        id: build
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          # One platform. The push is still an index — provenance and the SBOM
          # travel as their own manifests beside the image — so the instruction
          # to pin the index digest is unchanged.
          platforms: linux/amd64
          # .dockerignore excludes .git, so this is the only trusted source of
          # the revision the running service reports.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          # Exported only when `prebuild` did not already do it, which is what
          # stops the cache going stale when a prebuild failed. The condition is
          # negated so that the string is the *truthy* branch: `a && b || c`
          # picks `c` whenever `b` is falsy, and the empty string is falsy, so
          # the skip-when-success spelling would export on every run.
          cache-to: ${{ needs.prebuild.result != 'success' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE) || '' }}
      # The digest is the deployment instruction, so it belongs where an
      # operator copies it from rather than at the end of a build log.
      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          {
            echo "## Published image"
            echo
            echo "Pin this digest in the deploying host's DOMESTIQUE_IMAGE:"
            echo
            echo '```text'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags now pointing at it:"
            echo
            echo '```text'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: publish
    # Only what `publish` actually pushed. `!cancelled()` is the whole condition
    # on purpose: without a status function the implicit gate is `success()` over
    # every ancestor rather than over `publish` alone, so a commit that skipped
    # `ui` published an image and then skipped the deploy of it — green, with the
    # host left on an older digest than main.
    if: >-
      !cancelled() &&
      needs.publish.result == 'success'

    # A GitHub Environment for the deployment record and for the approval gate
    # it can grow later without touching this workflow.
    environment: production

    # Deploys follow publishes in commit order: cancelling one mid-flight would
    # leave the host between two digests.
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Workload identity federation, so the tailnet credential is a short-lived
    # token GitHub mints for this repository rather than a stored secret.
    permissions:
      contents: read
      id-token: write

    steps:
      # One file, and no credentials left behind in the checkout: the next steps
      # of this job reach a production host.
      - name: Check out the deploy script
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: deploy/domestique-deploy.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The runner joins as an ephemeral tag:github node. Policy lets that tag
      # reach exactly port 22 of tag:domestique, as one named account.
      - name: Join the tailnet
        # v4.1.3
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:github
          ping: ${{ vars.DOMESTIQUE_HOST }}
      # The host runs its own copy, so sending it is what keeps the two the same
      # file; the host refuses anything that does not arrive as a bash script
      # that parses. A host whose copy predates `--install-self` fails here,
      # before the service is touched — install it by hand once. Before the
      # deploy, so the deploy that follows is what this commit describes.
      - name: Install the deploy script
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
        run: |
          set -eu

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh --install-self \
            < deploy/domestique-deploy.sh
      # Only the digest crosses the boundary. The host composes the reference
      # from its own configured repository, pins it, restarts the service, and
      # rolls back if the health gate fails; this job is green only if that
      # whole sequence was.
      - name: Deploy the published digest
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -eu

          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "publish reported no digest to deploy: '${DIGEST}'"
              exit 1
              ;;
          esac

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh "${DIGEST}"

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - test
      - security
      - ui
      - coverage
      - build
      - image
      - prebuild
      - publish
      - deploy
    if: always()

    permissions: {}

    steps:
      # A skipped job and a job that never existed look identical on a commit
      # status, so this reports what each dependency actually did. Before the
      # validation below, so a failing run explains itself too.
      - name: Report what ran
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu

          {
            echo "## CI results"
            echo
            echo "A job reads \`skipped\` when a path filter found nothing it"
            echo "gates, or when the event was the other one of pull request"
            echo "and push. That is a pass, not a gap."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Changes | ${CHANGES_RESULT} |"
            echo "| Lint | ${LINT_RESULT} |"
            echo "| Test | ${TEST_RESULT} |"
            echo "| Security | ${SECURITY_RESULT} |"
            echo "| UI | ${UI_RESULT} |"
            echo "| Coverage | ${COVERAGE_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Image | ${IMAGE_RESULT} |"
            echo "| Prebuild | ${PREBUILD_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            echo "| Deploy | ${DEPLOY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # Branch protection requires this single job: it fails unless every
      # dependency either succeeded or was skipped by a path filter.
      #
      # `prebuild` is reported but not judged. It publishes nothing and gates
      # nothing — a failed one only leaves `publish` to build those layers
      # itself, a few minutes later, so reddening a commit whose image published
      # correctly would report a slower run as a broken one.
      #
      # `coverage` is not judged either: the ruleset requires Codecov's own
      # `codecov/patch/*` contexts, so the verdict arrives from the app that
      # measured it rather than from a step here polling for it.
      - name: Validate CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |-
          set -eu

          for result in "$CHANGES_RESULT" "$LINT_RESULT" "$TEST_RESULT" \
            "$SECURITY_RESULT" "$UI_RESULT" "$BUILD_RESULT" "$IMAGE_RESULT" \
            "$PUBLISH_RESULT" "$DEPLOY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "CI validation failed: dependency result was '$result'"
                exit 1
                ;;
            esac
          done
