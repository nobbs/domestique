name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      go: ${{ steps.filter.outputs.go }}
      ui: ${{ steps.filter.outputs.ui }}
      image: ${{ steps.filter.outputs.image }}
      container: ${{ steps.filter.outputs.container }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        # v4.0.2
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          filters: .github/paths-filter.yml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    # A push to main has already merged an up-to-date, previously-linted branch.
    if: github.event_name == 'pull_request' && needs.changes.outputs.lint == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
            .cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-lint-${{ runner.os }}-
      # A cached task with `sources` must not skip itself here: this is the gate.
      - name: Run linters
        run: mise run --force ci-lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    # Must exceed the suite's own -timeout.
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-test-${{ runner.os }}-
      - name: Run tests
        run: mise run --force ci-test
      - name: Upload Go test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/go.xml
          flags: go
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  race:
    name: Race
    runs-on: ubuntu-24.04
    # Must exceed the suite's own -timeout plus the race build.
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-race-${{ runner.os }}-
      - name: Run tests
        run: mise run --force ci-test-race

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-security-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-security-${{ runner.os }}-
      - name: Audit modules and dependencies
        run: mise run --force ci-security

  ui:
    name: UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Chromatic walks ancestry to find the last accepted build; a
          # single-commit clone has none and treats every story as new.
          fetch-depth: 0
          # Chromatic finds ancestors via `git rev-list HEAD` against the head
          # SHA, and a fork's head SHA is fetchable only as this ref, not by SHA.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-ui-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-ui-${{ runner.os }}-
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      # Exact-match only, no restore-keys: a fallback hit would run the suite
      # against a Chromium build the pin didn't ask for.
      - name: Resolve the Playwright version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '"@playwright/test"' internal/webui/app/package.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          if [ -z "${VERSION}" ]; then
            echo "::error::could not resolve the @playwright/test version from internal/webui/app/package.json" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_VERSION=${VERSION}" >> "${GITHUB_ENV}"
      - name: Restore the Playwright browser cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Typecheck, lint and test the UI
        run: mise run --force ci-ui
      # `secrets` cannot be read in a step `if:`, so the token's presence is
      # tested here and passed on as an output instead.
      - name: Note whether there is a workshop to review
        id: visual
        if: ${{ !cancelled() }}
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CHROMATIC_PROJECT_TOKEN:-}" ] && [ -d internal/webui/app/storybook-static ]; then
            echo "publishable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publishable=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish the workshop for visual review
        if: ${{ !cancelled() && steps.visual.outputs.publishable == 'true' }}
        # v18.6.0
        uses: chromaui/action@fd5e7e8b66d1a6862ed8866c21e93788217f7cf7
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: internal/webui/app
          storybookBuildDir: storybook-static
          autoAcceptChanges: main
      - name: Upload UI test results
        if: ${{ !cancelled() }}
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .test-results/ui/vitest.xml,.test-results/ui/browser.xml,.test-results/ui/storybook.xml
          flags: ui
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      - name: Upload the browser suite's failure artefacts
        if: failure()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-ui
          path: .playwright/
          # Hidden directory; the uploader skips hidden files by default.
          include-hidden-files: true
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    # Unfiltered on purpose: the branch ruleset requires Codecov's own
    # per-commit status, which never arrives for a commit this job skipped.

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      - name: Measure coverage
        run: mise run --force coverage
      - name: Warm the race build cache
        if: github.event_name == 'push'
        run: mise exec -- env CGO_ENABLED=1 go test -race -run '^$' ./...
      - name: Upload Go coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/go.out
          flags: go
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      - name: Upload UI coverage
        # v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/ui/lcov.info
          flags: ui
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'

    permissions:
      contents: read

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Restore the Go module cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-
      - name: Restore the Go build cache
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('go.sum') }}-
            go-coverage-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            go-build-${{ runner.os }}-
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(mise exec -- pnpm store path)" >> "${GITHUB_ENV}"
      - name: Restore the pnpm store
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('internal/webui/app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-
            pnpm-${{ runner.os }}-
      - name: Install UI dependencies
        run: mise run --force ui-install
      - name: Compile for every published architecture
        run: mise run --force build-check

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - changes
      - lint
      - test
    # Only a PR that touched a container input; a Go-only change is covered by
    # `build`, and a push is covered by `publish` — the same tree is never built twice.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.changes.outputs.container == 'true'

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # v4.2.5
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
        with:
          version: 2026.9.3
          install: true
          cache: true
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      # The build cache lives in the private GHCR package; reading it needs auth.
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # DHI requires authentication even on the free Community tier.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # No cache export here: that needs packages: write, which a pull request
      # must never hold.
      - name: Build production image
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          docker buildx build --platform linux/amd64
          --build-arg "SOURCE_REVISION=${SOURCE_REVISION}"
          --cache-from "type=registry,ref=${IMAGE}:buildcache"
          --load --tag domestique:smoke .
      - name: Smoke-test the production runtime contract
        run: mise run --force container-smoke

  prebuild:
    name: Prebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    # Warms the layer cache `publish` will reuse, run beside the gate rather
    # than after it: a fresh runner has no --mount=type=cache to draw on, so
    # producing the cache ahead of time is the only way to have it already.
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.image == 'true'

    # Serialised against itself: two concurrent pushes would race to write one
    # cache manifest.
    concurrency:
      group: prebuild-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Cache manifest only; no tag a host could deploy is pushed from here.
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # DHI requires authentication even on the free Community tier.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # Must match `publish`'s build exactly: a layer is reused only when the
      # hash matches, and SOURCE_REVISION feeds the last, most expensive one.
      - name: Warm the build cache
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - changes
      - lint
      - test
      - race
      - security
      - ui
      - build
      - prebuild
    # `prebuild` is in `needs` for ordering only, not as a condition: if it
    # failed, this job just does the whole build itself instead of blocking a
    # merge over a warm cache that never happened.
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.race.result == 'success' || needs.race.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.ui.result == 'success' || needs.ui.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.changes.outputs.image == 'true'

    # Keyed by branch, not commit: two pushes to it in quick succession must
    # not publish in parallel, where the older one could land last.
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest

    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        # v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Container Registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # DHI requires authentication even on the free Community tier.
      - name: Authenticate to Docker Hardened Images
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      # `latest` is for inspection only; a host must deploy by digest, never it.
      - name: Compute tags, labels and annotations
        id: meta
        # v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
      - name: Build and publish image
        id: build
        # v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          # .dockerignore excludes .git, so this is the only trusted source of
          # the revision the running service reports.
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          # `a && b || c` picks c whenever b is falsy, including an empty
          # string — so this must read success, not the skip case, or it
          # would export on every run instead of only when prebuild didn't.
          cache-to: ${{ needs.prebuild.result != 'success' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE) || '' }}
      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu

          {
            echo "## Published image"
            echo
            echo "Pin this digest in the deploying host's DOMESTIQUE_IMAGE:"
            echo
            echo '```text'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags now pointing at it:"
            echo
            echo '```text'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: publish
    # `!cancelled()` rather than the implicit success() over every ancestor:
    # a commit that skipped `ui` would otherwise skip deploying an image it
    # did publish, green, leaving the host on an older digest.
    if: >-
      !cancelled() &&
      needs.publish.result == 'success'

    environment: production

    # Deploys follow publishes in commit order; cancelling one mid-flight
    # would leave the host between two digests.
    concurrency:
      group: deploy-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    # Workload identity federation: a short-lived token GitHub mints for this
    # repository, not a stored credential.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the deploy script
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: deploy/domestique-deploy.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Tailscale ACL restricts this ephemeral tag:github node to port 22 of
      # tag:domestique, as one named account.
      - name: Join the tailnet
        # v4.1.3
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:github
          ping: ${{ vars.DOMESTIQUE_HOST }}
      # The host refuses anything that doesn't arrive as a parseable bash
      # script; a host whose copy predates --install-self needs it installed
      # by hand once, before this ever reaches it.
      - name: Install the deploy script
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
        run: |
          set -eu

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh --install-self \
            < deploy/domestique-deploy.sh
      # Only the digest crosses the boundary; the host composes the
      # reference, pins it, restarts, and rolls back on a failed health gate.
      - name: Deploy the published digest
        env:
          DEPLOY_HOST: ${{ vars.DOMESTIQUE_HOST }}
          DEPLOY_USER: ${{ vars.DOMESTIQUE_DEPLOY_USER }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -eu

          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "publish reported no digest to deploy: '${DIGEST}'"
              exit 1
              ;;
          esac

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/lib/domestique/domestique-deploy.sh "${DIGEST}"

  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - test
      - race
      - security
      - ui
      - coverage
      - build
      - image
      - prebuild
      - publish
      - deploy
    if: always()

    permissions: {}

    steps:
      - name: Report what ran
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu

          {
            echo "## CI results"
            echo
            echo "A job reads \`skipped\` when a path filter found nothing it"
            echo "gates, or when the event was the other one of pull request"
            echo "and push. That is a pass, not a gap."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Changes | ${CHANGES_RESULT} |"
            echo "| Lint | ${LINT_RESULT} |"
            echo "| Test | ${TEST_RESULT} |"
            echo "| Race | ${RACE_RESULT} |"
            echo "| Security | ${SECURITY_RESULT} |"
            echo "| UI | ${UI_RESULT} |"
            echo "| Coverage | ${COVERAGE_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Image | ${IMAGE_RESULT} |"
            echo "| Prebuild | ${PREBUILD_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            echo "| Deploy | ${DEPLOY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
      # `prebuild` is reported but not judged: it publishes and gates
      # nothing, so its failure only costs `publish` a few extra minutes.
      # `coverage` is not judged either: the ruleset reads Codecov's own
      # status for that, not this job.
      - name: Validate CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UI_RESULT: ${{ needs.ui.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |-
          set -eu

          for result in "$CHANGES_RESULT" "$LINT_RESULT" "$TEST_RESULT" \
            "$RACE_RESULT" "$SECURITY_RESULT" "$UI_RESULT" "$BUILD_RESULT" "$IMAGE_RESULT" \
            "$PUBLISH_RESULT" "$DEPLOY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "CI validation failed: dependency result was '$result'"
                exit 1
                ;;
            esac
          done
