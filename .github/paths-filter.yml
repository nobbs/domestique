lint:
  - "**"

# internal/readiness holds the Dockerfile, compose example, deploy script and
# container smoke test to their probe port and hardening, so those non-Go
# files are inputs of a Go test too.
go:
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".golangci.yml"
  - ".mise.toml"
  - "api/**"
  - "Dockerfile"
  - "mise-tasks.toml"
  - "docs/compose.example.yml"
  - "go.mod"
  - "go.sum"
  - "cmd/**"
  - "deploy/**"
  - "dev/**"
  - "internal/**"

# Also the stack the browser suite runs against: dev/demoapi over internal/demo.
ui:
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".mise.toml"
  - "api/**"
  - "mise-tasks.toml"
  - "go.mod"
  - "go.sum"
  - "dev/demo.sh"
  - "dev/demoapi/**"
  - "internal/demo/**"
  - "internal/webui/**"

# Decides whether a merge publishes; a commit that touches none of this
# leaves `latest` naming an earlier commit, by design, not stalled.
image:
  - ".dockerignore"
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".mise.toml"
  - "api/**"
  - "Dockerfile"
  - "mise-tasks.toml"
  - "go.mod"
  - "go.sum"
  - "cmd/**"
  - "internal/**"

# Narrower than `image`: only what changes the pull-request proving build and
# its smoke test, since re-proving an untouched Dockerfile costs minutes for
# nothing `build` hasn't already established.
container:
  - ".dockerignore"
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - "Dockerfile"
  - "mise-tasks.toml"
  - "dev/container-smoke.sh"
  - "go.mod"
  - "go.sum"
  - "internal/webui/app/package.json"
  - "internal/webui/app/pnpm-lock.yaml"
