# Path filters consumed by the CI workflow's "Changes" job. Each key becomes an
# output that gates downstream jobs, so a docs-only pull request skips the Go
# and image work instead of paying for it.
#
# Every filter includes this file and the workflow itself: a change to how CI
# decides what to run must always run everything it gates.
#
# `image` decides whether a merge publishes: anything the running binary is
# built from belongs in it. A commit that changes none of those paths publishes
# no image, and `latest` keeps naming an earlier commit; that is the intended
# result, not a stalled pipeline.
#
# `container` is deliberately narrower and gates only the pull-request proving
# build and the smoke test that runs its result, so the script that asserts the
# runtime contract belongs in it too. Re-proving an untouched Dockerfile against changed Go source costs four
# minutes and tells us what `build` already established, so the image is built
# before merge only when a container input moved: the Dockerfile itself, what it
# copies in, or a dependency manifest that resolves differently inside a build
# stage than on the runner. A Dockerfile break that slips past this is not an
# outage — the deployed digest keeps running — but it does redden the default
# branch, and the fix touches `container`, so the fix itself is proved before it
# merges.

lint:
  - "**"

go:
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".golangci.yml"
  - ".mise.toml"
  - "Makefile"
  - "go.mod"
  - "go.sum"
  - "cmd/**"
  - "dev/**"
  - "internal/**"

# `ui` also covers the stack the browser suite runs against: `make demo` builds
# `dev/demoapi` over the synthetic library in `internal/demo` and serves the
# embedded app, so a change to any of those can fail the UI job. The rest of the
# service is left to the `go` job, which tests it directly.
ui:
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".mise.toml"
  - "Makefile"
  - "go.mod"
  - "go.sum"
  - "dev/demo.sh"
  - "dev/demoapi/**"
  - "internal/demo/**"
  - "internal/webui/**"

image:
  - ".dockerignore"
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - ".mise.toml"
  - "Dockerfile"
  - "Makefile"
  - "go.mod"
  - "go.sum"
  - "cmd/**"
  - "internal/**"

container:
  - ".dockerignore"
  - ".github/paths-filter.yml"
  - ".github/workflows/ci.yml"
  - "Dockerfile"
  - "dev/container-smoke.sh"
  - "go.mod"
  - "go.sum"
  - "internal/webui/app/package.json"
  - "internal/webui/app/package-lock.json"
