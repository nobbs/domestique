<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in &middot; Domestique</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main { padding: 1.5rem; max-width: 32rem; text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <h1>Domestique</h1>
      <p>{{.Message}}</p>
      {{if .Subject}}<p><code>{{.Subject}}</code></p>{{end}}
      <p><a href="/auth/login">Try again</a></p>
    </main>
  </body>
</html>
